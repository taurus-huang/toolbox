  // last row) and RangeLines (that span plus one VisibleAreaLines' worth
  // of room) -- i.e. the total scroll distance, in this column's own
  // layout, over which that whole run of visible diff blocks travels from
  // just entering the viewport at the bottom to just leaving it at the
  // top. windowTop is the scrollTop at which it's *just* fully entering
  // from the bottom (frac 0); windowTop+rangePixels is the scrollTop at
  // which it's *just* fully left at the top (frac 1).
  function diffRangeWindow(col, idxMin, idxMax, clientHeight){
    const rangeTop = offsetForRow(col, state.diffBlocks[idxMin].start);
    const rangeBottom = rowBottomOffset(col, state.diffBlocks[idxMax].end);
    const diffRangePixels = rangeBottom - rangeTop; // DiffRangeLines, in pixels
    const rangePixels = diffRangePixels + clientHeight; // RangeLines, in pixels
    const windowTop = rangeTop - clientHeight;
    return {rangePixels, windowTop};
  }

  ids.forEach(id=>{
    const col = idToCol(id);
    document.getElementById(id).addEventListener('scroll', (e)=>{
      if(ignoreNextScroll[col]){ ignoreNextScroll[col] = false; return; }
      if(syncingScroll) return;
      syncingScroll = true;
      const srcCol = col;
      const top = e.target.scrollTop;
      const left = e.target.scrollLeft;

      // Find which row is at this pane's scroll position, for the
      // fallback exact-row alignment used when no diff block is visible
      // at all (plain unchanged content -- there's nothing for the
      // RangeLines approach below to key off of, so keep lining that up
      // row-for-row exactly, same as before).
      const row = rowAtOffset(srcCol, top);
      const remainder = top - offsetForRow(srcCol, row);

      // Step 6: work out how far through its own RangeLines window this
      // column's scroll position is (frac, 0..1), so every other column
      // can be scrolled to the same fraction through its own RangeLines
      // window -- lining up the *set* of diff blocks currently on screen
      // between columns, proportionally, rather than any single row.
      const range = visibleBlockIndexRange(srcCol, top, top + e.target.clientHeight);
      // If the caret currently belongs to one specific diff block (see
      // findFocusedBlockIndex above) and that block is part of the
      // visible run just computed, narrow proportional alignment down to
      // just that block's own top/bottom span instead of the whole
      // visible run -- so scrolling stays anchored to the block the user
      // is actually focused on, rather than drifting proportionally with
      // whatever else happens to be on screen alongside it. Otherwise,
      // fall back to the default whole-visible-run behavior as before.
      const focusedIdx = findFocusedBlockIndex();
      const effectiveRange = (range && focusedIdx !== null && focusedIdx >= range.idxMin && focusedIdx <= range.idxMax)
        ? {idxMin: focusedIdx, idxMax: focusedIdx}
        : range;
      let frac = null;
      if(effectiveRange){
        const srcWindow = diffRangeWindow(srcCol, effectiveRange.idxMin, effectiveRange.idxMax, e.target.clientHeight);
        frac = srcWindow.rangePixels > 0
          ? Math.max(0, Math.min(1, (top - srcWindow.windowTop) / srcWindow.rangePixels))
          : 0;
      }

      ids.forEach(other=>{
        if(other!==id){
          const el = document.getElementById(other);
          if(!el.closest('.pane').classList.contains('hidden')){
            const otherCol = idToCol(other);
            let newTop;
            if(effectiveRange){
              const otherWindow = diffRangeWindow(otherCol, effectiveRange.idxMin, effectiveRange.idxMax, el.clientHeight);
              newTop = otherWindow.windowTop + frac*otherWindow.rangePixels;
            } else {
              newTop = offsetForRow(otherCol, row) + remainder;
            }
            newTop = Math.max(0, newTop);
            // Only expect (and thus only ignore) an echo if we're actually
            // changing something -- an unchanged scrollTop/scrollLeft fires
            // no 'scroll' event at all, so flagging it anyway would leave
            // the flag stuck and wrongly swallow the pane's next real
            // user-initiated scroll.
            if(newTop !== el.scrollTop || left !== el.scrollLeft){
              ignoreNextScroll[otherCol] = true;
            }
            el.scrollTop = newTop;
            el.scrollLeft = left; // Sync horizontal scroll too, to make diff comparison easier
          }
        }
      });
      syncingScroll = false;
      updateGutterViewport();
    });
  });
}

/* Keyboard shortcuts for the First/Prev/Next/Last diff-navigation
   buttons: Ctrl+Alt+Up/Down for First/Last, Alt+Up/Down for Prev/Next.
   Routed through each button's own .click() (rather than calling
   goToDiff directly) so a disabled button -- e.g. Prev with no earlier
   diff to jump to -- correctly does nothing here too, same as clicking
   it by hand would. */
document.addEventListener('keydown', (e)=>{
  if(!e.altKey || e.shiftKey) return;
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const prefix = document.body.classList.contains('dir-mode') ? 'dv-nav-' : 'nav-';   // Directory Compare has its own buttons
  const btnId = (e.ctrlKey || e.metaKey)
    ? (e.key==='ArrowUp' ? prefix + 'first' : prefix + 'last')
    : (e.key==='ArrowUp' ? prefix + 'prev' : prefix + 'next');
  e.preventDefault();
  const btn = document.getElementById(btnId);
  if(btn) btn.click();
});

document.getElementById('btn-recompute').addEventListener('click', async () => {
  setStatus('Reloading files and recomputing diff...');
  
  // Reload each column that has a previously loaded file, in order,
  // remembering which ones couldn't be re-read (e.g. deleted or moved).
  const failed = [];
  if (state.cols.left.userLoaded  && await refreshFile('left')  === 'failed') failed.push('left');
  if (state.mode === '3way' && state.cols.mid.userLoaded && await refreshFile('mid') === 'failed') failed.push('mid');
  if (state.cols.right.userLoaded && await refreshFile('right') === 'failed') failed.push('right');
  
  // refreshFile already calls recompute() internally on success,
  // but call it again here to force a refresh even if no file actually changed
  recompute();
  if (failed.length) {
    // Don't overwrite with a success message: tell the user which file(s)
    // couldn't be reloaded, and that the previously loaded content is kept.
    const names = failed.map(colLabel).join(', ');
    const msg = `Re-diff: could not reload ${names} file — it may have been moved or deleted, or the browser can't re-read it. Showing previously loaded content.`;
    setStatus(msg, true);
    alert(msg); // status bar alone is easy to miss, so also show a visible notice
  } else {
    setStatus('All files reloaded and diff recomputed');
  }
});

/* Track where the user actually places the caret, so First/Prev/Next/Last
   can navigate relative to it instead of an independently-stepped counter.
   Also drives the current-line highlight: since each line is its own
   separate contenteditable div, moving the caret to a different line
   always re-fires focusin on a new element, so this is enough to catch
   every line-to-line move (click, arrow keys, Tab, etc.) without a full
   re-render -- render() applies the same class from state.cursorRow/
   cursorCol whenever a full re-render does happen (undo/redo, editing,
   merge/delete, diff navigation, ...) so the highlight stays correct
   either way. */
document.getElementById('editor-wrap').addEventListener('focusin', (e)=>{
  const el = e.target.closest('.content[contenteditable="true"]');
  if(!el) return;
  const row = parseInt(el.dataset.row, 10);
  const col = el.dataset.col;
  if(!Number.isNaN(row) && col){
    state.cursorRow = row;
    state.cursorCol = col;
    state.cursorGapAnchor = null;
    updateDiffNavButtonStates();
    setCurrentLineHighlight(row, col);
  }
});

/* Move the .current-line class to the given row/col without a full
   render() -- used for instant feedback on caret moves that don't
   otherwise trigger a re-diff/re-render. */
function setCurrentLineHighlight(row, col){
  document.querySelectorAll('.line.current-line').forEach(el=>{
    if(el.dataset.row !== String(row) || el.dataset.col !== col){
      el.classList.remove('current-line');
    }
  });
  const target = document.querySelector(`.line[data-row="${row}"][data-col="${col}"]`);
  if(target) target.classList.add('current-line');
}

/* ======================================================================
   Keyboard Up/Down navigation: move the caret to the same horizontal
   position on the previous/next real (non-gap) line within the same
   column, since each line is its own separate contenteditable div and
   the browser has no notion of "the line above" across that boundary.
   ====================================================================== */

/* Character offset of the caret within el's own text content (counting
   through any nested spans, e.g. the intra-line diff highlight markup). */
function getCaretCharOffset(el){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  return pre.toString().length;
}

/* Place the caret at the given character offset within el (clamped to
   el's text length), walking through any nested text nodes. */
function setCaretCharOffset(el, offset){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let remaining = offset;
  let node = walker.nextNode();
  let target = el, targetOffset = 0;
  while(node){
    const len = node.textContent.length;
    if(remaining <= len){ target = node; targetOffset = remaining; break; }
    remaining -= len;
    const next = walker.nextNode();
    if(!next){ target = node; targetOffset = len; break; } // clamp to end of last text node
    node = next;
  }
  const sel = window.getSelection();
  if(!sel) return;
  const range = document.createRange();
  try{
    range.setStart(target, targetOffset);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(err){ /* ignore */ }
}

/* Same walk as setCaretCharOffset, but returns the resolved (node, offset)
   pair instead of applying it to the Selection -- used by keyboard
   Shift+Arrow selection below, which needs to hand that pair to
   extendToPoint rather than collapse the caret onto it. */
function nodeOffsetForCharOffset(el, offset){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let remaining = offset;
  let node = walker.nextNode();
  if(!node) return {node: el, offset: 0};
  let target = node, targetOffset = 0;
  while(node){
    const len = node.textContent.length;
    if(remaining <= len){ target = node; targetOffset = remaining; break; }
    remaining -= len;
    const next = walker.nextNode();
    if(!next){ target = node; targetOffset = len; break; } // clamp to end of last text node
    node = next;
  }
  return {node: target, offset: targetOffset};
}

document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos to default handling
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const col = el.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return;
  // Only the real (non-gap) lines in this column have a .content element,
  // in top-to-bottom order, so stepping through this list already skips
  // gap markers correctly.
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  const idx = allContents.indexOf(el);
  if(idx === -1) return;
  const targetIdx = e.key==='ArrowDown' ? idx+1 : idx-1;
  if(targetIdx < 0 || targetIdx >= allContents.length) return; // already at first/last line

  e.preventDefault();
  const charOffset = getCaretCharOffset(el);
  const targetEl = allContents[targetIdx];
  targetEl.focus({preventScroll:true});
  setCaretCharOffset(targetEl, charOffset);

  // Scroll the target line into view within its own pane only if needed,
  // without disturbing horizontal scroll position.
  const paneScroll = container.parentElement;
  const lineEl = targetEl.closest('.line');
  if(paneScroll && lineEl){
    const scrollRect = paneScroll.getBoundingClientRect();
    const lineRect = lineEl.getBoundingClientRect();
    if(lineRect.top < scrollRect.top){
      paneScroll.scrollTop -= (scrollRect.top - lineRect.top);
    } else if(lineRect.bottom > scrollRect.bottom){
      paneScroll.scrollTop += (lineRect.bottom - scrollRect.bottom);
    }
  }
});

/* Plain (non-shift) Left/Right at the very start/end of a line: same
   fundamental issue as Up/Down and Shift+Arrow above -- each line is its
   own separate contenteditable div, so by default there's nothing on the
   other side of that boundary for the caret to move into, and Left/Right
   just stop dead at the edge instead of continuing into the
   previous/next line like a normal text editor. Only takes over right at
   that edge; ordinary within-line movement is left to the browser. */
document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos (shift-select, word-jump) to default/other handling
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || !sel.isCollapsed) return; // an active selection collapsing onto one edge is the browser's own job

  const charOffset = getCaretCharOffset(el);
  if(e.key === 'ArrowRight' && charOffset < el.textContent.length) return; // not at the end yet -- native handles this
  if(e.key === 'ArrowLeft' && charOffset > 0) return; // not at the start yet -- native handles this

  const col = el.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return;
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  const idx = allContents.indexOf(el);
  if(idx === -1) return;
  const targetIdx = e.key==='ArrowRight' ? idx+1 : idx-1;
  if(targetIdx < 0 || targetIdx >= allContents.length) return; // already at the very first/last line

  e.preventDefault();
  const targetEl = allContents[targetIdx];
  targetEl.focus({preventScroll:true});
  setCaretCharOffset(targetEl, e.key==='ArrowRight' ? 0 : targetEl.textContent.length);

  // Scroll the target line into view within its own pane only if needed,
  // without disturbing horizontal scroll position -- same as plain Up/Down
  // above.
  const paneScroll = container.parentElement;
  const lineEl = targetEl.closest('.line');
  if(paneScroll && lineEl){
    const scrollRect = paneScroll.getBoundingClientRect();
    const lineRect = lineEl.getBoundingClientRect();
    if(lineRect.top < scrollRect.top){
      paneScroll.scrollTop -= (scrollRect.top - lineRect.top);
    } else if(lineRect.bottom > scrollRect.bottom){
      paneScroll.scrollTop += (lineRect.bottom - scrollRect.bottom);
    }
  }
});

/* PageUp/PageDown: scroll the pane by one screenful and move the caret
   along with it, like a normal text editor -- by default the browser just
   tries to page-scroll within whichever tiny per-line contenteditable div
   currently has focus (the same per-line-div issue as Up/Down and
   Left/Right above), which visibly does nothing useful and leaves the
   caret behind wherever it was. Moves the caret by the same number of
   lines the view scrolls, so it lands in roughly the same on-screen spot
   as before, the same as most editors. */
document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'PageUp' && e.key !== 'PageDown') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos to default handling
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const col = el.dataset.col;
  const container = document.getElementById('lines-' + col);
  const paneScroll = document.getElementById('scroll-' + col);
  if(!container || !paneScroll) return;

  e.preventDefault();

  // Only the real (non-gap) lines in this column have a .content element,
  // in top-to-bottom order, so stepping through this list already skips
  // gap markers correctly (same as Up/Down above); gap rows also take up
  // zero rendered height (see LINE_H usage elsewhere), so counting by
  // index here lines up with counting by pixels below.
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  const idx = allContents.indexOf(el);
  if(idx === -1) return;

  // How many lines make up one "page": as many whole lines as fit in the
  // pane's visible height. Using this same line count for both the scroll
  // distance and the caret's line movement keeps them in lockstep, so the
  // caret ends up at roughly the same on-screen row after paging.
  const linesPerPage = Math.max(1, Math.floor(paneScroll.clientHeight / LINE_H));
  const direction = e.key === 'PageDown' ? 1 : -1;

  const maxScrollTop = Math.max(0, paneScroll.scrollHeight - paneScroll.clientHeight);
  const newScrollTop = Math.max(0, Math.min(maxScrollTop, paneScroll.scrollTop + direction*linesPerPage*LINE_H));
  paneScroll.scrollTop = newScrollTop; // the existing scroll-sync listener (setupScrollSync) keeps the other panes aligned to this

  const targetIdx = Math.max(0, Math.min(allContents.length-1, idx + direction*linesPerPage));
  const charOffset = getCaretCharOffset(el);
  const targetEl = allContents[targetIdx];
  targetEl.focus({preventScroll:true});
  setCaretCharOffset(targetEl, charOffset);
});

/* ======================================================================
   Delete-at-end-of-line / Backspace-at-start-of-line: each line is its
   own separate contenteditable div (see renderColumn), so by default
   there's nothing on the other side of the div boundary for these keys to
   reach across -- pressing Delete at the end of a line or Backspace at
   the start of one would otherwise just do nothing. Handle both here so
   they behave like a normal text editor: merge this line with the
   neighboring one in the same column, dropping the newline between them.
   ====================================================================== */

/* Character offset of a given Range boundary (node, offset), counted
   within el's own text content. Same walk as getCaretCharOffset but for
   an arbitrary boundary rather than always the live selection's start,
   so it can be reused for both ends of a cross-line selection. */
function charOffsetInEl(el, node, offset){
  const pre = document.createRange();
  pre.selectNodeContents(el);
  try{ pre.setEnd(node, offset); }
  catch(err){ return el.textContent.length; }
  return pre.toString().length;
}

/* Replace the current selection with insertText, exactly like a normal
   text editor does when you type/paste/press Enter/Backspace over a
   selection -- even though here the selection may span several lines
   that are each their own separate contenteditable div (see
   renderColumn), so the browser has no native way to do this itself.
   insertText may itself contain '\n' (e.g. a multi-line paste), which
   splits into that many resulting lines. Passing '' just deletes the
   selection (used for Backspace/Delete/Cut). Returns true if a
   cross-line selection was found and handled, false otherwise (e.g. the
   selection was collapsed or confined to a single line, in which case
   the browser's own native editing already does the right thing and
   should be left alone). */
function replaceCrossLineSelection(insertText){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col) return false;
  if(startEl === endEl) return false; // single line: native editing already handles this

  const col = startEl.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return false;

  // Pull every line's LIVE (possibly not-yet-committed) text straight from
  // the DOM, same approach as mergeLinesInColumn/commitColumnEdits.
  const lineEls = container.querySelectorAll('.line:not(.empty) .content[contenteditable="true"]');
  const liveLines = [];
  lineEls.forEach(elx=>{ liveLines[+elx.dataset.lineIdx] = elx.textContent.replace(/\r/g, ''); });

  const startLineIdx = parseInt(startEl.dataset.lineIdx, 10);
  const endLineIdx = parseInt(endEl.dataset.lineIdx, 10);
  if(Number.isNaN(startLineIdx) || Number.isNaN(endLineIdx)) return false;
  // range.startContainer/endContainer are always in document order (earlier
  // point first) regardless of which direction the user dragged (see the
  // copy handler below), so startLineIdx is always <= endLineIdx here.
  const startCharOffset = charOffsetInEl(startEl, range.startContainer, range.startOffset);
  const endCharOffset = charOffsetInEl(endEl, range.endContainer, range.endOffset);

  const prefix = (liveLines[startLineIdx] || '').slice(0, startCharOffset);
  const suffix = (liveLines[endLineIdx] || '').slice(endCharOffset);

  const pieces = (insertText || '').split('\n');
  pieces[0] = prefix + pieces[0];
  pieces[pieces.length-1] = pieces[pieces.length-1] + suffix;
  liveLines.splice(startLineIdx, endLineIdx-startLineIdx+1, ...pieces);

  // A pending debounced commit from ordinary typing is now superseded by
  // this (which already reads the live, up-to-the-moment text) -- cancel
  // it so it doesn't redundantly re-fire and re-render afterward.
  if(editDebounce){ clearTimeout(editDebounce); editDebounce = null; }

  pushHistory(col);
  state.cols[col].text = liveLines.join('\n');

  const lastIdx = pieces.length-1;
  const targetLineIdx = startLineIdx + lastIdx;
  const targetOffset = pieces[lastIdx].length - suffix.length;
  recompute({keepView:true, restoreCaret:{col, lineIdx:targetLineIdx, offset:targetOffset}});
  return true;
}

/* Merge line lineIdx with the following line (lineIdx+1) in the given
   column, dropping the newline between them -- this is what actually
   makes Delete-at-end-of-line / Backspace-at-start-of-line do something,
   since (as explained above) there's otherwise nothing on the other side
   of the per-line contenteditable boundary for those keys to reach
   across. Reads every line's LIVE (possibly not-yet-committed) text
   straight from the DOM, same approach as
   replaceCrossLineSelection/commitColumnEdits, so an in-progress edit on
   either line isn't lost. The caret ends up at the junction point, i.e.
   the end of line lineIdx's original text, so typing continues exactly
   where the deleted newline used to be. */
function mergeLinesInColumn(col, lineIdx){
  const container = document.getElementById('lines-' + col);
  if(!container) return;

  const lineEls = container.querySelectorAll('.line:not(.empty) .content[contenteditable="true"]');
  const liveLines = [];
  lineEls.forEach(elx=>{ liveLines[+elx.dataset.lineIdx] = elx.textContent.replace(/\r/g, ''); });

  if(lineIdx < 0 || lineIdx+1 >= liveLines.length) return;

  const joinOffset = (liveLines[lineIdx] || '').length;
  liveLines.splice(lineIdx, 2, (liveLines[lineIdx] || '') + (liveLines[lineIdx+1] || ''));

  // A pending debounced commit from ordinary typing is now superseded by
  // this (which already reads the live, up-to-the-moment text) -- cancel
  // it so it doesn't redundantly re-fire and re-render afterward.
  if(editDebounce){ clearTimeout(editDebounce); editDebounce = null; }

  pushHistory(col);
  state.cols[col].text = liveLines.join('\n');
  recompute({keepView:true, restoreCaret:{col, lineIdx, offset:joinOffset}});
}

document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'Delete' && e.key !== 'Backspace') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos (e.g. word-delete) to default handling
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return;

  if(!sel.isCollapsed){
    // A real selection exists. If it's confined to this one line's own
    // contenteditable div, the browser's native delete-selection handling
    // already works correctly -- leave it alone. If it spans multiple
    // lines, replaceCrossLineSelection does the equivalent by hand.
    if(replaceCrossLineSelection('')) e.preventDefault();
    return;
  }

  const col = el.dataset.col;
  const lineIdx = parseInt(el.dataset.lineIdx, 10);
  if(Number.isNaN(lineIdx)) return;

  const caretOffset = getCaretCharOffset(el);
  const textLen = el.textContent.length;

  if(e.key === 'Delete' && caretOffset === textLen){
    e.preventDefault();
    mergeLinesInColumn(col, lineIdx);
  } else if(e.key === 'Backspace' && caretOffset === 0 && lineIdx > 0){
    e.preventDefault();
    mergeLinesInColumn(col, lineIdx-1);
  }
});

/* Split line lineIdx into two at [startOffset, endOffset) (a collapsed
   caret when startOffset===endOffset, otherwise the line's own selected
   text gets dropped, same as a normal editor overtyping a selection),
   pushing everything from the split point onward onto a brand-new line
   in state. This is the single-line counterpart to
   replaceCrossLineSelection: it exists because Enter can't just be left
   to the browser's default contenteditable behavior here (see below). */
function splitLineInColumn(col, lineIdx, startOffset, endOffset){
  const container = document.getElementById('lines-' + col);
  if(!container) return;

  const lineEls = container.querySelectorAll('.line:not(.empty) .content[contenteditable="true"]');
  const liveLines = [];
  lineEls.forEach(elx=>{ liveLines[+elx.dataset.lineIdx] = elx.textContent.replace(/\r/g, ''); });
  if(lineIdx < 0 || lineIdx >= liveLines.length) return;

  const line = liveLines[lineIdx] || '';
  const prefix = line.slice(0, startOffset);
  const suffix = line.slice(endOffset);
  liveLines.splice(lineIdx, 1, prefix, suffix);

  // A pending debounced commit from ordinary typing is now superseded by
  // this (which already reads the live, up-to-the-moment text) -- cancel
  // it so it doesn't redundantly re-fire and re-render afterward.
  if(editDebounce){ clearTimeout(editDebounce); editDebounce = null; }

  pushHistory(col);
  state.cols[col].text = liveLines.join('\n');
  recompute({keepView:true, restoreCaret:{col, lineIdx:lineIdx+1, offset:0}});
}

/* Enter key. Each line is rendered as its own separate contenteditable
   div (see renderColumn), so there is no surrounding document flow for
   the browser's native "split into a new line" behavior to fall into --
   left to itself, the browser can only fake a second line inside that
   same single-line div (e.g. via a <br> or a nested block), which looks
   like a real line break for a moment. But nothing in state knows about
   that fake line: the next debounced commit reads the div's flattened
   textContent back as one line, and recompute() re-renders straight from
   state, so the fake line break silently collapses back into a single
   line a moment later. Handle Enter manually in every case -- collapsed
   caret, a selection within one line, or a selection spanning several
   lines -- so it always turns into a real new line in state instead. */
document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter' || e.ctrlKey || e.metaKey || e.altKey) return;
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const sel = window.getSelection();
  if(sel && sel.rangeCount>0 && !sel.isCollapsed){
    const range = sel.getRangeAt(0);
    const startEl = closestContentEl(range.startContainer);
    const endEl = closestContentEl(range.endContainer);
    if(startEl && endEl && startEl.dataset.col===endEl.dataset.col && startEl!==endEl){
      e.preventDefault();
      replaceCrossLineSelection('\n');
      return;
    }
    if(startEl===el && endEl===el){
      e.preventDefault();
      const startOffset = charOffsetInEl(el, range.startContainer, range.startOffset);
      const endOffset = charOffsetInEl(el, range.endContainer, range.endOffset);
      const col = el.dataset.col;
      const lineIdx = parseInt(el.dataset.lineIdx, 10);
      if(Number.isNaN(lineIdx)) return;
      splitLineInColumn(col, lineIdx, Math.min(startOffset,endOffset), Math.max(startOffset,endOffset));
      return;
    }
  }

  // Collapsed caret within a single line.
  e.preventDefault();
  const col = el.dataset.col;
  const lineIdx = parseInt(el.dataset.lineIdx, 10);
  if(Number.isNaN(lineIdx)) return;
  const offset = getCaretCharOffset(el);
  splitLineInColumn(col, lineIdx, offset, offset);
});

/* Typing a character, IME composition, or a paste/drag-drop while a
   cross-line selection is active: beforeinput is the only reliable place
   to catch the actual text being inserted (arbitrary characters, IME
   results, or clipboard/drag contents), which keydown alone can't give
   us. deleteContentBackward/Forward are also handled here as a fallback
   for input methods (e.g. some virtual keyboards) that go straight to
   beforeinput without a matching keydown Backspace/Delete. */
document.getElementById('editor-wrap').addEventListener('beforeinput', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col || startEl===endEl) return;

  let insertText = null;
  if(e.inputType==='insertText' || e.inputType==='insertReplacementText'){
    insertText = e.data || '';
  } else if(e.inputType==='insertFromPaste' || e.inputType==='insertFromDrop'){
    insertText = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || '';
  } else if(e.inputType==='insertParagraph' || e.inputType==='insertLineBreak'){
    insertText = '\n';
  } else if(e.inputType==='deleteContentBackward' || e.inputType==='deleteContentForward'){
    insertText = '';
  } else {
    return; // some other input type over a cross-line selection -- leave untouched
  }

  e.preventDefault();
  replaceCrossLineSelection(insertText);
});

/* Multi-line text selection: each line is rendered as its own separate
   contenteditable div (see renderColumn), which browsers treat as an
   editing boundary during a native mouse drag -- dragging from one line
   into the next just gets clipped at that boundary, so only a single
   line's text could ever be selected. Handling the drag manually with the
   Selection API bypasses that per-element clipping, letting a drag span
   any number of lines within the same pane, same as a normal editor. */
(function setupMultiLineSelection(){
  let isSelecting = false;
  // The anchor is the fixed end of the selection (where a plain click
  // started it); it persists after mouseup so a later Shift+click can
  // extend the selection from that same point, like a normal text editor.
  let anchorNode = null, anchorOffset = 0, anchorCol = null;

  // Latest raw pointer position, updated on every mousemove while
  // selecting. Read by the auto-scroll frame loop below rather than
  // driving selection directly from the mousemove event, so that holding
  // the pointer still at the pane's edge keeps scrolling (and extending
  // the selection) frame after frame, the same as a native text editor --
  // not just on the moves that happen to occur.
  let lastClientX = 0, lastClientY = 0;
  let autoScrollHandle = null;

  const editorWrapEl = document.getElementById('editor-wrap');

  function caretFromPoint(x, y){
    if(document.caretPositionFromPoint){
      const pos = document.caretPositionFromPoint(x, y);
      if(pos) return {node: pos.offsetNode, offset: pos.offset};
    }
    if(document.caretRangeFromPoint){
      const range = document.caretRangeFromPoint(x, y);
      if(range) return {node: range.startContainer, offset: range.startOffset};
    }
    return null;
  }

  /* True if (nodeA, offsetA) sits after (nodeB, offsetB) in document order.
     Used below to always hand setBaseAndExtent its two endpoints in
     document order, regardless of which one the user actually clicked
     first -- see extendTo. */
  function isAfter(nodeA, offsetA, nodeB, offsetB){
    const rA = document.createRange();
    rA.setStart(nodeA, offsetA);
    const rB = document.createRange();
    rB.setStart(nodeB, offsetB);
    return rA.compareBoundaryPoints(Range.START_TO_START, rB) > 0;
  }

  /* Core of extendTo below, factored out so keyboard Shift+Arrow selection
     (see setupKeyboardSelection further down) can extend the selection to
     an arbitrary (node, offset) it computed itself, the same way a mouse
     drag extends to wherever the pointer is. */
  function extendToPoint(node, offset){
    if(!anchorNode) return;
    const sel = window.getSelection();
    if(!sel) return;
    try{
      // Chrome bug: when the drag's starting point (offset 0, i.e. the
      // very front of a line) ends up as the Selection's "base" of a
      // *backward* selection -- which happens whenever the user starts
      // right at the front of a line and drags upward into an earlier
      // line's separate contenteditable div -- the resulting Selection
      // silently breaks: its toString() comes back empty and the native
      // right-click "Copy" menu item is disabled, even though the
      // selected Range itself is perfectly valid. Our own anchor
      // bookkeeping above (anchorNode/anchorOffset, used for future
      // shift+click extension) doesn't care which endpoint the native
      // Selection calls "base" vs "extent", and neither does anything
      // downstream (buildMultiLineClipboardText etc. all read
      // range.startContainer/endContainer, which are already normalized
      // to document order regardless). So always pass the two endpoints
      // to setBaseAndExtent in document order -- this yields the exact
      // same selected Range as before, just always as a "forward"
      // selection, which never hits the bug.
      let baseNode = anchorNode, baseOffset = anchorOffset;
      let extNode = node, extOffset = offset;
      if(isAfter(baseNode, baseOffset, extNode, extOffset)){
        [baseNode, baseOffset, extNode, extOffset] = [extNode, extOffset, baseNode, baseOffset];
      }
      sel.setBaseAndExtent(baseNode, baseOffset, extNode, extOffset);
    }catch(err){ /* point briefly resolved to an invalid range mid-drag; ignore */ }
  }

  /* If (node, offset) isn't inside any line's editable .content -- most
     commonly because it landed in that line's line-number gutter cell
     (.num), which sits immediately to the left of .content within the
     same .line row -- snap it to the start of that line's .content
     instead. This matters because a drag released past the pane's left
     edge gets clamped by autoScrollTick below to just inside the pane's
     own bounding box (rect.left + 1), which is still well within the
     46px-wide .num column, not .content. Left un-snapped, the resulting
     caret point sits on plain non-editable text; handing that to
     setBaseAndExtent silently leaves no contenteditable element focused,
     so a later Backspace/Delete keydown has nothing valid to target and
     does nothing at all -- even though window.getSelection() still shows
     a seemingly valid, non-collapsed selection. */
  function snapCaretIntoContent(node, offset){
    if(!node) return null;
    if(closestContentEl(node)) return {node, offset};
    const el = node.nodeType === 1 ? node : node.parentElement;
    const lineEl = el && el.closest('.line');
    const contentEl = lineEl && lineEl.querySelector('.content[contenteditable="true"]');
    return contentEl ? {node: contentEl, offset: 0} : null;
  }

  function extendTo(x, y){
    const caret = caretFromPoint(x, y);
    if(!caret) return;
    const snapped = snapCaretIntoContent(caret.node, caret.offset);
    if(!snapped) return;
    extendToPoint(snapped.node, snapped.offset);
  }

  /* Whether (x,y) falls inside the current (possibly cross-line) selection.
     Range.comparePoint compares plain document position, so it works here
     even though the selection's two ends can sit in two different
     per-line contenteditable divs -- it doesn't care that they're
     separate editable roots, only where they fall in document order. */
  function isPointWithinSelection(x, y){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0 || sel.isCollapsed) return false;
    const caret = caretFromPoint(x, y);
    if(!caret) return false;
    const range = sel.getRangeAt(0);
    try{ return range.comparePoint(caret.node, caret.offset) === 0; }
    catch(err){ return false; }
  }

  function scrollElForCol(col){
    if(col === 'left') return document.getElementById('scroll-left');
    if(col === 'mid') return document.getElementById('scroll-mid');
    if(col === 'right') return document.getElementById('scroll-right');
    return null;
  }

  // Edge-scroll tuning: within EDGE_MARGIN px of the pane's inner edge,
  // scroll speed ramps up from near-zero to MAX_SPEED; once the pointer
  // is actually outside the pane, speed stays pinned at MAX_SPEED (scaled
  // slightly further by how far outside it is, capped) so dragging far
  // past the edge doesn't feel any different from a native editor.
  const EDGE_MARGIN = 34;
  const MAX_SPEED = 24;

  function edgeSpeed(pos, nearEdge, farEdge, sign){
    // sign: -1 => this is the "start" edge (top/left), scrolling should
    // be negative when triggered; +1 => "end" edge (bottom/right).
    if(sign < 0){
      if(pos >= nearEdge) return 0;
      if(pos <= farEdge) return -MAX_SPEED;
      const t = 1 - (pos - farEdge) / (nearEdge - farEdge);
      return -Math.max(2, Math.round(MAX_SPEED * t));
    } else {
      if(pos <= nearEdge) return 0;
      if(pos >= farEdge) return MAX_SPEED;
      const t = 1 - (farEdge - pos) / (farEdge - nearEdge);
      return Math.max(2, Math.round(MAX_SPEED * t));
    }
  }

  function autoScrollTick(){
    if(!isSelecting){ autoScrollHandle = null; return; }
    const scrollEl = scrollElForCol(anchorCol);
    if(scrollEl){
      const rect = scrollEl.getBoundingClientRect();

      const dy = lastClientY < rect.top + EDGE_MARGIN
        ? edgeSpeed(lastClientY, rect.top + EDGE_MARGIN, rect.top - EDGE_MARGIN, -1)
        : edgeSpeed(lastClientY, rect.bottom - EDGE_MARGIN, rect.bottom + EDGE_MARGIN, 1);
      const dx = lastClientX < rect.left + EDGE_MARGIN
        ? edgeSpeed(lastClientX, rect.left + EDGE_MARGIN, rect.left - EDGE_MARGIN, -1)
        : edgeSpeed(lastClientX, rect.right - EDGE_MARGIN, rect.right + EDGE_MARGIN, 1);

      if(dy) scrollEl.scrollTop += dy;
      if(dx) scrollEl.scrollLeft += dx;

      // Extend the selection every frame (not just on scroll) so a
      // stationary pointer inside the pane still tracks smoothly, and
      // clamp the point used for hit-testing to just inside the pane so
      // a pointer that has wandered outside it (above/below/left/right)
      // still resolves to a real caret at that boundary, expanding the
      // selection right up to the newly-scrolled-in content.
      const px = Math.min(Math.max(lastClientX, rect.left + 1), rect.right - 1);
      const py = Math.min(Math.max(lastClientY, rect.top + 1), rect.bottom - 1);
      extendTo(px, py);
    }
    autoScrollHandle = requestAnimationFrame(autoScrollTick);
  }

  function startSelecting(){
    isSelecting = true;
    editorWrapEl.classList.add('is-selecting');
    if(autoScrollHandle === null) autoScrollHandle = requestAnimationFrame(autoScrollTick);
  }

  function stopSelecting(){
    isSelecting = false;
    editorWrapEl.classList.remove('is-selecting');
    if(autoScrollHandle !== null){ cancelAnimationFrame(autoScrollHandle); autoScrollHandle = null; }
  }

  editorWrapEl.addEventListener('mousedown', (e)=>{
    if(e.button === 2){
      // Right-click: a browser normally leaves an existing selection alone
      // (and shows "Copy" in its context menu) as long as the click lands
      // inside it, only collapsing it to the click point otherwise. But
      // since each line here is its own separate contenteditable div (see
      // renderColumn), a selection spanning more than one line is a range
      // straddling multiple editable roots rather than the single-field
      // selection the browser expects, and its default mousedown handling
      // clears that instead of recognizing the click as "inside" it.
      // Detect that case ourselves and suppress the default handling so
      // the selection -- and with it, native right-click > Copy -- survives.
      if(isPointWithinSelection(e.clientX, e.clientY)) e.preventDefault();
      return;
    }
    if(e.button !== 0) return; // left button only
    if(e.detail > 1) return; // let native double/triple-click word/line selection behave normally
    const contentEl = e.target.closest('.content[contenteditable="true"]');
    if(!contentEl || e.target.closest('.actbtn')) return;

    lastClientX = e.clientX; lastClientY = e.clientY;

    if(e.shiftKey && anchorNode && anchorCol === contentEl.dataset.col){
      // Shift+click: keep the existing anchor and just extend the
      // selection's other end to the click point, same as native
      // shift+click text selection.
      e.preventDefault();
      startSelecting();
      extendTo(e.clientX, e.clientY);
      return;
    }

    // Plain click: start a brand new selection anchored here. Suppress the
    // browser's own default mousedown selection handling and place the
    // (initially collapsed) caret ourselves -- if we let it run alongside
    // our mousemove-driven extension below, the two fight over the
    // selection during a drag (the native one keeps clipping back to a
    // single contenteditable line), which is what made a plain drag
    // intermittently only select one line.
    e.preventDefault();
    startSelecting();
    anchorCol = contentEl.dataset.col;
    const caret = caretFromPoint(e.clientX, e.clientY);
    anchorNode = caret ? caret.node : contentEl;
    anchorOffset = caret ? caret.offset : 0;
    contentEl.focus({preventScroll:true});
    const sel = window.getSelection();
    if(sel){
      try{ sel.setBaseAndExtent(anchorNode, anchorOffset, anchorNode, anchorOffset); }
      catch(err){ /* ignore */ }
    }
  });

  document.addEventListener('mousemove', (e)=>{
    if(!isSelecting || !anchorNode) return;
    lastClientX = e.clientX; lastClientY = e.clientY;
    // The auto-scroll frame loop (started on mousedown) reads
    // lastClientX/Y every frame and both scrolls the pane when the
    // pointer is near/past its edge and extends the selection
    // accordingly, so no direct extendTo() call is needed here -- that
    // keeps a single code path for both in-bounds dragging and
    // edge/out-of-bounds dragging instead of two that can disagree.
  });

  document.addEventListener('mouseup', ()=>{
    stopSelecting();
  });

  /* Shift+Arrow keyboard selection: for the same reason plain Up/Down
     navigation and mouse-drag selection above both need custom handling
     -- each line is its own separate contenteditable div, so there's
     nothing on the other side of that boundary for the browser's own
     shift+arrow extension to reach across -- native shift+arrow can only
     ever extend as far as the edge of whichever line currently has focus.
     Reuses this same IIFE's anchor/extendToPoint machinery, so a
     selection can be started or continued interchangeably with the mouse
     or the keyboard, and the result is exactly the same kind of Selection
     either way -- meaning it's already copy/cut/context-menu-safe via the
     handlers below (buildMultiLineClipboardText, the 'copy'/'cut'
     listeners, and the contextmenu listener) without any changes there. */
  function isSamePoint(nodeA, offsetA, nodeB, offsetB){
    return nodeA === nodeB && offsetA === offsetB;
  }

  document.addEventListener('keydown', (e)=>{
    if(!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos to default handling
    if(e.key!=='ArrowUp' && e.key!=='ArrowDown' && e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    const focusEl = document.activeElement && document.activeElement.closest
      && document.activeElement.closest('.content[contenteditable="true"]');
    if(!focusEl) return;

    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return;

    let curNode, curOffset;
    // Whether the *existing* selection (if any) already spans more than
    // one line. If it does, native Left/Right handling can't be trusted
    // even for a move that wouldn't itself cross a line boundary -- the
    // browser has no notion of "the other end lives in a different
    // contenteditable div" and tends to just drop that end rather than
    // preserve it, collapsing the selection back onto a single line. So
    // once a selection is already cross-line, every further Left/Right
    // press has to be handled here too, not just the ones that cross a
    // new boundary.
    let alreadyCrossLine;
    if(sel.isCollapsed){
      // Nothing selected yet: this press starts a fresh selection,
      // anchored at wherever the caret currently sits (same as native
      // shift+arrow).
      const range = sel.getRangeAt(0);
      anchorNode = range.startContainer; anchorOffset = range.startOffset;
      anchorCol = focusEl.dataset.col;
      curNode = anchorNode; curOffset = anchorOffset;
      alreadyCrossLine = false;
    } else if(anchorNode && anchorCol === focusEl.dataset.col){
      // Continuing an existing selection (started here by an earlier
      // shift+arrow press, a mouse drag, or a shift+click): find the
      // *other* end -- the one currently moving -- by checking which of
      // the Selection's two ends matches our tracked, never-moving
      // anchor. This can't just always be sel.focusNode: extendToPoint
      // always passes its two endpoints to setBaseAndExtent in document
      // order (see the comment there), so which of anchorNode/focusNode
      // holds our fixed anchor vs. the moving end flips depending on
      // whether the selection is extending forward or backward from it.
      if(isSamePoint(sel.anchorNode, sel.anchorOffset, anchorNode, anchorOffset)){
        curNode = sel.focusNode; curOffset = sel.focusOffset;
      } else {
        curNode = sel.anchorNode; curOffset = sel.anchorOffset;
      }
      const selAnchorEl = closestContentEl(sel.anchorNode);
      const selFocusEl = closestContentEl(sel.focusNode);
      alreadyCrossLine = !selAnchorEl || !selFocusEl || selAnchorEl !== selFocusEl;
    } else {
      return; // a selection exists but isn't one we're tracking here (e.g. spans columns) -- leave it to the browser
    }

    const curEl = closestContentEl(curNode);
    if(!curEl) return;
    const col = curEl.dataset.col;
    const container = document.getElementById('lines-' + col);
    if(!container) return;
    // Only the real (non-gap) lines in this column have a .content
    // element, in top-to-bottom order, so stepping through this list
    // already skips gap markers correctly (same as plain Up/Down above).
    const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
    const curIdx = allContents.indexOf(curEl);
    if(curIdx === -1) return;

    let targetEl = curEl, targetOffset;

    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      const charOffset = charOffsetInEl(curEl, curNode, curOffset);
      if(e.key === 'ArrowRight'){
        if(charOffset < curEl.textContent.length){
          if(!alreadyCrossLine) return; // simple in-line extension: native already handles this correctly
          targetOffset = charOffset + 1; // still cross-line elsewhere -- must keep handling it ourselves to preserve that other end
        } else if(curIdx+1 < allContents.length){
          targetEl = allContents[curIdx+1];
          targetOffset = 0;
        } else {
          if(alreadyCrossLine) e.preventDefault(); // nothing further to extend to, but don't let native touch a cross-line selection
          return;
        }
      } else {
        if(charOffset > 0){
          if(!alreadyCrossLine) return; // simple in-line extension: native already handles this correctly
          targetOffset = charOffset - 1;
        } else if(curIdx-1 >= 0){
          targetEl = allContents[curIdx-1];
          targetOffset = targetEl.textContent.length;
        } else {
          if(alreadyCrossLine) e.preventDefault();
          return;
        }
      }
    } else {
      const targetIdx = e.key==='ArrowDown' ? curIdx+1 : curIdx-1;
      if(targetIdx < 0 || targetIdx >= allContents.length){
        if(alreadyCrossLine) e.preventDefault();
        return; // already at the first/last line
      }
      targetEl = allContents[targetIdx];
      const charOffset = charOffsetInEl(curEl, curNode, curOffset);
      targetOffset = Math.min(charOffset, targetEl.textContent.length);
    }

    e.preventDefault();
    const target = nodeOffsetForCharOffset(targetEl, targetOffset);
    extendToPoint(target.node, target.offset);

    // Scroll the target line into view within its own pane if needed,
    // same as plain (non-shift) Up/Down navigation above.
    const paneScroll = container.parentElement;
    const lineEl = targetEl.closest('.line');
    if(paneScroll && lineEl){
      const scrollRect = paneScroll.getBoundingClientRect();
      const lineRect = lineEl.getBoundingClientRect();
      if(lineRect.top < scrollRect.top){
        paneScroll.scrollTop -= (scrollRect.top - lineRect.top);
      } else if(lineRect.bottom > scrollRect.bottom){
        paneScroll.scrollTop += (lineRect.bottom - scrollRect.bottom);
      }
    }
  });
})();

/* When a selection spans multiple lines, the DOM range can pass through
   sibling elements sitting between/after the .content divs -- namely each
   line's line-number cell and its merge/delete action buttons -- so a
   plain browser copy would include their glyphs in the clipboard text.
   Rebuild the copied text from just the .content elements' own text
   (respecting the exact partial-line boundaries of the selection) instead
   of trusting the browser's default serialization of the raw DOM range. */
function closestContentEl(node){
  if(!node) return null;
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el ? el.closest('.content[contenteditable="true"]') : null;
}

/* Build the plain-text clipboard contents for a selection that starts in
   startEl and ends in endEl (both within the same column's line list),
   respecting the exact partial-line boundaries of range. Shared by the
   copy and cut handlers below. Returns null if startEl/endEl can't be
   located in that column's line list. */
function buildMultiLineClipboardText(range, startEl, endEl){
  const col = startEl.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return null;
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  const startIdx = allContents.indexOf(startEl);
  const endIdx = allContents.indexOf(endEl);
  if(startIdx === -1 || endIdx === -1) return null;
  const lo = Math.min(startIdx, endIdx), hi = Math.max(startIdx, endIdx);

  const lines = [];
  for(let i = lo; i <= hi; i++){
    const el = allContents[i];
    const lineRange = document.createRange();
    // range.startContainer/endContainer are always in document order
    // (earlier point first) regardless of which direction the user
    // dragged, so no extra swapping is needed here.
    if(i === startIdx) lineRange.setStart(range.startContainer, range.startOffset);
    else lineRange.setStart(el, 0);
    if(i === endIdx) lineRange.setEnd(range.endContainer, range.endOffset);
    else lineRange.setEnd(el, el.childNodes.length);
    lines.push(lineRange.toString());
  }
  return lines.join('\n');
}

document.getElementById('editor-wrap').addEventListener('copy', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return; // nothing selected; let default copy happen
  const range = sel.getRangeAt(0);

  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  // Only take over for selections that live inside our editable lines and
  // stay within a single column; anything else falls back to the browser's
  // normal copy behavior untouched.
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col) return;

  const text = buildMultiLineClipboardText(range, startEl, endEl);
  if(text === null) return;
  e.clipboardData.setData('text/plain', text);
  e.preventDefault();
});

/* Right-click on a selection that spans multiple lines: because each line
   lives in its own separate contenteditable div, a known Chromium quirk
   with this kind of cross-element selection leaves the native right-click
   menu's "Copy" item disabled -- greyed out and unresponsive -- specifically
   when the selection's edge sits at the very front (column 0) of one of
   those divs, even though the selection itself is perfectly valid and the
   'copy' handler above would reconstruct its text correctly. Since that
   menu item's enabled/disabled state isn't something we can control, write
   the correct text to the clipboard ourselves right as the menu opens --
   a right-click is a genuine user gesture, so the Clipboard API is allowed
   here -- so copying works regardless of whether "Copy" itself is greyed
   out. A single-line selection is left alone; the browser's native Copy
   already works fine there. */
document.getElementById('editor-wrap').addEventListener('contextmenu', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);

  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col || startEl === endEl) return;

  const text = buildMultiLineClipboardText(range, startEl, endEl);
  if(text === null) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{ /* ignore -- native Copy still works if it's actually enabled */ });
  }
});

/* Cut (Ctrl+X) over a selection spanning multiple lines: same reasoning
   as copy above for what goes on the clipboard, then remove the selected
   text via replaceCrossLineSelection since the browser can't natively
   delete across separate per-line contenteditable divs (see the keydown/
   beforeinput handlers above). A selection confined to a single line is
   left to the browser's own native cut, which already works fine. */
document.getElementById('editor-wrap').addEventListener('cut', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);

  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col || startEl === endEl) return;

  const text = buildMultiLineClipboardText(range, startEl, endEl);
  if(text === null) return;
  e.clipboardData.setData('text/plain', text);
  e.preventDefault();
  replaceCrossLineSelection('');
});

/* Ctrl+A / Cmd+A: each line lives in its own separate contenteditable
   div, so the browser's native "select all" only ever reaches the single
   div that currently has focus. Intercept it here and build a selection
   that spans from the very first line's content to the very last line's
   content in that same column, so it behaves like selecting the whole
   file instead of just one line. */
document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if((e.key !== 'a' && e.key !== 'A') || !(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const col = el.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return;
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  if(!allContents.length) return;

  e.preventDefault();
  const first = allContents[0];
  const last = allContents[allContents.length - 1];
  const sel = window.getSelection();
  if(!sel) return;
  try{
    sel.setBaseAndExtent(first, 0, last, last.childNodes.length);
  }catch(err){ /* ignore */ }
});

/* Click on gutter -> jump to proportional file position
   If click lands on a marker, jump to that diff block;
   otherwise jump to the proportional row in the file. */
function setupGutterClicks(){
  ['gutter-lm','gutter-mr'].forEach(gutterId=>{
    const gutterEl = document.getElementById(gutterId);
    if(!gutterEl) return;
    gutterEl.addEventListener('click', (e)=>{
      const gutterH = gutterEl.offsetHeight;
      const totalRows = state.rows.length;
      if(!gutterH || !totalRows) return;

      // y position relative to gutter top
      const rect = gutterEl.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const ratio = Math.max(0, Math.min(1, y / gutterH));

      // Check if a marker was clicked -> jump to that diff block
      const marker = e.target.closest('.marker');
      if(marker){
        const startRow = parseInt(marker.dataset.blockStart, 10);
        const idx = state.diffBlocks.findIndex(b=> startRow>=b.start && startRow<=b.end);
        if(idx>=0){
          state.currentDiffIndex = idx;
          render();
          scrollToRow(startRow);
          updateDiffCounter();
          setStatus(`Jumped to diff ${idx+1} / ${state.diffBlocks.length}`);
          return;
        }
      }

      // Otherwise jump to proportional row
      const targetRow = Math.floor(ratio * totalRows);
      // Find nearest diff block to highlight
      let nearestIdx = -1;
      let nearestDist = Infinity;
      state.diffBlocks.forEach((b, i)=>{
        const dist = Math.min(Math.abs(b.start - targetRow), Math.abs(b.end - targetRow));
        if(dist < nearestDist){ nearestDist = dist; nearestIdx = i; }
      });
      if(nearestIdx >= 0) state.currentDiffIndex = nearestIdx;

      // Scroll all panes to proportional position
      const totalFileH = totalRows * LINE_H;
      const scrollEl = document.getElementById('scroll-left');
      const newScrollTop = Math.max(0, ratio * totalFileH - scrollEl.clientHeight / 2);
      const ids = state.mode==='3way'
        ? ['scroll-left','scroll-mid','scroll-right']
        : ['scroll-left','scroll-right'];
      ids.forEach(id=>{ document.getElementById(id).scrollTop = newScrollTop; });
      updateGutterViewport();
      render();
      updateDiffCounter();
      setStatus(`Jumped to ${Math.round(ratio*100)}% of file`);
    });
  });
}

/* Keyboard shortcuts: Ctrl+Z / Ctrl+Y while focused inside a pane */
document.addEventListener('keydown', (e)=>{
  if(!(e.ctrlKey || e.metaKey)) return;
  const active = document.activeElement;
  const colEl = active && active.closest('.pane');
  if(!colEl) return;
  let col = null;
  if(colEl.id==='pane-left') col='left';
  else if(colEl.id==='pane-mid') col='mid';
  else if(colEl.id==='pane-right') col='right';
  if(!col) return;
  if(e.key==='z' || e.key==='Z'){
    e.preventDefault();
    if(e.shiftKey) redo(col); else undo(col);
  } else if(e.key==='y' || e.key==='Y'){
    e.preventDefault();
    redo(col);
  } else if(e.key==='s' || e.key==='S'){
    e.preventDefault();
    if(e.shiftKey ? state.cols[col].userLoaded : isDirty(state.cols[col])) saveFile(col, {saveAs: e.shiftKey});
  }
});

/* ======================================================================
   Init
   ====================================================================== */
// Sync path inputs from initial state
syncPathInput('left');
syncPathInput('mid');
syncPathInput('right');
setupScrollSync();
setupGutterClicks();
setupAllDropZones();
setupConnectorResizeHandles();
recompute();
