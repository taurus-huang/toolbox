    const container = document.getElementById('lines-' + col);
    if(!container) return;
    container.style.width = ''; // clear any previously forced width before measuring
    const w = container.scrollWidth;
    container.style.width = w + 'px';
  });
}

/* Each column can now have a different real rendered height, since
   consecutive add/del gaps collapse into a single thin marker instead of
   one blank row per skipped line. These layouts let us translate a row
   index into that column's actual pixel offset (and back), so scrolling
   can keep the same diff position aligned across panes despite the
   differing heights. */
function computeColumnLayout(col){
  const n = state.rows.length;
  const offsets = new Array(n);
  let y = 0, i = 0;
  while(i < n){
    const cell = state.rows[i][col];
    if(cell){
      offsets[i] = y;
      y += LINE_H;
      i++;
    } else {
      const gapTop = y;
      while(i < n && !state.rows[i][col]){
        offsets[i] = gapTop;
        i++;
      }
      y += GAP_H;
    }
  }
  return { offsets, totalHeight: y };
}

function rebuildColumnLayouts(){
  state.colLayout = {
    left: computeColumnLayout('left'),
    mid: computeColumnLayout('mid'),
    right: computeColumnLayout('right'),
  };
}

function offsetForRow(col, rowIdx){
  const layout = state.colLayout && state.colLayout[col];
  if(!layout || !layout.offsets.length) return 0;
  const idx = Math.max(0, Math.min(rowIdx, layout.offsets.length-1));
  return layout.offsets[idx];
}

/* Find the row whose top offset in this column is at or just before y
   (binary search, since offsets are non-decreasing). */
function rowAtOffset(col, y){
  const layout = state.colLayout && state.colLayout[col];
  if(!layout || !layout.offsets.length) return 0;
  const offsets = layout.offsets;
  let lo=0, hi=offsets.length-1, ans=0;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(offsets[mid] <= y){ ans=mid; lo=mid+1; } else { hi=mid-1; }
  }
  return ans;
}

/* Bottom pixel edge of a row in this column's layout (top of the next row,
   or the column's total height if this is the last row). */
function rowBottomOffset(col, rowIdx){
  const layout = state.colLayout && state.colLayout[col];
  if(!layout || !layout.offsets.length) return 0;
  if(rowIdx+1 < layout.offsets.length) return offsetForRow(col, rowIdx+1);
  return layout.totalHeight;
}

function renderColumn(col){
  const container = document.getElementById('lines-' + col);
  const colData = state.cols[col];
  const mode = state.mode;
  let html = '';
  const hasLeftPane = (col!=='left'); // is there a pane to the left of this one
  const hasRightPane = (col!=='right'); // is there a pane to the right of this one

  // Row indices that are the first/last row of a contiguous same-status
  // "segment" for THIS column specifically (mirrors findSegmentForRow),
  // used to draw a colored boundary line only at the top/bottom edge of
  // each diff area. state.diffBlocks groups rows by whether ANY column
  // differs, so a single diffBlock can still contain more than one of
  // these segments back-to-back for a given column (e.g. a "modified"
  // line immediately followed by a "deleted" line) -- each such internal
  // transition needs its own boundary line too, not just the outer edges
  // of the whole enclosing block.
  //
  // A boundary line is only drawn on a REAL (non-gap) row when the
  // neighboring segment is ALSO a real row of a different type -- there's
  // room there for both rows' own lines to show side by side (e.g. a
  // yellow line under the "modified" row and a green line above the
  // following "added" row). When the neighboring segment is instead a
  // collapsed zero-height gap marker, there's no room for a second line
  // right at that seam, so the row's own line is skipped there and the
  // gap marker's own colored line (always drawn regardless of position)
  // is left as the sole boundary indicator.
  const blockStartRows = new Set();
  const blockEndRows = new Set();
  {
    const rows = state.rows;
    const statusAt = i => {
      const r = rows[i];
      return (r && r._cls) ? r._cls[col] : 'equal';
    };
    const isGapNeighbor = i => !!(rows[i] && !rows[i][col]);
    for(let i=0;i<rows.length;i++){
      const s = statusAt(i);
      if(s==='equal') continue;
      if(!rows[i][col]) continue; // this row itself is a gap marker, handled by its own unconditional colored line
      const tk = segToken(i, col);
      if(segToken(i-1, col) !== tk && !isGapNeighbor(i-1)) blockStartRows.add(i);
      if(segToken(i+1, col) !== tk && !isGapNeighbor(i+1)) blockEndRows.add(i);
    }
  }

  // Consecutive gap rows (add/del, or mod when merged with a bordering
  // add/del by unifyModAdjacentDiffs) for this column collapse into a
  // single thin marker line rendered between the two real lines that
  // surround them, instead of one blank numbered row per gap.
  let pendingGap = null; // {type:'add'|'del'|'mod', current:boolean, rowIdx:number, leftHasContent:boolean, rightHasContent:boolean, showButton:boolean, blockStart:boolean, blockEnd:boolean}
  // Only show one merge/delete button set per contiguous same-type diff
  // segment. A single overall diffBlock can still contain more than one of
  // these segments back-to-back (e.g. a "modified" line immediately
  // followed by a "deleted" line, both part of the same contiguous
  // anyDiff run) -- lastRunStatus lets us notice that type change and
  // start a fresh button set for it, instead of only ever showing one
  // button set for the whole block.
  let shownButtonForRun = false;
  let lastRunStatus = null;
  const flushGap = () => {
    if(!pendingGap) return;
    const typeCls = pendingGap.type==='add' ? 'diff-add' : pendingGap.type==='del' ? 'diff-del' : 'diff-mod';
    const curCls = pendingGap.current ? ' gap-current' : '';
    const edgeCls = (pendingGap.blockStart ? ' diff-block-start' : '') + (pendingGap.blockEnd ? ' diff-block-end' : '');
    const label = pendingGap.type==='add' ? 'Content added here' : pendingGap.type==='del' ? 'Content deleted here' : 'Content changed here';
    if(pendingGap.showButton){
      let effHasLeftPane = hasLeftPane;
      let effHasRightPane = hasRightPane;
      if(col==='mid'){
        // Mid has no content here. If left is equally absent, there's nothing
        // to merge to/from left; same logic for right.
        if(!pendingGap.leftHasContent) effHasLeftPane = false;
        if(!pendingGap.rightHasContent) effHasRightPane = false;
      }
      registerActionButtons(pendingGap.rowIdx, col, effHasLeftPane, effHasRightPane, true);
    }
    html += `<div class="gap-line ${typeCls}${curCls}${edgeCls}" title="${label}">`
          + `<div class="gap-num"></div>`
          + `<div class="gap-bar-wrap"><div class="gap-bar"></div></div>`
          + `</div>`;
    pendingGap = null;
  };

  for(let i=0;i<state.rows.length;i++){
    const row = state.rows[i];
    const cell = row[col];
    const cls = row._cls;
    const status = cls ? cls[col] : 'equal';
    const token = segToken(i, col);
    // "Current diff" navigation highlight: only meaningful on a column that
    // actually differs at this row. state.diffBlocks groups rows where ANY
    // column differs, so a block's start row can still be 'equal' for a
    // given column (e.g. the right column when only left/mid changed) --
    // marking that column's line as the "current diff" too would draw the
    // highlight on unrelated, unchanged content. Restrict it to columns
    // whose own status here isn't 'equal', mirroring how blockStartRows/
    // blockEndRows above already scope themselves per column.
    const isCurrent = (i===state.diffBlocks[state.currentDiffIndex]?.start) && status !== 'equal';
    const inDiffRun = !!(cls && cls.anyDiff);

    if(!inDiffRun){
      // Left the current diff block (back to an unchanged row); the next
      // diff block encountered should get its own button set.
      shownButtonForRun = false;
      lastRunStatus = null;
    }

    if(!cell){
      // Gap row: accumulate into the pending marker instead of rendering a blank line
      if(status==='add' || status==='del' || status==='mod'){
        if(pendingGap && pendingGap.token !== token) flushGap();   // a different diff starts here
        if(!pendingGap){
          if(token !== lastRunStatus){
            // Type changed since the last segment (e.g. right after a
            // "modified" real line) -- this gap starts a new visual
            // segment of its own and should get its own button set.
            shownButtonForRun = false;
          }
          pendingGap = {type:status, current:false, rowIdx:i, leftHasContent:false, rightHasContent:false, showButton: !shownButtonForRun, blockStart:false, blockEnd:false, token};
          if(pendingGap.showButton) shownButtonForRun = true;
        } else {
          pendingGap.type = status;
        }
        lastRunStatus = token;
        if(isCurrent) pendingGap.current = true;
        if(row.left) pendingGap.leftHasContent = true;
        if(row.right) pendingGap.rightHasContent = true;
        if(blockStartRows.has(i)) pendingGap.blockStart = true;
        if(blockEndRows.has(i)) pendingGap.blockEnd = true;
      }
      continue;
    }

    // Real line present: flush any pending gap marker right before it
    flushGap();

    let lineClasses = 'line';
    let lineNum = '';
    let content = '';
    let editable = 'false';

    lineNum = (cell.idx+1).toString();
    editable = 'true';
    if(status==='mod'){
      lineClasses += ' diff-mod';
      // find the paired column for intra-line char diff
      let otherCol = null;
      if(col==='left') otherCol = mode==='3way' ? 'mid' : 'right';
      else if(col==='right') otherCol = mode==='3way' ? 'mid' : 'left';
      else if(col==='mid'){
        // Mid is the base: compare against whichever side actually differs from it
        const midText = colData.lines[cell.idx];
        const rightCell = row.right, leftCell = row.left;
        const rightText = rightCell ? state.cols.right.lines[rightCell.idx] : undefined;
        const leftText = leftCell ? state.cols.left.lines[leftCell.idx] : undefined;
        if(rightText !== undefined && rightText !== midText) otherCol = 'right';
        else if(leftText !== undefined && leftText !== midText) otherCol = 'left';
        else otherCol = 'right';
      }
      const otherCell = otherCol ? row[otherCol] : null;
      if(otherCell && state.cols[otherCol].lines[otherCell.idx] !== undefined){
        const otherText = state.cols[otherCol].lines[otherCell.idx];
        const side = (col==='left' || (col==='mid' && otherCol==='right')) ? 'del' : 'ins';
        content = lineHtmlWithDiff(colData.lines[cell.idx], otherText, side);
      } else {
        content = lineHtml(colData.lines[cell.idx]);
      }
    } else {
      content = lineHtml(colData.lines[cell.idx]);
      if(status==='add') lineClasses += ' diff-add';
      else if(status==='del') lineClasses += ' diff-del';
    }

    if(isCurrent){
      lineClasses += ' diff-current';
    }

    if(i===state.cursorRow && col===state.cursorCol){
      lineClasses += ' current-line';
    }

    if(blockStartRows.has(i)) lineClasses += ' diff-block-start';
    if(blockEndRows.has(i)) lineClasses += ' diff-block-end';

    // Only this column's OWN status matters here: cls.anyDiff just means
    // *some* column in this row differs, which for a 3-way row can be true
    // even while THIS column's content is identical to the mid/base value
    // (e.g. left===mid but right differs from mid). Gating on cls.anyDiff
    // alone used to show a merge/delete button on a line that has no visual
    // diff marker at all -- a no-op "merge" and a delete button with
    // nothing distinguishing it as part of the diff. Requiring
    // status!=='equal' too means a column only gets a button on rows where
    // it genuinely has something to merge or delete.
    if(cls && cls.anyDiff && status !== 'equal'){
      if(token !== lastRunStatus){
        // Type changed since the last segment (e.g. this "modified" line
        // comes right after a "deleted" gap) -- it starts a new visual
        // segment of its own and should get its own button set.
        shownButtonForRun = false;
      }
      if(!shownButtonForRun){
        let effHasLeftPane = hasLeftPane;
        let effHasRightPane = hasRightPane;
        if(col==='mid'){
          if(cls.left==='equal') effHasLeftPane = false;
          if(cls.right==='equal') effHasRightPane = false;
        }
        registerActionButtons(i, col, effHasLeftPane, effHasRightPane, false);
        shownButtonForRun = true;
      }
      lastRunStatus = token;
    }

    html += `<div class="${lineClasses}" data-row="${i}" data-col="${col}">`
          + `<div class="num">${lineNum}</div>`
          + `<div class="content" contenteditable="${editable}" spellcheck="false" data-row="${i}" data-col="${col}" data-line-idx="${cell.idx}">${content}</div>`
          + `</div>`;
  }
  // Trailing gap at the very end of the file (e.g. deleted/added last lines)
  flushGap();
  container.innerHTML = html;
}

/* Render the gutter markers at the outer left/right edges, showing whole-file diff overview */
function renderGutters(){
  if(state.mode==='3way'){
    // Mid is the base; left is the modified copy being compared against it.
    // ownCol is 'left'/'right' in both modes since each outer gutter sits
    // beside that specific pane and should reflect that pane's own real
    // line layout (gap rows collapse to zero height there).
    renderOneGutter('gutter-lm-track', 'mid', 'left', 'left');
    renderOneGutter('gutter-mr-track', 'mid', 'right', 'right');
  } else {
    // Only one relationship to show in 2-way mode; mirror it on both edges,
    // but measure each gutter against its own adjacent column's layout.
    renderOneGutter('gutter-lm-track', 'left', 'right', 'left');
    renderOneGutter('gutter-mr-track', 'left', 'right', 'right');
  }
  updateGutterViewport();
  syncPathRowWidths();
}

/* Lets the user drag a connector's handle to resize the two panes on
   either side of it. Reassigns flex-grow (as a plain pixel-derived ratio,
   not a fixed width) so the split stays proportional on window resize,
   the same way the default flex:1 split already behaves. Which pane sits
   on the *other* side of connector-lm depends on the current mode (mid in
   3-way, right in 2-way), so that's resolved fresh at drag-start rather
   than hard-coded, in case the mode is switched between drags. */
function setupConnectorResizeHandles(){
  setupOneResizeHandle('connector-lm-handle', 'pane-left', () => state.mode==='3way' ? 'pane-mid' : 'pane-right');
  setupOneResizeHandle('connector-mr-handle', 'pane-mid', () => 'pane-right');
}

/* Puts every currently-visible pane's flex-grow on the same pixel-weighted
   scale as its own current rendered width (so nothing moves yet -- equal
   weights in, equal ratio out), before a drag changes just two of them.
   Needed because a drag only ever touches the two panes next to the
   handle being dragged; a third, untouched pane left at the CSS default
   flex:1 (grow=1) would suddenly be on a wildly different scale from the
   few-hundred-pixel weights just assigned to the other two -- which is
   what made it collapse and the divider appear to jump right after a
   2-way/3-way switch (resetPaneWidths puts every pane back at that same
   default flex:1, so the very first drag afterward hit exactly this). */
function freezeAllPaneWidths(){
  const ids = state.mode==='3way' ? ['pane-left','pane-mid','pane-right'] : ['pane-left','pane-right'];
  const els = ids.map(id => document.getElementById(id)).filter(Boolean);
  // Measure every pane's width up front, before changing any of their
  // styles -- writing a new flex-grow to one pane while the others still
  // sit at the old default (flex-grow:1) actually shifts the layout
  // immediately, which would corrupt the width read for whichever pane
  // is measured next in the same pass.
  const widths = els.map(el => el.getBoundingClientRect().width);
  els.forEach((el, i) => { el.style.flex = widths[i].toFixed(2) + ' 1 0%'; });
}

function setupOneResizeHandle(handleId, paneAId, getPaneBId){
  const handle = document.getElementById(handleId);
  if(!handle) return;
  const MIN_PANE_W = 80; // px, keep either side from collapsing to nothing

  handle.addEventListener('mousedown', (e)=>{
    if(e.button !== 0) return;
    const paneA = document.getElementById(paneAId);
    const paneB = document.getElementById(getPaneBId());
    if(!paneA || !paneB) return;
    e.preventDefault();

    freezeAllPaneWidths();

    const startX = e.clientX;
    const startWA = paneA.getBoundingClientRect().width;
    const startWB = paneB.getBoundingClientRect().width;
    const total = startWA + startWB;

    handle.classList.add('dragging');
    document.body.classList.add('resizing-panes');

    function onMove(ev){
      const dx = ev.clientX - startX;
      const newWA = Math.min(Math.max(startWA + dx, MIN_PANE_W), total - MIN_PANE_W);
      const newWB = total - newWA;
      // Plain numbers as flex-grow: two panes weighted e.g. 300/200 split
      // available space 3:2, same math as the default flex:1 (1:1) split
      // -- just swapped for the dragged ratio instead of always-equal.
      paneA.style.flex = newWA + ' 1 0%';
      paneB.style.flex = newWB + ' 1 0%';
      // Re-measure each column's forced content width against its pane's
      // new size -- otherwise a pane narrowed below its last-measured
      // width (most obviously when it's empty, or its content is shorter
      // than the pane) keeps a stale wider width pinned from before,
      // which shows up as a bogus horizontal scrollbar with nothing
      // actually needing it.
      equalizeColumnWidths();
      // Connector position shifts with the panes; keep the path row's
      // swap-cell tracking it live instead of only after mouseup.
      syncPathRowWidths();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing-panes');
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

/* The CSS flex-basis on the path row's col-labels (see the comment above
   that rule) gets the swap-cells lined up with their connectors correctly
   in principle, but the path row and the editor row are two separate
   flex containers laid out independently -- browsers can round each
   one's sub-pixel item widths slightly differently, and with two
   dividers in 3-way mode that drift compounds enough to be visible at
   the second one (mid/right), even though it's imperceptible at the
   first. Rather than chase that with more CSS math, measure the actual
   rendered connector positions after layout and set each col-label's
   width to match exactly -- this stays pixel-exact regardless of
   rounding, window width, or a future connector-width change. Also
   re-run live while a connector-handle drag is in progress (see
   setupOneResizeHandle) so the swap-cell tracks the connector in real
   time instead of only snapping into place after mouseup. */
function syncPathRowWidths(){
  const pathrow = document.querySelector('.pathrow');
  const leftLabel = document.getElementById('pathcol-left');
  const rightLabel = document.getElementById('pathcol-right');
  const midLabel = document.getElementById('pathcol-mid');
  const connLm = document.getElementById('connector-lm');
  if(!pathrow || !leftLabel || !rightLabel || !connLm) return;

  const rowRect = pathrow.getBoundingClientRect();
  if(rowRect.width === 0) return; // pathbar not visible/laid out yet

  const lmRect = connLm.getBoundingClientRect();
  leftLabel.style.flex = `0 0 ${(lmRect.left - rowRect.left).toFixed(2)}px`;

  if(state.mode==='3way'){
    const connMr = document.getElementById('connector-mr');
    const mrRect = connMr ? connMr.getBoundingClientRect() : lmRect;
    if(midLabel) midLabel.style.flex = `0 0 ${(mrRect.left - lmRect.right).toFixed(2)}px`;
    rightLabel.style.flex = `0 0 ${(rowRect.right - mrRect.right).toFixed(2)}px`;
  } else {
    rightLabel.style.flex = `0 0 ${(rowRect.right - lmRect.right).toFixed(2)}px`;
  }
}

/* ownCol is the column whose real (post-gap-collapse) row layout this
   gutter should be measured against -- 'left' for the gutter beside the
   left pane, 'right' for the gutter beside the right pane. This makes a
   marker's height proportional to how many *real* lines of ownCol fall
   inside that diff block, not to the raw count of unified rows. A block
   made up entirely of gap-marker rows in ownCol (i.e. content only exists
   on the other side) then has zero real height there, so it's floored to
   a thin single line instead of stretching proportionally. */
function renderOneGutter(trackId, colA, colB, ownCol){
  const track = document.getElementById(trackId);
  const layout = state.colLayout && state.colLayout[ownCol];
  const totalFileH = Math.max((layout && layout.totalHeight) || 0, 1);
  // gutterH will be measured at paint time; use offsetHeight of gutter element
  const gutterEl = track.parentElement;
  const gutterH = gutterEl.offsetHeight || 400;

  let html = '';
  const blocks = buildPairBlocks(colA, colB);
  for(const block of blocks){
    // Map this block's real pixel span in ownCol's own layout -> gutter pixel (proportional)
    const topPx = offsetForRow(ownCol, block.start);
    const botPx = rowBottomOffset(ownCol, block.end);
    const topRatio    = topPx / totalFileH;
    const bottomRatio = botPx / totalFileH;
    const top    = topRatio * gutterH;
    // Blocks with no real lines in ownCol (pure gap-marker rows, e.g. a
    // pure addition on the other side) collapse to zero span; floor to a
    // thin single-line marker rather than a proportional sliver.
    const height = Math.max(2, (bottomRatio - topRatio) * gutterH);

    html += `<div class="marker ${block.type}" style="top:${top.toFixed(1)}px;height:${height.toFixed(1)}px" data-block-start="${block.start}" title="Jump to this diff"></div>`;
  }
  // viewport indicator placeholder (updated by updateGutterViewport)
  html += `<div class="viewport-indicator" id="${trackId}-vp"></div>`;
  track.innerHTML = html;
}

/* Between-pane connector strips: no color fill, just lines linking each
   diff region's current on-screen position on one side to its position on
   the other side. baseCol tells buildPairBlocks which side is the "base"
   (for correct add/del color semantics); leftPaneCol/rightPaneCol tell us
   which column's real layout to use for the strip's left edge (x=0) and
   right edge (x=width). */
function renderConnector(svgId, leftPaneCol, rightPaneCol, baseCol){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  const wrapper = svg.parentElement;
  const w = wrapper.clientWidth || 64;
  const h = wrapper.clientHeight || 400;

  const otherCol = baseCol===leftPaneCol ? rightPaneCol : leftPaneCol;
  const blocks = buildPairBlocks(baseCol, otherCol);

  const scrollLeftEl = document.getElementById('scroll-' + leftPaneCol);
  const scrollRightEl = document.getElementById('scroll-' + rightPaneCol);
  const scrollTopLeft = scrollLeftEl ? scrollLeftEl.scrollTop : 0;
  const scrollTopRight = scrollRightEl ? scrollRightEl.scrollTop : 0;

  let html = '';
  for(const block of blocks){
    const aTop = offsetForRow(leftPaneCol, block.start) - scrollTopLeft;
    const aBot = rowBottomOffset(leftPaneCol, block.end) - scrollTopLeft;
    const bTop = offsetForRow(rightPaneCol, block.start) - scrollTopRight;
    const bBot = rowBottomOffset(rightPaneCol, block.end) - scrollTopRight;
    // Skip blocks that are entirely off-screen on both sides
    if(aBot < 0 && bBot < 0) continue;
    if(aTop > h && bTop > h) continue;
    const points = `0,${aTop.toFixed(1)} ${w},${bTop.toFixed(1)} ${w},${bBot.toFixed(1)} 0,${aBot.toFixed(1)}`;
    html += `<polygon class="connector-fill ${block.type}" points="${points}"/>`;
    html += `<line class="connector-line ${block.type}" x1="0" y1="${aTop.toFixed(1)}" x2="${w}" y2="${bTop.toFixed(1)}"/>`;
    html += `<line class="connector-line ${block.type}" x1="0" y1="${aBot.toFixed(1)}" x2="${w}" y2="${bBot.toFixed(1)}"/>`;
  }
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = html;
}

function renderConnectors(){
  if(state.mode==='3way'){
    renderConnector('connector-lm-svg', 'left', 'mid', 'mid');
    renderConnector('connector-mr-svg', 'mid', 'right', 'mid');
  } else {
    renderConnector('connector-lm-svg', 'left', 'right', 'left');
  }
  renderConnectorButtons();
}

/* Update the viewport indicator rectangle on all visible gutters.
   Each gutter's markers (drawn in renderOneGutter) are measured against
   its own ownCol's real pixel layout (state.colLayout[ownCol]), so the
   viewport rectangle must use that exact same coordinate system -- its
   own column's totalHeight, and the scroll position/viewport height of
   that column's own scroll pane -- rather than a single generic
   totalRows*LINE_H estimate driven only by the left pane's scroll.
   gutter-lm-track always sits beside (and is measured against) the left
   pane; gutter-mr-track always sits beside the right pane, in both 2-way
   and 3-way modes (see the ownCol args passed in renderGutters). */
function updateGutterViewport(){
  // With nothing loaded yet the viewport box would cover the whole (empty) gutter as a bluish layer; only
  // show it once there is content to look at.
  const wrap = document.getElementById('editor-wrap');
  if(wrap) wrap.classList.toggle('has-content', ['left','mid','right'].some(c =>
    state.cols[c] && (state.cols[c].userLoaded || (state.cols[c].text && state.cols[c].text.length))));
  const gutters = [
    { trackId:'gutter-lm-track', ownCol:'left',  scrollId:'scroll-left'  },
    { trackId:'gutter-mr-track', ownCol:'right', scrollId:'scroll-right' },
  ];

  gutters.forEach(({trackId, ownCol, scrollId})=>{
    const vp = document.getElementById(trackId+'-vp');
    if(!vp) return;
    const scrollEl = document.getElementById(scrollId);
    const gutterEl = document.getElementById(trackId).parentElement;
    if(!scrollEl || !gutterEl) return;

    const layout = state.colLayout && state.colLayout[ownCol];
    const totalFileH = Math.max((layout && layout.totalHeight) || 0, 1);
    const scrollTop = scrollEl.scrollTop;
    const viewH     = scrollEl.clientHeight;
    const gutterH   = gutterEl.offsetHeight || 400;

    const top    = (scrollTop / totalFileH) * gutterH;
    const height = Math.max(4, (viewH / totalFileH) * gutterH);
    vp.style.top    = top.toFixed(1) + 'px';
    vp.style.height = height.toFixed(1) + 'px';
  });

  renderConnectors();
}

/* ======================================================================
   Navigation
   ====================================================================== */

function updateDiffCounter(){
  updateDiffNavButtonStates();
}

function scrollToRow(rowIdx){
  const scrollers = state.mode==='3way'
    ? [['scroll-left','left'],['scroll-mid','mid'],['scroll-right','right']]
    : [['scroll-left','left'],['scroll-right','right']];
  for(const [id,col] of scrollers){
    const el = document.getElementById(id);
    const targetTop = offsetForRow(col, rowIdx);
    const center = targetTop - el.clientHeight/2 + LINE_H/2;
    el.scrollTop = Math.max(0, center);
  }
  updateGutterViewport();
}

/* True if the given block's whole row range is already within the
   current visible scroll viewport of every active pane -- if so, jumping
   to it shouldn't re-scroll the view (only move the caret there). */
function isBlockFullyVisible(block){
  const scrollers = state.mode==='3way'
    ? [['scroll-left','left'],['scroll-mid','mid'],['scroll-right','right']]
    : [['scroll-left','left'],['scroll-right','right']];
  for(const [id,col] of scrollers){
    const el = document.getElementById(id);
    if(!el) continue;
    const top = offsetForRow(col, block.start);
    const bottom = rowBottomOffset(col, block.end);
    if(top < el.scrollTop || bottom > el.scrollTop + el.clientHeight) return false;
  }
  return true;
}

/* First real (non-gap-marker) row of a block for a given column, or null
   if every row in the block is a gap marker in that column (i.e. the block
   has no real editable line there -- content only exists on the other
   side/s). */
function firstRealRowInBlock(block, col){
  for(let i=block.start; i<=block.end; i++){
    if(state.rows[i][col]) return i;
  }
  return null;
}

/* Default caret position before the user has ever focused a line:
   the first diff block's first real row in the reference column, or --
   if that block is made up entirely of gap-marker rows in that column --
   the row right after it (for actually placing the caret), while the
   navigation reference stays anchored at the block's own start (the gap
   position itself) so Prev/Next compare against it correctly. With no
   diff blocks at all, the first line. */
function defaultCursorPosition(){
  const col = state.cursorCol || 'left';
  if(!state.diffBlocks.length) return {row:0, col, focusRow:0};
  const b = state.diffBlocks[0];
  const realRow = firstRealRowInBlock(b, col);
  if(realRow !== null) return {row: realRow, col, focusRow: realRow};
  const landingRow = Math.min(b.end+1, state.rows.length-1);
  return {row: b.start, col, focusRow: landingRow};
}

/* Current caret reference position used as the basis for First/Prev/Next/Last:
   wherever the user last actually focused, or the computed default. If the
   caret's current spot is only there because it landed just past a
   gap-only diff block, the comparison row is that block's own start (the
   gap position) rather than the landing row, so navigation doesn't loop
   on the same block. */
function getCursorPosition(){
  if(state.cursorRow !== null && state.cursorRow !== undefined){
    const col = state.cursorCol || 'left';
    const refRow = state.cursorGapAnchor !== null ? state.cursorGapAnchor : state.cursorRow;
    return {row: refRow, col, focusRow: state.cursorRow};
  }
  return defaultCursorPosition();
}

/* Move the actual editing caret into the given row/column's line, if it
   has real (non-gap) content there. */
function focusCursorAt(row, col){
  const el = document.querySelector(`.content[data-row="${row}"][data-col="${col}"]`);
  if(!el) return;
  el.focus({preventScroll:true});
  const sel = window.getSelection();
  if(!sel) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

/* Loading a file replaces the whole DOM via recompute(), which -- same as
   any other structural recompute() -- drops focus and leaves no caret
   visible anywhere. Give it one right after loading, landing wherever the
   view already scrolled to (defaultCursorPosition: the first diff's first
   real row, or row 0 if there's no diff), in the column that was just
   loaded -- or, if that column turns out to have no content of its own
   (e.g. it was the only one of two empty columns just filled in), whichever
   column actually does. */
function focusDefaultCaret(preferredCol){
  let col = preferredCol;
  if(!state.rows.some(r => r[col])){
    col = ['left','mid','right'].find(c => state.rows.some(r => r[c]));
  }
  if(!col) return; // nothing loaded anywhere yet

  let row, focusRow;
  if(state.diffBlocks.length){
    const b = state.diffBlocks[0];
    const realRow = firstRealRowInBlock(b, col);
    row = b.start;
    focusRow = realRow !== null ? realRow : Math.min(b.end+1, state.rows.length-1);
  } else {
    row = focusRow = 0;
  }

  focusCursorAt(focusRow, col);
  state.cursorRow = focusRow;
  state.cursorCol = col;
  state.cursorGapAnchor = (row !== focusRow) ? row : null;
  updateDiffNavButtonStates();
}

function goToDiff(target){
  const cursor = getCursorPosition();
  const focusCol = cursor.col || 'left';

  // Navigate relative to whichever column the caret is actually focused
  // in: in 3-way mode that's the left-vs-mid diffs while focused in left,
  // the mid-vs-right diffs while focused in right, or the combined list
  // while focused in mid (2-way mode always uses the combined list, since
  // there's only the one left-vs-right relationship either way).
  const refBlocks = getReferenceBlocksForCol(focusCol);
  const n = refBlocks.length;
  if(n===0) return;

  let refIdx;
  if(target==='first'){
    refIdx = 0;
  } else if(target==='last'){
    refIdx = n-1;
  } else if(target==='next'){
    refIdx = refBlocks.findIndex(b => b.start > cursor.row);
    if(refIdx === -1) refIdx = n-1;
  } else if(target==='prev'){
    refIdx = -1;
    for(let i=n-1; i>=0; i--){
      if(refBlocks[i].end < cursor.row){ refIdx = i; break; }
    }
    if(refIdx === -1) refIdx = 0;
  }

  const refBlock = refBlocks[refIdx];

  // Map the chosen column-specific block onto its enclosing entry in the
  // combined state.diffBlocks list -- the same start-row containment
  // lookup used when a gutter marker is clicked -- so the diff counter,
  // current-diff highlight, and everything else keyed off
  // state.currentDiffIndex keep working exactly as before.
  let targetIdx = state.diffBlocks.findIndex(b => refBlock.start>=b.start && refBlock.start<=b.end);
  if(targetIdx === -1) targetIdx = 0;
  state.currentDiffIndex = targetIdx;

  // Land the caret on the first real line of the block in the reference
  // column; if the block is only gap markers there, land just after it,
  // but remember the block's start as the gap anchor for future nav.
  let focusRow = firstRealRowInBlock(refBlock, focusCol);
  let gapAnchor = null;
  if(focusRow === null){
    focusRow = Math.min(refBlock.end+1, state.rows.length-1);
    gapAnchor = refBlock.start;
  }

  render();
  if(!isBlockFullyVisible(refBlock)){
    scrollToRow(focusRow);
  } else {
    // Already fully in view: leave the scroll position alone, but the
    // gutter's "current viewport" indicator still needs to reflect this
    // render pass.
    updateGutterViewport();
  }
  focusCursorAt(focusRow, focusCol);
  state.cursorRow = focusRow;
  state.cursorCol = focusCol;
  state.cursorGapAnchor = gapAnchor;
  updateDiffCounter();
  // Reported relative to the focused column's own reference-block list
  // (refBlocks/refIdx/n), same list First/Prev/Next/Last just navigated
  // through -- not the combined state.diffBlocks count -- so the message
  // matches what that column actually sees.
  setStatus(`Jumped to diff ${refIdx+1} / ${n}`);
}

/* ======================================================================
   Merge / Delete actions
   ====================================================================== */

/* Find the contiguous range of rows around rowIdx that share the same
   diff status for the given column -- this mirrors how renderColumn
   decides where to draw each separate button set. state.diffBlocks groups
   rows by whether ANY column differs, so a single diffBlock can contain
   more than one of these same-status segments back to back (e.g. a
   "modified" segment immediately followed by a "deleted" segment for this
   column). Each button set must act only on its own segment, not the
   whole enclosing diffBlock, or two different-looking buttons would end
   up doing the exact same merge/delete. */
function findSegmentForRow(rowIdx, col){
  const rows = state.rows;
  const statusAt = i => segToken(i, col);
  const status = statusAt(rowIdx);
  if(status === 'equal') return {start:rowIdx, end:rowIdx};
  let start = rowIdx, end = rowIdx;
  while(start > 0 && statusAt(start-1) === status) start--;
  while(end < rows.length-1 && statusAt(end+1) === status) end++;
  return {start, end};
}

function pushHistory(col){
  const c = state.cols[col];
  c.history.push(c.text);
  if(c.history.length>200) c.history.shift();
  c.future = [];
}

/* Loading a file into a column (open/drag-drop/refresh) is a fresh start,
   not an editable action -- clear the undo/redo history instead of
   pushing into it, so the undo/redo buttons come back up disabled right
   after a load, same as the very first, empty state. */
function resetHistory(col){
  const c = state.cols[col];
  c.history = [];
  c.future = [];
}

/* Get the text-lines for a block range for a given column, as an array of strings
   (skipping null cells). */
function getBlockLines(block, col){
  const lines = [];
  for(let i=block.start;i<=block.end;i++){
    const cell = state.rows[i][col];
    if(cell) lines.push(state.cols[col].lines[cell.idx]);
  }
  return lines;
}

/* Replace the destination column's text region corresponding to the block
   with the source column's lines for that block. */
function mergeBlock(rowIdx, fromCol, toCol){
  const block = findSegmentForRow(rowIdx, fromCol);
  const srcLines = getBlockLines(block, fromCol);

  // Determine destination splice range in toCol.lines:
  // find the first and last non-null cell index in toCol within the block
  let firstIdx=null, lastIdx=null;
  for(let i=block.start;i<=block.end;i++){
    const cell = state.rows[i][toCol];
    if(cell){
      if(firstIdx===null) firstIdx=cell.idx;
      lastIdx=cell.idx;
    }
  }

  const destLines = state.cols[toCol].lines.slice();
  let writeStart;
  if(firstIdx===null){
    // destination has no lines in this block (pure insertion) -> need to find insertion point
    // find nearest preceding row that has a cell in toCol
    let insertAt = destLines.length;
    for(let i=block.start-1;i>=0;i--){
      const cell = state.rows[i][toCol];
      if(cell){ insertAt = cell.idx+1; break; }
    }
    if(block.start===0) insertAt = 0;
    writeStart = insertAt;
    destLines.splice(insertAt, 0, ...srcLines);
  } else {
    writeStart = firstIdx;
    destLines.splice(firstIdx, lastIdx-firstIdx+1, ...srcLines);
  }

  pushHistory(toCol);
  state.cols[toCol].text = destLines.join('\n');

  // Land the caret on the merged-into side, at the line that was just
  // written there (or, when the merge cleared the block entirely -- e.g.
  // merging a pure deletion across -- the line now sitting in that spot),
  // instead of leaving focus wherever it happened to be before the merge.
  const targetIdx = destLines.length
    ? Math.max(0, Math.min(writeStart, destLines.length-1))
    : null;
  const restoreCaret = targetIdx===null ? null : {col:toCol, lineIdx:targetIdx, offset:0};

  recompute({keepView:true, restoreCaret});
  setStatus(`Merged ${colLabel(fromCol)} → ${colLabel(toCol)}`);
}

/* Delete the diff block only from the clicked column (col argument).
   Lines belonging to that block in that column are removed; other columns untouched. */
function deleteBlock(rowIdx, col){
  const block = findSegmentForRow(rowIdx, col);
  let firstIdx=null, lastIdx=null;
  for(let i=block.start;i<=block.end;i++){
    const cell = state.rows[i][col];
    if(cell){
      if(firstIdx===null) firstIdx=cell.idx;
      lastIdx=cell.idx;
    }
  }
  let restoreCaret = null;
  if(firstIdx!==null){
    const destLines = state.cols[col].lines.slice();
    destLines.splice(firstIdx, lastIdx-firstIdx+1);
    pushHistory(col);
    state.cols[col].text = destLines.join('\n');
    // Put the caret at the line now sitting where the deleted block used
    // to start (i.e. the line that shifted up into that spot), or the
    // nearest remaining line if the deletion emptied the tail/whole file,
    // so focus lands right at the delete location instead of drifting.
    const targetIdx = destLines.length
      ? Math.max(0, Math.min(firstIdx, destLines.length-1))
      : null;
    restoreCaret = targetIdx===null ? null : {col, lineIdx:targetIdx, offset:0};
  }
  recompute({keepView:true, restoreCaret});
  setStatus(`Deleted diff block from ${colLabel(col)}`);
}

/* ======================================================================
   Editing: sync contenteditable back into state.cols[col].text
   ====================================================================== */

function commitColumnEdits(col){
  const container = document.getElementById('lines-'+col);
  // Only collect text from non-empty elements that actually map back to an original file line
  const lineEls = container.querySelectorAll('.line:not(.empty) .content[contenteditable="true"]');
  const newLines = [];
  lineEls.forEach(el=>{ 
    // Read via textContent, and strip any stray \r or layout-affecting special characters
    newLines.push(el.textContent.replace(/\r/g, '')); 
  });
  
  pushHistory(col);
  state.cols[col].text = newLines.join('\n');
}

let editDebounce = null;
let pendingEditRun = null;
function onContentInput(e){
  const col = e.target.dataset.col;
  const colObj = state.cols[col];
  if(editDebounce) clearTimeout(editDebounce);
  colObj.inputPending = true; // typed but not yet committed to .text -> counts as unsaved
  pendingEditRun = ()=>{
    // Capture where the caret actually is once typing pauses (not on every
    // keystroke), so the re-diff/re-render this triggers can put the caret
    // back afterward instead of the view jumping to the first diff and the
    // user losing their place.
    const focusEl = document.activeElement;
    let restoreCaret = null;
    if(focusEl && focusEl.classList && focusEl.classList.contains('content') && focusEl.dataset.col === col){
      const row = parseInt(focusEl.dataset.row, 10);
      const cell = !Number.isNaN(row) && state.rows[row] ? state.rows[row][col] : null;
      if(cell){
        restoreCaret = { col, lineIdx: cell.idx, offset: getCaretCharOffset(focusEl) };
      }
    }
    commitColumnEdits(col);
    colObj.inputPending = false;
    recompute({keepView:true, restoreCaret});
  };
  editDebounce = setTimeout(()=>{
    editDebounce = null;
    const run = pendingEditRun; pendingEditRun = null;
    if(run) run();
  }, 600);
  updateFileUI();
}

// Commit typing that is still waiting for the debounce (before Save, before
// the page closes), so what is saved is exactly what is on screen.
function flushPendingEdits(){
  if(!editDebounce) return;
  clearTimeout(editDebounce);
  editDebounce = null;
  const run = pendingEditRun; pendingEditRun = null;
  if(run) run();
}

/* ======================================================================
   Undo / Redo
   ====================================================================== */

// Before an undo/redo re-diff, capture where the caret currently is (same
// approach as onContentInput) so recompute() can put the view and caret
// back afterward instead of jumping to the first diff / top of file.
function captureCaretForRecompute(col){
  const focusEl = document.activeElement;
  if(focusEl && focusEl.classList && focusEl.classList.contains('content') && focusEl.dataset.col === col){
    const row = parseInt(focusEl.dataset.row, 10);
    const cell = !Number.isNaN(row) && state.rows[row] ? state.rows[row][col] : null;
    if(cell){
      return { col, lineIdx: cell.idx, offset: getCaretCharOffset(focusEl) };
    }
  }
  return null;
}

function undo(col){
  const c = state.cols[col];
  if(c.history.length===0) { setStatus(`${colLabel(col)}: nothing to undo`); return; }
  const restoreCaret = captureCaretForRecompute(col);
  c.future.push(c.text);
  c.text = c.history.pop();
  recompute({keepView:true, restoreCaret});
  setStatus(`Undone — ${colLabel(col)}`);
}
function redo(col){
  const c = state.cols[col];
  if(c.future.length===0) { setStatus(`${colLabel(col)}: nothing to redo`); return; }
  const restoreCaret = captureCaretForRecompute(col);
  c.history.push(c.text);
  c.text = c.future.pop();
  recompute({keepView:true, restoreCaret});
  setStatus(`Redone — ${colLabel(col)}`);
}
function colLabel(col){ return col==='left'?'Left':col==='mid'?'Middle':'Right'; }

/* Swap two columns' entire contents (text, undo/redo history, loaded file
   path/handle, etc.) -- used by the ↔️ buttons in the path row. */
function swapColumns(colA, colB){
  const tmp = state.cols[colA];
  state.cols[colA] = state.cols[colB];
  state.cols[colB] = tmp;
  syncPathInput(colA);
  syncPathInput(colB);
  recompute();
  setStatus(`Swapped ${colLabel(colA)} ↔ ${colLabel(colB)}`);
}

/* ======================================================================
   File Open / Save / Refresh
   ====================================================================== */

/* ---------- Per-column file / handle / dirty bookkeeping ----------
   Each column (state.cols[col]) tracks, independently of the other two:
     text          - what is currently in the editor
     fullPath      - display name of the loaded file / current save target
     handle        - FileSystemFileHandle the file was originally loaded from
                     (picker or drag & drop), or null
     saveHandle    - where "Save" writes right now: starts as `handle`, and is
                     replaced by the new file after a successful "Save As"
     handleSource  - 'picker' | 'drop' | 'saveAs' | null  (null = no direct write)
     savedText     - editor text (EOL-normalised) as of the last successful
                     load / save; the baseline for the "unsaved" marker
     diskText      - raw text we last saw on disk for saveHandle (load or our
                     own last write); used to detect external modification
     exportedText  - editor text last sent through a browser download, so we
                     don't nag on page close after the user did download it
     eol           - '\n' or '\r\n' detected at load, restored when saving
     inputPending  - typing not yet committed to .text (600ms debounce)
     saving        - a save is in progress for this column                    */

function makeColState(){
  return {
    text: '', lines: [], history: [], future: [], userLoaded: false, fullPath: '',
    handle: null, saveHandle: null, lastSaveHandle: null, handleSource: null,
    savedText: '', diskText: null, exportedText: null, eol: '\n',
    inputPending: false, saving: false,
  };
}

function normEol(s){ return (s || '').replace(/\r\n/g, '\n'); }
function detectEol(text){
  const crlf = (text.match(/\r\n/g) || []).length;
  const lf = (text.match(/\n/g) || []).length - crlf;
  return crlf > lf ? '\r\n' : '\n';
}
// What actually gets written to disk: the editor text with the file's original
// line-ending style restored (the editor itself always joins lines with \n).
function serializeForSave(c){
  return c.eol === '\r\n' ? c.text.replace(/\r?\n/g, '\r\n') : c.text;
}
function isDirty(c){
  return !!(c && c.userLoaded && (c.inputPending || normEol(c.text) !== c.savedText));
}

// Replace a column's content with text that is known to match the disk.
function setColumnContent(c, text){
  c.history = [];
  c.future = [];
  c.text = text;
  c.savedText = normEol(text);
  c.diskText = text;
  c.exportedText = null;
  c.eol = detectEol(text);
  c.inputPending = false;
}

// Single place that atomically (re)associates a column with a loaded file:
// text, name and handles are always updated together, only after the file
// was read successfully.
function applyLoadedFile(col, text, name, handle, source){
  const c = state.cols[col];
  if(handle && typeof handle.createWritable !== 'function') handle = null; // read-only handle: can't overwrite
  c.handle = handle || null;
  c.saveHandle = c.handle;
  c.lastSaveHandle = c.handle;
  c.handleSource = c.handle ? source : null;
  c.fullPath = name;
  c.userLoaded = true;
  setColumnContent(c, text);
}

// Decided purely by runtime feature detection (no device / UA sniffing): any
// browser that really exposes showSaveFilePicker -- desktop or mobile -- gets
// the native Save As picker; everything else falls back to a download.
function canPickSave(){
  return typeof window.showSaveFilePicker === 'function';
}

function fileStateText(c){
  const lines = [isDirty(c) ? 'Unsaved changes' : 'No unsaved changes'];
  if(c.saveHandle){
    const src = c.handleSource === 'saveAs' ? 'saved-as file' : c.handleSource === 'drop' ? 'drag & drop' : 'file picker';
    lines.push(`Direct save: ON -> ${c.saveHandle.name} (${src})`);
  } else {
    lines.push(canPickSave()
      ? 'Direct save: OFF - Save will open Save As'
      : 'Direct save: OFF - Save will download a copy');
  }
  return lines.join('\n');
}

function saveButtonTitle(c){
  if(!c.userLoaded) return 'Save';
  if(c.saveHandle) return `Save - overwrite ${c.saveHandle.name}`;
  return canPickSave()
    ? 'Save As... (no direct-write access to the original file)'
    : "Download a copy (this browser can't overwrite the original file)";
}

// Sync the path input display from state
function syncPathInput(col){
  const inputId = col === 'mid' ? 'path-mid' : 'path-' + col;
  const el = document.getElementById(inputId);
  if(!el) return;
  const c = state.cols[col];
  const dirty = isDirty(c);
  el.value = (dirty ? '\u25CF ' : '') + c.fullPath;
  el.classList.toggle('dirty', dirty);
  el.title = c.userLoaded ? (c.fullPath + '\n' + fileStateText(c)) : '';
}

// Refresh everything that depends on the file / dirty state of the columns.
function updateFileUI(){
  ['left','mid','right'].forEach(col=>{
    const c = state.cols[col];
    syncPathInput(col);
    const saveBtn = document.querySelector(`.tbtn[data-act="save"][data-col="${col}"]`);
    const saveAsBtn = document.querySelector(`.tbtn[data-act="saveas"][data-col="${col}"]`);
    if(saveBtn){
      // Save is only available while there are unsaved changes.
      saveBtn.disabled = !isDirty(c);
      saveBtn.classList.toggle('dirty', isDirty(c));
      saveBtn.title = saveButtonTitle(c);
    }
    if(saveAsBtn) saveAsBtn.disabled = !c.userLoaded;
  });
}

/* ---------- Messages / dialogs ---------- */

// Errors get the red status bar plus an alert: the status bar alone is easy to miss.
function notifyError(msg){
  setStatus(msg, true);
  alert(msg);
}

// Small modal built on the app's own theme variables. Resolves with the chosen
// choice's value (or cancelValue on Escape).
function askChoice(message, choices, cancelValue){
  return new Promise(resolve=>{
    const prevFocus = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'fm-overlay';
    const dlg = document.createElement('div');
    dlg.className = 'fm-dialog';
    dlg.setAttribute('role', 'alertdialog');
    dlg.setAttribute('aria-modal', 'true');
    const msg = document.createElement('div');
    msg.className = 'fm-msg';
    msg.textContent = message;
    const row = document.createElement('div');
    row.className = 'fm-row';
    function done(v){
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      if(prevFocus && prevFocus.focus){ try{ prevFocus.focus({preventScroll:true}); }catch(_){} }
      resolve(v);
    }
    function onKey(e){
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(cancelValue); }
    }
    choices.forEach(ch=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fm-btn' + (ch.danger ? ' danger' : '') + (ch.primary ? ' primary' : '');
      b.textContent = ch.label;
      b.addEventListener('click', ()=>done(ch.value));
      row.appendChild(b);
      if(ch.focus) setTimeout(()=>b.focus(), 0);
    });
    dlg.appendChild(msg);
    dlg.appendChild(row);
    overlay.appendChild(dlg);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey, true);
  });
}

// Before replacing the content of some columns: ask if any has unsaved edits.
async function confirmDiscardFor(cols, action){
  const dirtyCols = cols.filter(col=>isDirty(state.cols[col]));
  if(!dirtyCols.length) return true;
  const names = dirtyCols.map(col=>`${colLabel(col)} (${state.cols[col].fullPath})`).join(', ');
  const r = await askChoice(
    `Unsaved changes in: ${names}.\n${action} will discard them.`,
    [
      { label:'Discard changes and continue', value:'go', danger:true },
      { label:'Cancel', value:'cancel', focus:true },
    ],
    'cancel'
  );
  return r === 'go';
}

/* ---------- File System Access helpers ---------- */

function fsErrorKind(err){
  const n = err && err.name;
  if(n === 'AbortError') return 'cancelled';
  if(n === 'NotAllowedError' || n === 'SecurityError') return 'permission';
  if(n === 'NotFoundError') return 'notfound';
  if(n === 'InvalidStateError' || n === 'NoModificationAllowedError') return 'state';
  if(n === 'QuotaExceededError') return 'quota';
  return 'other';
}
function fsErrorMessage(err){
  const detail = (err && (err.message || err.name)) ? ` (${err.message || err.name})` : '';
  switch(fsErrorKind(err)){
    case 'permission': return 'The browser denied access to the file' + detail;
    case 'notfound':   return 'The file or its folder no longer exists (moved, renamed or deleted)' + detail;
    case 'state':      return 'The file is locked, was changed underneath us, or its handle is no longer valid' + detail;
    case 'quota':      return 'Not enough disk space' + detail;
    default:           return 'Unexpected file error' + detail;
  }
}

// 'granted' | 'denied'. If the browser has no permission API we can't know in
// advance, so let the real operation decide (it throws if access is refused).
async function ensurePermission(handle, mode){
  if(typeof handle.queryPermission !== 'function') return 'granted';
  let p = await handle.queryPermission({ mode });
  if(p === 'granted') return 'granted';
  if(typeof handle.requestPermission === 'function') p = await handle.requestPermission({ mode });
  return p === 'granted' ? 'granted' : 'denied';
}

// createWritable() writes to a temporary copy; the real file is only replaced
// when close() succeeds, so a failure part-way leaves the original intact.
async function writeTextToHandle(handle, data){
  let writable = null;
  try{
    writable = await handle.createWritable();
    await writable.write(data);
    await writable.close();
    writable = null;
  }catch(err){
    if(writable){ try{ await writable.abort(); }catch(_){ /* ignore */ } }
    throw err;
  }
}

// Compare what is on disk now with what we last saw there.
async function checkExternalChange(c, handle){
  if(c.diskText === null || c.diskText === undefined) return { status:'unknown', reason:'no record of the original content' };
  try{
    const f = await handle.getFile();
    const t = await f.text();
    return t === c.diskText ? { status:'same' } : { status:'changed' };
  }catch(err){
    return { status:'unknown', reason: fsErrorMessage(err) };
  }
}

/* ---------- Open ---------- */

let fileInputTargetCol = null;

function loadedStatus(label, name, hasHandle, via){
  return `${via} ${label}: ${name}` + (hasHandle
    ? ' - direct save to this file is available'
    : ' - no direct-write access (Save will use Save As / download)');
}

async function openFile(col){
  // Prefer the File System Access API: it gives us a reusable, writable file
  // handle, so Save can overwrite the original and Refresh can re-read it.
  if(typeof window.showOpenFilePicker === 'function'){
    let handle;
    try{
      [handle] = await window.showOpenFilePicker({ multiple:false });
    }catch(err){
      if(err && err.name === 'AbortError'){ setStatus(`${colLabel(col)}: open cancelled`); return; }
      // Some environments reject showOpenFilePicker (e.g. permissions policy);
      // fall back to the classic file input.
      fileInputTargetCol = col;
      document.getElementById('file-input').click();
      return;
    }
    // Read first; only touch the column once we have everything.
    let file, text;
    try{
      file = await handle.getFile();
      text = await file.text();
    }catch(err){
      notifyError(`${colLabel(col)}: could not read the selected file - ${fsErrorMessage(err)}. Nothing was changed.`);
      return;
    }
    if(!await confirmDiscardFor([col], 'Opening another file')){
      setStatus(`${colLabel(col)}: open cancelled - unsaved changes kept`);
      return;
    }
    applyLoadedFile(col, text, file.name, handle, 'picker');
    syncPathInput(col);
    recompute();
    focusDefaultCaret(col);
    setStatus(loadedStatus(colLabel(col), file.name, !!state.cols[col].saveHandle, 'Opened'));
    return;
  }
  fileInputTargetCol = col;
  document.getElementById('file-input').click();
}

document.getElementById('file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  const col = fileInputTargetCol;
  if(!file || !col) return;
  const textPromise = file.text();   // start reading before the input is reset
  e.target.value = '';
  let text;
  try{ text = await textPromise; }
  catch(err){ notifyError(`${colLabel(col)}: could not read the selected file. Nothing was changed.`); return; }
  if(!await confirmDiscardFor([col], 'Opening another file')){
    setStatus(`${colLabel(col)}: open cancelled - unsaved changes kept`);
    return;
  }
  // Store full path: use webkitRelativePath if available, else just name.
  // A classic <input type=file> cannot yield a handle, so no direct save.
  const fullPath = file.webkitRelativePath || file.name;
  applyLoadedFile(col, text, fullPath, null, null);
  syncPathInput(col);
  recompute();
  focusDefaultCaret(col);
  setStatus(loadedStatus(colLabel(col), fullPath, false, 'Opened'));
});

/* ---------- Save / Save As / download ---------- */

// True on phones/tablets (Android, iPhone, iPad, etc). There's no reliable
// feature-based way to detect "this platform's Save As picker has no way
// to cancel", so this checks the device/OS instead: on mobile we skip the
// File System Access API branch below entirely and go straight to the
// plain download, matching the "pick a folder each time" flow that
// desktop users get and the "drops into Downloads" flow mobile users
// already expect from every other site.
function isMobileDevice(){
  if(navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean'){
    return navigator.userAgentData.mobile;
  }
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
}

function markSaved(c, snapshotText, writtenData){
  c.savedText = normEol(snapshotText);
  c.diskText = writtenData;
  c.exportedText = null;
}

/* Save: overwrite the current target directly if we have a handle, otherwise
   fall back to Save As / download. saveAs:true always asks for a new target. */
async function saveFile(col, opts){
  const saveAs = !!(opts && opts.saveAs);
  const c = state.cols[col];
  if(!c.userLoaded){ setStatus(`${colLabel(col)}: nothing to save - open a file first`); return; }
  flushPendingEdits();   // typing within the last 600ms is not in c.text yet
  if(c.saving){ setStatus(`${colLabel(col)}: a save is already in progress`); return; }
  c.saving = true;
  const label = colLabel(col);
  try{
    if(!saveAs && c.saveHandle){
      const r = await saveToCurrentHandle(c, label);
      if(r === 'offer-saveas') await saveAsFlow(c, label, col);
    }else{
      await saveAsFlow(c, label, col);
    }
  }finally{
    c.saving = false;
    updateFileUI();
  }
}

// Shown after a direct write failed / was refused. Returns 'offer-saveas' or 'failed'.
async function offerSaveAs(label, problem){
  setStatus(`${label}: ${problem} - file NOT saved`, true);
  const r = await askChoice(
    `${problem}\n\nThe file was NOT saved and your changes are still unsaved.\nSave a copy somewhere else with "Save As" instead?`,
    [
      { label:'Save As...', value:'saveas', primary:true },
      { label:'Close', value:'close', focus:true },
    ],
    'close'
  );
  return r === 'saveas' ? 'offer-saveas' : 'failed';
}

async function saveToCurrentHandle(c, label){
  const handle = c.saveHandle;
  setStatus(`Saving ${label}...`);

  // 1. write permission (may prompt the user)
  try{
    if(await ensurePermission(handle, 'readwrite') === 'denied'){
      return offerSaveAs(label, `Write permission for "${handle.name}" was denied`);
    }
  }catch(err){
    return offerSaveAs(label, `Could not obtain write permission for "${handle.name}": ${fsErrorMessage(err)}`);
  }

  // 2. has someone else changed the file since we loaded / last wrote it?
  const chk = await checkExternalChange(c, handle);
  if(chk.status === 'changed'){
    const choice = await askChoice(
      `"${handle.name}" was modified outside this tool since it was loaded or last saved.\nOverwriting it will discard those external changes.`,
      [
        { label:'Reload from disk (discard my edits)', value:'reload' },
        { label:'Cancel', value:'cancel', focus:true },
        { label:'Overwrite anyway', value:'overwrite', danger:true },
      ],
      'cancel'
    );
    if(choice === 'reload'){ await reloadFromHandle(c, handle, label); return 'reloaded'; }
    if(choice !== 'overwrite'){
      setStatus(`${label}: save cancelled - file changed on disk`, true);
      return 'cancelled';
    }
  }else if(chk.status === 'unknown'){
    const choice = await askChoice(
      `Could not verify whether "${handle.name}" was changed outside this tool (${chk.reason}).\nSave anyway?`,
      [
        { label:'Cancel', value:'cancel', focus:true },
        { label:'Save anyway', value:'overwrite', danger:true },
      ],
      'cancel'
    );
    if(choice !== 'overwrite'){
      setStatus(`${label}: save cancelled - could not verify the file on disk`, true);
      return 'cancelled';
    }
  }

  // 3. write. Snapshot text and bytes together so whatever is saved is exactly
  //    what the "saved" baseline records, even if the user types afterwards.
  flushPendingEdits();
  const snapshot = c.text;
  const data = serializeForSave(c);
  try{
    await writeTextToHandle(handle, data);
  }catch(err){
    return offerSaveAs(label, `Writing "${handle.name}" failed: ${fsErrorMessage(err)}`);
  }
  markSaved(c, snapshot, data);
  setStatus(`Saved ${label} directly to the original file: ${handle.name}`);
  return 'saved';
}

async function saveAsFlow(c, label, col){
  const suggestedName = (c.fullPath || (col + '.txt')).split(/[\\/]/).pop();

  if(!canPickSave()){
    // No Save As picker here: plain browser download (NOT an overwrite).
    flushPendingEdits();
    downloadFileClassic(serializeForSave(c), suggestedName, col);
    return 'downloaded';
  }

  let handle = null;
  const opts = { suggestedName, id: 'diffmerge-save-' + col };
  const hint = c.saveHandle || c.lastSaveHandle || c.handle;
  if(hint) opts.startIn = hint;
  for(let attempt = 0; attempt < 2 && !handle; attempt++){
    try{
      handle = await window.showSaveFilePicker(opts);
    }catch(err){
      if(err && err.name === 'AbortError'){
        setStatus(`${label}: Save As cancelled - nothing changed`);
        return 'cancelled';
      }
      if(err && err.name === 'TypeError' && opts.startIn){ delete opts.startIn; continue; } // unusable startIn hint
      // The picker itself failed (permission policy, sandboxed frame, ...).
      // Never fall back silently: tell the user, and download only if they ask.
      setStatus(`${label}: the Save As picker could not be opened - file NOT saved`, true);
      const choice = await askChoice(
        `The Save As dialog could not be opened: ${fsErrorMessage(err)}.\n\nThe file was NOT saved and your changes are still unsaved.\nDownload a copy instead? (A download does not overwrite the original file.)`,
        [
          { label:'Download a copy', value:'download', primary:true },
          { label:'Close', value:'close', focus:true },
        ],
        'close'
      );
      if(choice === 'download'){
        flushPendingEdits();
        downloadFileClassic(serializeForSave(c), suggestedName, col);
        return 'downloaded';
      }
      return 'failed';
    }
  }
  if(!handle) return 'cancelled';

  setStatus(`Saving ${label}...`);
  flushPendingEdits();
  const snapshot = c.text;
  const data = serializeForSave(c);
  try{
    await writeTextToHandle(handle, data);
  }catch(err){
    // Save target stays as it was; changes remain unsaved.
    notifyError(`${label}: Save As failed - ${fsErrorMessage(err)}. The file was NOT saved and your changes are still unsaved.`);
    return 'failed';
  }
  c.saveHandle = handle;
  c.lastSaveHandle = handle;
  c.handleSource = 'saveAs';
  c.fullPath = handle.name;
  markSaved(c, snapshot, data);
  setStatus(`${label}: saved as new file ${handle.name} - further Saves will write to this file`);
  return 'saved-as';
}

function downloadFileClassic(text, suggestedName, col){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = suggestedName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  const c = state.cols[col];
  if(c) c.exportedText = normEol(c.text);
  setStatus(`${colLabel(col)}: download started (${suggestedName}) - this is a browser download, NOT an overwrite of the original file`);
}

/* ---------- Refresh / reload ---------- */

// Replace the column with the file's current disk content (discarding edits).
async function reloadFromHandle(c, handle, label){
  try{
    const perm = await ensurePermission(handle, 'read');
    if(perm !== 'granted'){ notifyError(`${label}: permission denied - can't reload`); return 'failed'; }
    const file = await handle.getFile();
    const text = await file.text();
    setColumnContent(c, text);
    recompute();
    setStatus(`Reloaded ${label} from disk: ${file.name}`);
  }catch(err){
    notifyError(`${label}: reload failed - ${fsErrorMessage(err)}`);
    return 'failed';
  }
}

async function refreshFile(col){
  const c = state.cols[col];
  const label = colLabel(col);
  // After a Save As the current file is the new one, so refresh reads that.
  const handle = c.saveHandle || c.handle;

  if(!handle){
    // No re-readable handle (e.g. file was loaded via the classic file
    // picker, or never loaded at all) - browsers don't allow re-reading an
    // arbitrary path for security reasons, so ask the user to pick the file
    // again, same as pressing Enter in the path field.
    if(!c.userLoaded){
      setStatus(`${label}: nothing to refresh - open a file first`);
      return;
    }
    setStatus(`${label}: can't auto-refresh this file - please reselect it`, true);
    openFile(col);
    return 'failed'; // lets the Re-diff button report this instead of overwriting it
  }

  try{
    // Re-confirm read permission in case it was revoked since the file was opened.
    if(await ensurePermission(handle, 'read') !== 'granted'){
      setStatus(`${label}: permission denied - can't refresh`, true);
      return 'failed';
    }
    const file = await handle.getFile();
    const text = await file.text();
    const unchangedOnDisk = (c.diskText !== null && c.diskText !== undefined)
      ? text === c.diskText
      : text === c.text;
    if(unchangedOnDisk){
      setStatus(`${label}: no changes on disk` + (isDirty(c) ? ' (your unsaved edits are kept)' : ''));
      return;
    }
    if(isDirty(c) && normEol(text) !== normEol(c.text)){
      const choice = await askChoice(
        `${label}: "${file.name}" changed on disk, but this column has unsaved edits.`,
        [
          { label:'Load disk version (discard my edits)', value:'load', danger:true },
          { label:'Keep my edits', value:'keep', focus:true },
        ],
        'keep'
      );
      if(choice !== 'load'){
        setStatus(`${label}: kept your unsaved edits (disk version not loaded)`);
        return 'kept';
      }
    }
    setColumnContent(c, text);
    recompute();
    setStatus(`Refreshed ${label} from disk: ${file.name}`);
  }catch(err){
    setStatus(`${label}: refresh failed - file may have been moved or deleted`, true);
    return 'failed'; // lets the Re-diff button report this instead of overwriting it
  }
}

/* ======================================================================
   Drag & Drop file loading (path bar + editor content area)
   ====================================================================== */

// Only treat the drag as a file drag if the browser reports an actual
// file payload — this keeps normal text drag/drop inside the editable
// content untouched.
function isFileDrag(e){
  return !!(e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files'));
}

// Extract every dropped file (not just the first), grabbing FileSystemFileHandles
// synchronously where available so the Refresh button keeps working afterwards.
// Per the File System Access API, getAsFileSystemHandle()/getAsFile() must be
// called synchronously off the drop event before any other await, so all items
// are grabbed up front rather than looping with awaits in between.
async function getAllDroppedFiles(dt){
  const results = [];
  try{
    if(dt.items && dt.items.length){
      const fileItems = Array.from(dt.items).filter(it => it.kind === 'file');
      const handlePromises = fileItems.map(it =>
        typeof it.getAsFileSystemHandle === 'function' ? it.getAsFileSystemHandle() : Promise.resolve(null)
      );
      const fallbackFiles = fileItems.map(it => it.getAsFile());
      const handles = await Promise.all(handlePromises.map(p => Promise.resolve(p).catch(()=>null)));
      for(let i=0;i<fileItems.length;i++){
        let handle = handles[i];
        let file = null;
        if(handle && handle.kind === 'file'){
          try{ file = await handle.getFile(); }catch(err){ handle = null; }
        }
        if(!file) file = fallbackFiles[i];
        if(file) results.push({ file, handle: (handle && handle.kind==='file') ? handle : null });
      }
    }
    if(!results.length && dt.files && dt.files.length){
      Array.from(dt.files).forEach(f => results.push({ file: f, handle: null }));
    }
  }catch(err){
    if(!results.length && dt.files && dt.files.length){
      Array.from(dt.files).forEach(f => results.push({ file: f, handle: null }));
    }
  }
  return results;
}

function setActiveModeButtons(mode){
  document.getElementById('btn-2way').classList.toggle('active', mode==='2way');
  document.getElementById('btn-3way').classList.toggle('active', mode==='3way');
}

/* Clears any manual pane-width split from dragging a connector handle
   (see setupOneResizeHandle), falling back to the CSS default (flex:1 on
   each pane, i.e. an equal split). A left/mid/right ratio the user set up
   for one mode isn't a meaningful starting point for the other -- 2-way
   only has two panes to begin with, and 3-way reintroduces a pane that
   had no width of its own yet -- so every 2-way/3-way switch starts the
   split fresh instead of carrying it over. */
function resetPaneWidths(){
  const leftEl = document.getElementById('pane-left');
  const midEl = document.getElementById('pane-mid');
  const rightEl = document.getElementById('pane-right');
  if(leftEl) leftEl.style.flex = '';
  if(midEl) midEl.style.flex = '';
  if(rightEl) rightEl.style.flex = '';
}

// Read every dropped file, build a per-file label for the status line.
function droppedName(file){ return file.webkitRelativePath || file.name; }

async function loadDroppedFile(col, dt){
  // getAllDroppedFiles() grabs every FileSystemFileHandle synchronously off
  // the drop event (called straight from the 'drop' listener, before any other await).
  const entries = await getAllDroppedFiles(dt);
  if(!entries.length){ setStatus(`${colLabel(col)}: no file detected in the drop`); return; }

  if(entries.length >= 2){
    // Multiple files dropped at once: auto-switch mode and fill left-to-right,
    // regardless of which specific pane/path bar the files landed on.
    const wantMode = entries.length >= 3 ? '3way' : '2way';
    const useCols = wantMode==='3way' ? ['left','mid','right'] : ['left','right'];
    const used = entries.slice(0, useCols.length);
    const skipped = entries.slice(useCols.length);

    // 1. Read ALL files first, so a failure can't leave a half-loaded state.
    const reads = await Promise.allSettled(used.map(en => en.file.text()));
    const failed = used.filter((en, i) => reads[i].status === 'rejected').map(en => en.file.name);
    if(failed.length){
      notifyError(`Drop aborted - could not read: ${failed.join(', ')}. No column was changed.`);
      return;
    }
    // 2. Don't silently throw away unsaved edits.
    if(!await confirmDiscardFor(useCols, 'Loading the dropped files')){
      setStatus('Drop cancelled - nothing was changed');
      return;
    }
    // 3. Apply everything.
    state.mode = wantMode;
    setActiveModeButtons(wantMode);
    resetPaneWidths();
    useCols.forEach((c, i)=>{
      applyLoadedFile(c, reads[i].value, droppedName(used[i].file), used[i].handle, 'drop');
      syncPathInput(c);
    });
    recompute();
    focusDefaultCaret(useCols[0]);
    const summary = useCols.map((c,i)=>`${colLabel(c)}=${used[i].file.name}`).join(', ');
    const direct = useCols.filter(c => state.cols[c].saveHandle).length;
    let msg = `Switched to ${wantMode} and loaded ${useCols.length} files via drag & drop: ${summary}`
      + ` (direct save available for ${direct} of ${useCols.length})`;
    if(skipped.length){
      msg += ` | NOT loaded (only ${useCols.length} columns): ${skipped.map(en=>en.file.name).join(', ')}`;
      setStatus(msg, true);
      alert(`Only ${useCols.length} files can be compared at once.\n\nLoaded: ${used.map(en=>en.file.name).join(', ')}\nNot loaded: ${skipped.map(en=>en.file.name).join(', ')}`);
    }else{
      setStatus(msg);
    }
    return;
  }

  // Single file: load into whichever zone it was dropped on (unchanged behavior)
  const en = entries[0];
  let text;
  try{ text = await en.file.text(); }
  catch(err){ notifyError(`${colLabel(col)}: failed to read dropped file "${en.file.name}". Nothing was changed.`); return; }
  if(!await confirmDiscardFor([col], 'Loading the dropped file')){
    setStatus(`${colLabel(col)}: drop cancelled - unsaved changes kept`);
    return;
  }
  applyLoadedFile(col, text, droppedName(en.file), en.handle, 'drop');
  syncPathInput(col);
  recompute();
  focusDefaultCaret(col);
  setStatus(loadedStatus(colLabel(col), state.cols[col].fullPath, !!state.cols[col].saveHandle, 'Loaded via drag & drop'));
}

function setupDropZone(el, col){
  if(!el) return;
  let dragDepth = 0;
  el.addEventListener('dragenter', (e)=>{
    if(!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth++;
    el.classList.add('drag-over');
  });
  el.addEventListener('dragover', (e)=>{
    if(!isFileDrag(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  el.addEventListener('dragleave', (e)=>{
    if(!isFileDrag(e)) return;
    dragDepth = Math.max(0, dragDepth-1);
    if(dragDepth===0) el.classList.remove('drag-over');
  });
  el.addEventListener('drop', (e)=>{
    if(!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth = 0;
    el.classList.remove('drag-over');
    loadDroppedFile(col, e.dataTransfer);
  });
}

function setupAllDropZones(){
  // Content area: drop a file anywhere on a pane to load it into that column.
  setupDropZone(document.getElementById('pane-left'), 'left');
  setupDropZone(document.getElementById('pane-mid'), 'mid');
  setupDropZone(document.getElementById('pane-right'), 'right');
}

/* ======================================================================
   Status bar helper
   ====================================================================== */
// Pass isError=true for exceptions (e.g. a file that can't be reloaded because
// it was moved/deleted) to show the message in red so it stands out. Every
// call resets the state, so the next normal message returns to default color.
function setStatus(msg, isError){
  const el = document.getElementById('status-text');
  el.textContent = msg;
  el.title = msg;
  el.classList.toggle('status-error', !!isError);
}

/* ======================================================================
   Scroll sync between panes
   ====================================================================== */
let syncingScroll = false;
// When we programmatically set another pane's scrollTop/scrollLeft below,
// the browser still fires that pane's own 'scroll' event -- just
// asynchronously, after this handler (and its `syncingScroll` guard) has
// already finished and reset. That echo therefore isn't blocked by
// `syncingScroll` and re-enters this same logic for that pane, which then
// pushes new positions back to the others. Away from any add/del gap this
// is harmless (every column's layout agrees, so the echo computes the same
// position and nothing actually changes), but right at a gap the columns'
// layouts disagree (collapsed rows share one offset in the gap's column
// while the other column still has real height there), so each echo
// nudges the panes to slightly different positions and they fight over
// scrollTop instead of settling -- the jitter/stuck feel when scrolling
// past an added or deleted block. Tracking, per pane, that its very next
// 'scroll' event is just our own echo (and skipping it instead of
// re-syncing from it) breaks that loop.
const ignoreNextScroll = { left:false, mid:false, right:false };

function setupScrollSync(){
  const ids = ['scroll-left','scroll-mid','scroll-right'];
  const idToCol = id => id.slice('scroll-'.length);

  /* Which diff block (if any) the caret currently "belongs to": the block
     whose own row range contains the caret's row in its actual column, or
     -- for a block that is a pure insertion/deletion as seen from that
     column (no real line of its own anywhere in the block -- see
     firstRealRowInBlock) -- a block the caret sits immediately above or
     below, since there's nowhere "inside" it to literally place a caret
     in that column. Used below to narrow proportional scroll alignment
     down to just that one block when the user is focused on it (see the
     'scroll' listener). Returns null if the caret hasn't been placed
     anywhere yet, or sits on an unchanged line with no adjacent gap. */
  function findFocusedBlockIndex(){
    if(state.cursorRow === null || state.cursorRow === undefined) return null;
    const col = state.cursorCol || 'left';
    const row = state.cursorRow;
    for(let i=0;i<state.diffBlocks.length;i++){
      const b = state.diffBlocks[i];
      if(row >= b.start && row <= b.end) return i;
      if(firstRealRowInBlock(b, col) === null && (row === b.start-1 || row === b.end+1)) return i;
    }
    return null;
  }

  // Step 2: among all diff blocks, which ones currently sit inside this
  // column's visible area (VisibleAreaLines worth of rows, i.e. its own
  // viewport) -- any block whose pixel span overlaps [viewTop, viewBottom]
  // at all counts as "in" it -- and, of those, the lowest and highest
  // block index (idxVisibleMin / idxVisibleMax). Returns null when no
  // block is visible at all (the viewport is showing only unchanged rows).
  function visibleBlockIndexRange(col, viewTop, viewBottom){
    let idxMin = -1, idxMax = -1;
    for(let i=0;i<state.diffBlocks.length;i++){
      const b = state.diffBlocks[i];
      const bTop = offsetForRow(col, b.start);
      const bBottom = rowBottomOffset(col, b.end);
      if(bBottom < viewTop || bTop > viewBottom) continue; // this block doesn't overlap the visible area at all
      if(idxMin === -1) idxMin = i;
      idxMax = i;
    }
    return idxMin === -1 ? null : {idxMin, idxMax};
  }

  // Steps 3-5: for this column, the pixel-space equivalent of
  // DiffRangeLines (span from idxVisibleMin's first row to idxVisibleMax's
