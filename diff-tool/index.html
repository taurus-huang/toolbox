        }
        break;
    }
  });

  function activateRow(r){
    if(r.status !== 'error'){ openFileInTextCompare(r); return; }
    if(r.status === 'error'){
      setMsg(`${r.path}: ${r.error || 'could not be read'}.`, true);
    }
  }

  /* ---------- Hand a Different file over to the existing Text Compare ---------- */
  async function sniffBinary(file){
    const head = new Uint8Array(await file.slice(0, SNIFF_BYTES).arrayBuffer());
    return head.indexOf(0) !== -1;
  }
  function countLines(t){
    let c = 1, i = -1;
    while((i = t.indexOf('\n', i + 1)) !== -1) c++;
    return c;
  }

  async function openFileInTextCompare(result){
    const sides = activeSides();
    if(dc.opening || !result || !sides.some(sd => result[sd]) || result.status === 'error') return;
    // A file that exists on some sides only is opened too; the other columns stay blank.
    const bad = sides.map(sd => result[sd]).find(e => e && (e.error || !e.file));
    if(bad){ setMsg(`${result.path}: ${bad.error || 'could not be read'}.`, true); return; }
    dc.opening = true;
    try{
      dc.selectedKey = 'file:' + result.path;
      paintRows(true);
      setMsg(`Reading ${result.path}...`);
      const texts = {};
      try{
        const bins = await Promise.all(sides.map(sd => result[sd] ? sniffBinary(result[sd].file) : false));
        if(bins.some(Boolean)){
          setMsg(`${result.path} looks like a binary file, so it can't be shown as a line-by-line text comparison.`, true);
          return;
        }
        const read = await Promise.all(sides.map(sd => result[sd] ? result[sd].file.text() : ''));
        sides.forEach((sd, i) => { texts[sd] = read[i]; });
      }catch(err){
        setMsg(`Could not read ${result.path} - ${describeError(err)}. Select the directories again and retry.`, true);
        return;
      }
      // The existing diff engine builds an (n+1) x (m+1) table; warn before huge inputs.
      const lines = sides.map(sd => countLines(texts[sd]));
      let worst = 0, worstLabel = '';
      for(let i = 0; i < lines.length; i++) for(let j = i + 1; j < lines.length; j++){
        if(lines[i] * lines[j] > worst){ worst = lines[i] * lines[j]; worstLabel = `${lines[i].toLocaleString()} x ${lines[j].toLocaleString()}`; }
      }
      if(worst > MAX_DIFF_CELLS){
        const r = await askChoice(
          `${result.path} is large (${worstLabel} lines).\nThe line comparison may be slow or run out of memory.`,
          [
            { label: 'Compare anyway', value: 'go', danger: true },
            { label: 'Cancel', value: 'cancel', focus: true },
          ], 'cancel');
        if(r !== 'go'){ setMsg('Cancelled.'); return; }
      }
      // The file comparison gets a tab of its own; this directory comparison stays as it is in its tab.
      const dirNames = {};
      for(const sd of sides) dirNames[sd] = dc[sd].name;
      dc.opening = false;                      // belongs to the directory tab that is being left
      window.TabsApi.openTextTab();
      await nextFrame();                       // panes are visible again before they are measured
      // Match Text Compare's 2-way / 3-way mode to this comparison.
      const wantMode = sides.length === 3 ? '3way' : '2way';
      if(state.mode !== wantMode) $(wantMode === '3way' ? 'btn-3way' : 'btn-2way').click();
      for(const sd of sides){
        const e = result[sd];
        applyLoadedFile(sd, texts[sd], e ? `${dirNames[sd]}/${result.path}` : '', null, null);
        const c = state.cols[sd];
        // Refresh / Re-compare re-read the file through its handle. Only c.handle is set, not the save
        // handle, so Save still never writes to the original (the directory was opened read-only).
        if(e && e.handle){ c.handle = e.handle; c.diskText = texts[sd]; }
        if(!e) c.userLoaded = false;          // a side with no file has nothing to refresh
      }
      for(const sd of sides) syncPathInput(sd);
      recompute();
      updateFileUI();
      try{ if(state.diffBlocks.length) goToDiff('first'); }catch(_){ /* navigation is optional */ }
      const onlySide = ['left', 'mid', 'right'].includes(result.status) ? result.status : null;
      setStatus(onlySide
        ? `${result.path}: exists only on the ${onlySide === 'mid' ? 'middle' : onlySide} side`
        : state.diffBlocks.length
        ? `Comparing ${result.path} - ${state.diffBlocks.length} difference block(s)`
        : result.status === 'same'
          ? `${result.path}: the ${sides.length === 3 ? 'three' : 'two'} files are identical`
          : `${result.path}: bytes differ but no line differences are shown (e.g. line endings, BOM or encoding)`);
    }finally{
      dc.opening = false;
    }
  }


  /* ---------- Drag & drop of directories (mirrors Text Compare's file drop) ---------- */
  function readAllEntries(reader){
    return new Promise((resolve, reject) => {
      const all = [];
      const next = () => reader.readEntries(batch => {
        if(!batch.length) resolve(all); else { all.push(...batch); next(); }
      }, reject);
      next();
    });
  }
  const entryToFile = entry => new Promise((resolve, reject) => entry.file(resolve, reject));

  // Fallback for browsers without getAsFileSystemHandle (Firefox, Safari): the
  // legacy FileSystemEntry API, read recursively.
  async function scanDirectoryEntry(rootEntry, ctl){
    const files = [];
    const errors = [];
    const dirs = [];
    const stack = [{ entry: rootEntry, prefix: '' }];
    let lastYield = performance.now();
    while(stack.length){
      const { entry, prefix } = stack.pop();
      try{
        const children = await readAllEntries(entry.createReader());
        if(prefix) dirs.push({ path: prefix.slice(0, -1), empty: children.length === 0 });
        for(const child of children){
          ctl.check();
          const rel = prefix + child.name;
          if(child.isDirectory){ stack.push({ entry: child, prefix: rel + '/' }); continue; }
          try{
            const file = await entryToFile(child);
            files.push({ path: rel, name: child.name, size: file.size, file });
          }catch(err){
            errors.push({ path: rel, message: describeError(err) });
            files.push({ path: rel, name: child.name, size: null, file: null, error: describeError(err) });
          }
          if(performance.now() - lastYield > 40){
            ctl.progress(files.length);
            await yieldUi();
            lastYield = performance.now();
          }
        }
      }catch(err){
        if(err === CANCELLED) throw err;
        if(prefix && !dirs.some(d => d.path === prefix.slice(0, -1))) dirs.push({ path: prefix.slice(0, -1), empty: false });
        errors.push({ path: prefix || '/', message: describeError(err) });
      }
    }
    ctl.progress(files.length);
    return { files, errors, dirs };
  }

  // Handles/entries must be grabbed synchronously off the drop event, before any await.
  function loadDroppedDirectory(side, dt){
    const items = Array.from((dt && dt.items) || []).filter(it => it.kind === 'file');
    if(!items.length){ setMsg(`${sideLabel(side)}: drop a directory (folder).`, true); return Promise.resolve(); }
    const cands = items.map(it => {
      let handleP = Promise.resolve(null);
      try{
        if(typeof it.getAsFileSystemHandle === 'function') handleP = Promise.resolve(it.getAsFileSystemHandle()).catch(() => null);
      }catch(_){ /* fall through to the entry API */ }
      let entry = null;
      try{ if(typeof it.webkitGetAsEntry === 'function') entry = it.webkitGetAsEntry(); }catch(_){ /* ignore */ }
      return { handleP, entry };
    });
    return (async () => {
      const handles = await Promise.all(cands.map(c => c.handleP));
      // Directories in drop order (a candidate is a handle, or a legacy entry when no handle exists).
      const dirs = [];
      for(let i = 0; i < cands.length; i++){
        const h = handles[i], en = cands[i].entry;
        if(h && h.kind === 'directory') dirs.push({ handle: h });
        else if(!h && en && en.isDirectory) dirs.push({ entry: en });
      }
      if(!dirs.length){
        setMsg(`${sideLabel(side)}: only directories can be dropped here, not files.`, true);
        return;
      }
      const start = (sd, d) => d.handle
        ? runScan(sd, d.handle.name, d.handle, ctl => scanDirectory(d.handle, ctl))
        : runScan(sd, d.entry.name, null, ctl => scanDirectoryEntry(d.entry, ctl));
      if(dirs.length >= 3){
        // Three or more at once: switch to 3-way, first/second/third -> Left/Middle/Right (extras are ignored).
        setDirMode('3way');
        await Promise.all([start('left', dirs[0]), start('mid', dirs[1]), start('right', dirs[2])]);
      } else if(dirs.length === 2){
        // Two at once: switch to 2-way, first -> Left, second -> Right.
        setDirMode('2way');
        await Promise.all([start('left', dirs[0]), start('right', dirs[1])]);
      } else {
        if(side === 'mid') setDirMode('3way');
        await start(side, dirs[0]);
      }
    })();
  }

  // Is the payload made of directories or of files? Must be called synchronously inside the drop event.
  function classifyDrop(dt){
    let dirs = 0, files = 0;
    for(const it of Array.from((dt && dt.items) || [])){
      if(it.kind !== 'file') continue;
      let en = null;
      try{ if(typeof it.webkitGetAsEntry === 'function') en = it.webkitGetAsEntry(); }catch(_){ /* treat as file */ }
      if(en && en.isDirectory) dirs++; else files++;
    }
    return { dirs, files };
  }

  // Drop in Directory Compare: directories load here, plain files switch to Text Compare.
  function handleDropInDirMode(side, dt){
    const k = classifyDrop(dt);
    if(k.dirs === 0 && k.files > 0){
      setViewMode('text');
      loadDroppedFile(side, dt);        // existing Text Compare loader (grabs the file handles synchronously)
      return Promise.resolve();
    }
    return loadDroppedDirectory(side, dt);
  }

  // el: drop target; sideOf(e): which side a drop at this event loads; mark(side|null): highlight.
  function setupDirDropZone(el, sideOf, mark){
    let depth = 0;
    el.addEventListener('dragenter', (e) => {
      if(!isFileDrag(e)) return;
      e.preventDefault();
      depth++;
      mark(sideOf(e));
    });
    el.addEventListener('dragover', (e) => {
      if(!isFileDrag(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      mark(sideOf(e));
    });
    el.addEventListener('dragleave', (e) => {
      if(!isFileDrag(e)) return;
      depth = Math.max(0, depth - 1);
      if(depth === 0) mark(null);
    });
    el.addEventListener('drop', (e) => {
      if(!isFileDrag(e)) return;
      e.preventDefault();
      depth = 0;
      const side = sideOf(e);
      mark(null);
      handleDropInDirMode(side, e.dataTransfer);
    });
  }

  // Drop in Text Compare: directories switch to Directory Compare (files keep the existing behavior).
  document.addEventListener('drop', (e) => {
    if(dc.view !== 'text' || !isFileDrag(e)) return;
    const target = e.target && e.target.closest ? e.target.closest('#editor-wrap') : null;
    if(!target) return;
    if(classifyDrop(e.dataTransfer).dirs === 0) return;      // plain files: Text Compare handles them
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    const pane = e.target.closest('#pane-left,#pane-mid,#pane-right');
    let side;
    if(pane && pane.id === 'pane-left') side = 'left';
    else if(pane && pane.id === 'pane-mid') side = 'mid';
    else if(pane && pane.id === 'pane-right') side = 'right';
    else{
      const r = target.getBoundingClientRect();
      const f = (e.clientX - r.left) / Math.max(1, r.width);
      side = state.mode === '3way' ? (f < 1 / 3 ? 'left' : f < 2 / 3 ? 'mid' : 'right') : (f < 0.5 ? 'left' : 'right');
    }
    loadDroppedDirectory(side, e.dataTransfer);               // collects the handles synchronously
    setViewMode('dir');
  }, true);

  (function setupDirDrop(){
    const wrap = $('dv-listwrap');
    setupDirDropZone(wrap, (e) => {
      const r = wrap.getBoundingClientRect();
      const sbw = parseFloat(wrap.style.getPropertyValue('--dv-sbw')) || 0;
      const f = (e.clientX - r.left) / Math.max(1, r.width - sbw);        // 0..1 across the list
      if(dc.mode === '3way') return f < 1 / 3 ? 'left' : f < 2 / 3 ? 'mid' : 'right';
      return f < 0.5 ? 'left' : 'right';
    }, (side) => {
      wrap.classList.toggle('drop-left', side === 'left');
      wrap.classList.toggle('drop-mid', side === 'mid');
      wrap.classList.toggle('drop-right', side === 'right');
    });
    // Dropping on a side's path field works too, like the path fields in Text Compare.
    ['left', 'mid', 'right'].forEach(side => {
      const col = $('dv-name-' + side).closest('.dv-col');
      setupDirDropZone(col, () => side, (sd) => col.classList.toggle('drag-over', sd === side));
    });
  })();

  /* ---------- 2-way / 3-way switch (Directory Compare's own setting) ---------- */
  function setDirMode(mode){
    if(mode === dc.mode) return;
    dc.mode = mode;
    const three = mode === '3way';
    document.querySelectorAll('.dv-col-mid, .dv-div-mid').forEach(el => el.classList.toggle('hidden', !three));
    $('dv-listwrap').classList.toggle('three', three);
    setSwapTargets();
    $('dv-handle-2').classList.toggle('hidden', !three);
    resetDirWidths();
    $('dv-mode-2way').classList.toggle('active', !three);
    $('dv-mode-3way').classList.toggle('active', three);
    // Results of the other layout no longer apply: start over with what is already scanned.
    cancelCompare(true);
    clearResults();
    updateCompareButton();
    updateHint();
    paintRows(true);
    setStatus(three ? 'Switched to 3-way directory compare' : 'Switched to 2-way directory compare');
    maybeAutoCompare();
  }

  function setSwapTargets(){
    const three = dc.mode === '3way';
    const first = $('dv-swap-1');
    first.dataset.swapB = three ? 'mid' : 'right';
    const t1 = three ? 'Swap left and middle directories' : 'Swap left and right directories';
    first.title = t1; first.setAttribute('aria-label', t1);
    $('dv-swap-2').title = 'Swap middle and right directories';
    $('dv-swap-2').setAttribute('aria-label', 'Swap middle and right directories');
  }

  /* ---------- Wiring ---------- */
  for(const b of document.querySelectorAll('.dv-swap-btn')){
    b.innerHTML = document.querySelector('.pathrow .swap-btn').innerHTML;       // same icon as Text Compare
    b.addEventListener('click', () => swapDirs(b.dataset.swapA, b.dataset.swapB));
  }
  setSwapTargets();
  applyDirWidths();
  for(const [id, src] of [['dv-mode-2way', 'btn-2way'], ['dv-mode-3way', 'btn-3way']]){
    const b = $(id), o = $(src);
    b.innerHTML = o.innerHTML;                     // same icons as the Text Compare buttons
    b.title = o.title; b.setAttribute('aria-label', o.title);
  }
  $('dv-mode-2way').addEventListener('click', () => setDirMode('2way'));
  $('dv-mode-3way').addEventListener('click', () => setDirMode('3way'));
  $('dv-pick-mid').addEventListener('click', () => selectDirectory('mid'));
  for(const sd of ['left', 'mid', 'right']){
    const b = $('dv-refresh-' + sd);
    b.innerHTML = $('btn-recompute').innerHTML;            // same icon as Text Compare's Refresh / Re-compare
    b.addEventListener('click', () => refreshSide(sd));
  }
  for(const t of ['first', 'prev', 'next', 'last']){
    const b = $('dv-nav-' + t), o = $('nav-' + t);
    b.innerHTML = o.innerHTML;                     // same icons and tooltips as the Text Compare buttons
    b.title = o.title; b.setAttribute('aria-label', o.title);
    b.addEventListener('click', () => goToDiffNode(t));
  }
  // A tab that has nothing selected yet just changes its mode; a tab that already holds a comparison
  // stays as it is and the other kind of comparison opens in a new tab.
  function modeButton(mode){
    if(mode === dc.view) return;
    if(window.TabsApi && !window.TabsApi.isBlank()) window.TabsApi.addTab(mode);
    else setViewMode(mode);
  }
  $('mode-text').addEventListener('click', () => modeButton('text'));
  $('mode-dir').addEventListener('click', () => modeButton('dir'));
  $('dv-pick-left').addEventListener('click', () => selectDirectory('left'));
  $('dv-pick-right').addEventListener('click', () => selectDirectory('right'));
  $('dv-compare').addEventListener('click', () => {
    if(['left', 'mid', 'right'].some(sd => dc[sd].scanning)){ cancelScans(); return; }
    if(dc.comparing){ cancelCompare(); return; }
    rescanAndCompare();
  });

  updateSideUI('left');
  updateSideUI('mid');
  updateSideUI('right');
  updateCompareButton();
  updateHint();
  if(!pickerSupported() && !fallbackSupported()){
    $('dv-pick-left').disabled = true;
    $('dv-pick-mid').disabled = true;
    $('dv-pick-right').disabled = true;
  }

  /* ---------- Hooks for the tab strip: every tab keeps its own copy of the Directory Compare state ---------- */
  function freshDirState(view){
    return {
      left: newSide(), mid: newSide(), right: newSide(),
      mode: '2way', fr: [1, 1, 1], results: null, tree: null, diffNodes: [], nodeByKey: null, visible: [],
      comparing: false, runId: dc.runId + 1000, selectedKey: null, opening: false, view: view || 'text',
      savedScroll: null, fallbackSide: null, staleNote: '', keepStale: false, keepView: false, visVersion: 0,
    };
  }
  // Stops work that is still running for the tab being left (it would otherwise write into the next tab).
  function stopDirWork(){
    cancelCompare(true);
    if(['left', 'mid', 'right'].some(sd => dc[sd].scanning)) cancelScans();
  }
  // Redraws the whole Directory Compare view (and the view switch) from the current contents of `dc`.
  function applyDirTabState(scroll){
    const three = dc.mode === '3way';
    document.querySelectorAll('.dv-col-mid, .dv-div-mid').forEach(el => el.classList.toggle('hidden', !three));
    $('dv-listwrap').classList.toggle('three', three);
    setSwapTargets();
    $('dv-handle-2').classList.toggle('hidden', !three);
    $('dv-mode-2way').classList.toggle('active', !three);
    $('dv-mode-3way').classList.toggle('active', three);
    applyDirWidths();
    const dir = dc.view === 'dir';
    document.body.classList.toggle('dir-mode', dir);
    $('dir-view').classList.toggle('hidden', !dir);
    $('mode-text').classList.toggle('active', !dir);
    $('mode-dir').classList.toggle('active', dir);
    $('mode-text').setAttribute('aria-pressed', String(!dir));
    $('mode-dir').setAttribute('aria-pressed', String(dir));
    gutterKey = '';
    vFirst = vLast = -1;
    if(dc.results && dc.tree) rebuildVisible();
    else{
      $('dv-rows').style.height = '0px';
      $('dv-rows').innerHTML = '';
      for(const id of ['dv-gutter-l-track', 'dv-gutter-r-track']) $(id).innerHTML = '';
    }
    for(const sd of ['left', 'mid', 'right']) updateSideUI(sd);
    updateCompareButton();
    updateHint();
    updateNavButtons();
    paintRows(true);
    renderDirGutters(true);
    syncScrollbarWidth();
    if(scroll){ $('dv-list').scrollTop = scroll[0]; $('dv-list').scrollLeft = scroll[1]; }
  }

  // Expose for debugging / tests only (read-only view of the Directory Compare API).
  window.DirCompare = {
    _tabs: { fresh: freshDirState, stop: stopDirWork, apply: applyDirTabState }, selectDirectory, scanDirectory, buildFileIndex, compareDirectories, compareFileContents,
    renderDirectoryCompareResults, openFileInTextCompare, setViewMode, setDirMode, loadDroppedDirectory, _state: dc };
})();

/* ======================================================================
   Light / Dark theme toggle
   ====================================================================== */
(function(){
  const htmlEl = document.documentElement;
  const btn = document.getElementById('btn-theme');
  const iconSun = document.getElementById('icon-theme-sun');
  const iconMoon = document.getElementById('icon-theme-moon');

  function applyTheme(theme){
    if(theme === 'dark'){
      htmlEl.setAttribute('data-theme','dark');
      iconSun.style.display = 'none';
      iconMoon.style.display = '';
      btn.title = 'Switch to light mode';
    } else {
      htmlEl.removeAttribute('data-theme');
      iconSun.style.display = '';
      iconMoon.style.display = 'none';
      btn.title = 'Switch to dark mode';
    }
  }

  let saved = null;
  try{ saved = localStorage.getItem('difftool-theme'); }catch(e){ /* ignore */ }
  applyTheme(saved ? saved : 'dark');

  btn.addEventListener('click', ()=>{
    const isDark = htmlEl.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('difftool-theme', next); }catch(e){ /* ignore */ }
  });
})();

/* ======================================================================
   Tabs: every comparison (file or directory) lives in its own tab.
   A tab keeps its own copy of the Text Compare state and of the Directory
   Compare state; switching copies the chosen tab's state into the live
   objects (`state`, DirCompare._state) and redraws. Scans or comparisons
   still running in the tab being left are stopped (Re-compare restarts them).
   ====================================================================== */
(function(){
  const bar = document.getElementById('tabbar');
  const dcApi = window.DirCompare._tabs;
  const dc = window.DirCompare._state;
  const ICON_FILE = '<svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>';
  const ICON_DIR = '<svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>';
  const ICON_X = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>';
  const ICON_PLUS = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg>';
  const COLS = ['left', 'mid', 'right'];

  function freshTextState(){
    return {
      mode: '2way',
      cols: { left: makeColState(), mid: makeColState(), right: makeColState() },
      rows: [], diffBlocks: [], currentDiffIndex: -1,
      cursorRow: null, cursorCol: null, cursorGapAnchor: null,
      connectorButtonsLM: [], connectorButtonsMR: [],
    };
  }
  let nextId = 1;
  const tabs = [];
  let active = null;

  function newTab(view){
    const t = { id: nextId++, st: freshTextState(), dc: null, tscroll: null, dscroll: null, last: null };
    t.dc = Object.assign({}, window.DirCompare._tabs.fresh(view));
    return t;
  }
  const baseName = p => String(p || '').split(/[\\/]/).filter(Boolean).pop() || '';

  // What a tab shows: icon kind, label and tooltip, derived from the live objects (active tab) or its saved copy.
  function describe(t){
    const live = t === active;
    const st = live ? state : t.st, d = live ? dc : t.dc;
    const isDir = d.view === 'dir';
    let names = [], full = [], dirty = false;
    if(isDir){
      for(const sd of (d.mode === '3way' ? COLS : ['left', 'right'])) if(d[sd].name){ names.push(d[sd].name); full.push(d[sd].name); }
    } else {
      for(const c of (st.mode === '3way' ? COLS : ['left', 'right'])){
        const cs = st.cols[c];
        if(cs.userLoaded && cs.fullPath){ names.push(baseName(cs.fullPath)); full.push(cs.fullPath); }
        if(isDirty(cs)) dirty = true;
      }
    }
    const label = names.length ? names.join(' \u2194 ') : (isDir ? 'New directory compare' : 'New file compare');
    return { isDir, label: (dirty ? '\u25CF ' : '') + label, title: full.length ? full.join('\n') : label, dirty };
  }

  function tabHtml(t){
    const info = describe(t);
    t.last = info;
    return `<div class="tab${t === active ? ' active' : ''}" role="tab" aria-selected="${t === active}" data-id="${t.id}" title="${esc2(info.title)}">`
      + (info.isDir ? ICON_DIR : ICON_FILE)
      + `<span class="tab-name">${esc2(info.label)}</span>`
      + `<button type="button" class="tab-close" title="Close tab" aria-label="Close tab">${ICON_X}</button></div>`;
  }
  function esc2(x){ return String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderTabs(){
    bar.innerHTML = tabs.map(tabHtml).join('')
      + `<button type="button" class="tab-add" id="tab-add" title="New tab" aria-label="New tab">${ICON_PLUS}</button>`;
    const el = bar.querySelector('.tab.active');
    if(el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  // Cheap periodic refresh: labels follow file names / dirty state / the Text-Directory switch without hooks everywhere.
  function refreshLabels(){
    for(const t of tabs){
      const el = bar.querySelector(`.tab[data-id="${t.id}"]`);
      if(!el) continue;
      const info = describe(t), old = t.last;
      if(old && old.label === info.label && old.title === info.title && old.isDir === info.isDir) continue;
      t.last = info;
      el.title = info.title;
      el.querySelector('.tab-name').textContent = info.label;
      if(!old || old.isDir !== info.isDir){
        const ico = el.querySelector('.tab-ico');
        const tmp = document.createElement('div');
        tmp.innerHTML = info.isDir ? ICON_DIR : ICON_FILE;
        ico.replaceWith(tmp.firstChild);
      }
    }
  }
  setInterval(refreshLabels, 300);

  function capture(t){
    try{ flushPendingEdits(); }catch(_){ /* nothing pending */ }
    window.DirCompare._tabs.stop();
    t.st = Object.assign({}, state);
    t.dc = Object.assign({}, dc);
    if(dc.view === 'dir'){
      const l = document.getElementById('dv-list');
      t.dscroll = [l.scrollTop, l.scrollLeft];
      t.tscroll = dc.savedScroll || t.tscroll;
    } else {
      t.tscroll = COLS.map(c => { const el = document.getElementById('scroll-' + c); return el ? [el.scrollTop, el.scrollLeft] : [0, 0]; });
    }
  }
  function load(t){
    Object.assign(state, t.st);
    Object.assign(dc, t.dc);
    active = t;
    // Set the 2-/3-way buttons while they are still hidden: if they were revealed first, the stale highlight would
    // be shown (and animated away by the button's colour transition) before the right one lit up.
    setActiveModeButtons(state.mode);
    dcApi.apply(t.dscroll);
    resetPaneWidths();
    recompute();
    if(dc.view !== 'dir'){
      window.dispatchEvent(new Event('resize'));
      if(t.tscroll) COLS.forEach((c, i) => {
        const el = document.getElementById('scroll-' + c);
        if(el && t.tscroll[i]){ el.scrollTop = t.tscroll[i][0]; el.scrollLeft = t.tscroll[i][1]; }
      });
      updateGutterViewport();
    }
    updateFileUI();
    setStatus(dc.view === 'dir' ? 'Directory Compare' : 'Text Compare');
  }

  function switchTo(t){
    if(t === active) return;
    capture(active);
    load(t);
    renderTabs();
  }
  function addTab(viewArg){
    const view = viewArg || dc.view;         // a new tab starts in the same kind of comparison as the current one
    const t = newTab(view);
    capture(active);
    tabs.push(t);
    load(t);
    renderTabs();
    bar.scrollLeft = bar.scrollWidth;
  }
  async function closeTab(t){
    const live = t === active;
    const st = live ? state : t.st;
    const dirtyCols = COLS.filter(c => isDirty(st.cols[c]));
    if(dirtyCols.length){
      const names = dirtyCols.map(c => st.cols[c].fullPath || c).join(', ');
      const r = await askChoice(`Unsaved changes in: ${names}.\nClosing this tab will discard them.`,
        [{ label: 'Discard changes and close', value: 'go', danger: true }, { label: 'Cancel', value: 'cancel', focus: true }], 'cancel');
      if(r !== 'go') return;
    }
    const i = tabs.indexOf(t);
    if(i < 0) return;
    if(tabs.length === 1){                   // closing the only tab leaves a fresh one
      const t2 = newTab(dc.view);
      capture(t);
      tabs[0] = t2;
      load(t2);
    } else if(live){
      const next = tabs[i + 1] || tabs[i - 1];
      capture(t);
      tabs.splice(i, 1);
      load(next);
    } else {
      tabs.splice(i, 1);
    }
    renderTabs();
  }

  // True while the current tab has nothing selected or loaded in the kind of comparison it is showing.
  function isBlank(){
    if(dc.view === 'dir') return !(dc.mode === '3way' ? COLS : ['left', 'right']).some(sd => dc[sd].name);
    return !COLS.some(c => { const cs = state.cols[c]; return cs.userLoaded || cs.fullPath || cs.text; });
  }
  window.TabsApi = { openTextTab: () => addTab('text'), addTab, isBlank };

  bar.addEventListener('click', (e) => {
    if(e.target.closest('#tab-add')){ addTab(); return; }
    const el = e.target.closest('.tab');
    if(!el) return;
    const t = tabs.find(x => x.id === Number(el.dataset.id));
    if(!t) return;
    if(e.target.closest('.tab-close')) closeTab(t); else switchTo(t);
  });
  /* Drag a tab sideways to change its position. The tab follows the pointer; when its centre passes the
     centre of a neighbour the two swap places. */
  let justDragged = false;
  bar.addEventListener('click', (e) => {               // the click that ends a drag must not be handled as a tab click
    if(justDragged){ e.stopPropagation(); e.preventDefault(); justDragged = false; }
  }, true);
  bar.addEventListener('pointerdown', (e) => {
    if(e.button !== 0 || e.target.closest('.tab-close')) return;
    const startEl = e.target.closest('.tab');
    if(!startEl) return;
    const id = Number(startEl.dataset.id);
    const startX = e.clientX;
    let dragging = false, el = null, startLeft = 0;

    const tabEls = () => Array.from(bar.querySelectorAll('.tab'));
    const place = (x) => {
      const desired = startLeft + (x - startX);                     // where the tab's left edge should be (bar coords)
      el.style.transform = `translateX(${desired - el.offsetLeft}px)`;
      const centre = desired + el.offsetWidth / 2;
      const others = tabEls().filter(o => o !== el);
      let target = 0;
      for(const o of others) if(o.offsetLeft + o.offsetWidth / 2 < centre) target++;
      const from = tabEls().indexOf(el);
      if(target !== from){
        const ref = others[target] || null;                          // insert before this one (null = at the end)
        bar.insertBefore(el, ref || bar.querySelector('#tab-add'));
        const t = tabs.find(x2 => x2.id === id);
        tabs.splice(tabs.indexOf(t), 1);
        tabs.splice(target, 0, t);
        el.style.transform = `translateX(${desired - el.offsetLeft}px)`;
      }
    };
    const onMove = (ev) => {
      if(!dragging){
        if(Math.abs(ev.clientX - startX) < 5) return;
        dragging = true;
        const t = tabs.find(x => x.id === id);
        if(t && t !== active) switchTo(t);                           // dragging a tab also selects it (re-renders the strip)
        el = bar.querySelector(`.tab[data-id="${id}"]`);
        if(!el){ cleanup(); return; }
        startLeft = el.offsetLeft;
        el.classList.add('dragging');
      }
      place(ev.clientX);
    };
    const cleanup = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    };
    const onUp = () => {
      cleanup();
      if(dragging){
        justDragged = true;
        setTimeout(() => { justDragged = false; }, 0);
        if(el){ el.classList.remove('dragging'); el.style.transform = ''; }
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  bar.addEventListener('auxclick', (e) => {          // middle click closes, like a browser tab
    if(e.button !== 1) return;
    const el = e.target.closest('.tab');
    const t = el && tabs.find(x => x.id === Number(el.dataset.id));
    if(t){ e.preventDefault(); closeTab(t); }
  });
  bar.addEventListener('mousedown', (e) => { if(e.button === 1) e.preventDefault(); });

  // Unsaved edits in tabs that are not on screen must also block leaving the page.
  window.addEventListener('beforeunload', (e) => {
    const risky = tabs.some(t => t !== active && COLS.some(c => {
      const cs = t.st.cols[c];
      return isDirty(cs) && normEol(cs.text) !== cs.exportedText;
    }));
    if(risky){ e.preventDefault(); e.returnValue = ''; return ''; }
  });

  // The first tab adopts whatever is on screen right now.
  const first = { id: nextId++, st: null, dc: null, tscroll: null, dscroll: null, last: null };
  tabs.push(first);
  active = first;
  renderTabs();
})();
</script>
</body>
</html>
