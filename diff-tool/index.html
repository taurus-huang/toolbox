    ? [['scroll-left','left'],['scroll-mid','mid'],['scroll-right','right']]
    : [['scroll-left','left'],['scroll-right','right']];
  for(const [id,col] of scrollers){
    const el = document.getElementById(id);
    const targetTop = offsetForRow(col, rowIdx);
    const center = targetTop - el.clientHeight/2 + LINE_H/2;
    el.scrollTop = Math.max(0, center);
  }
  updateGutterViewport();
}

/* True if the given block's whole row range is already within the
   current visible scroll viewport of every active pane -- if so, jumping
   to it shouldn't re-scroll the view (only move the caret there). */
function isBlockFullyVisible(block){
  const scrollers = state.mode==='3way'
    ? [['scroll-left','left'],['scroll-mid','mid'],['scroll-right','right']]
    : [['scroll-left','left'],['scroll-right','right']];
  for(const [id,col] of scrollers){
    const el = document.getElementById(id);
    if(!el) continue;
    const top = offsetForRow(col, block.start);
    const bottom = rowBottomOffset(col, block.end);
    if(top < el.scrollTop || bottom > el.scrollTop + el.clientHeight) return false;
  }
  return true;
}

/* First real (non-gap-marker) row of a block for a given column, or null
   if every row in the block is a gap marker in that column (i.e. the block
   has no real editable line there -- content only exists on the other
   side/s). */
function firstRealRowInBlock(block, col){
  for(let i=block.start; i<=block.end; i++){
    if(state.rows[i][col]) return i;
  }
  return null;
}

/* Default caret position before the user has ever focused a line:
   the first diff block's first real row in the reference column, or --
   if that block is made up entirely of gap-marker rows in that column --
   the row right after it (for actually placing the caret), while the
   navigation reference stays anchored at the block's own start (the gap
   position itself) so Prev/Next compare against it correctly. With no
   diff blocks at all, the first line. */
function defaultCursorPosition(){
  const col = state.cursorCol || 'left';
  if(!state.diffBlocks.length) return {row:0, col, focusRow:0};
  const b = state.diffBlocks[0];
  const realRow = firstRealRowInBlock(b, col);
  if(realRow !== null) return {row: realRow, col, focusRow: realRow};
  const landingRow = Math.min(b.end+1, state.rows.length-1);
  return {row: b.start, col, focusRow: landingRow};
}

/* Current caret reference position used as the basis for First/Prev/Next/Last:
   wherever the user last actually focused, or the computed default. If the
   caret's current spot is only there because it landed just past a
   gap-only diff block, the comparison row is that block's own start (the
   gap position) rather than the landing row, so navigation doesn't loop
   on the same block. */
function getCursorPosition(){
  if(state.cursorRow !== null && state.cursorRow !== undefined){
    const col = state.cursorCol || 'left';
    const refRow = state.cursorGapAnchor !== null ? state.cursorGapAnchor : state.cursorRow;
    return {row: refRow, col, focusRow: state.cursorRow};
  }
  return defaultCursorPosition();
}

/* Move the actual editing caret into the given row/column's line, if it
   has real (non-gap) content there. */
function focusCursorAt(row, col){
  const el = document.querySelector(`.content[data-row="${row}"][data-col="${col}"]`);
  if(!el) return;
  el.focus({preventScroll:true});
  const sel = window.getSelection();
  if(!sel) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

function goToDiff(target){
  const n = state.diffBlocks.length;
  if(n===0) return;

  const cursor = getCursorPosition();

  let targetIdx;
  if(target==='first'){
    targetIdx = 0;
  } else if(target==='last'){
    targetIdx = n-1;
  } else if(target==='next'){
    targetIdx = state.diffBlocks.findIndex(b => b.start > cursor.row);
    if(targetIdx === -1) targetIdx = n-1;
  } else if(target==='prev'){
    targetIdx = -1;
    for(let i=n-1; i>=0; i--){
      if(state.diffBlocks[i].end < cursor.row){ targetIdx = i; break; }
    }
    if(targetIdx === -1) targetIdx = 0;
  }

  state.currentDiffIndex = targetIdx;
  const block = state.diffBlocks[targetIdx];

  // Land the caret on the first real line of the block in the reference
  // column; if the block is only gap markers there, land just after it,
  // but remember the block's start as the gap anchor for future nav.
  const focusCol = cursor.col || 'left';
  let focusRow = firstRealRowInBlock(block, focusCol);
  let gapAnchor = null;
  if(focusRow === null){
    focusRow = Math.min(block.end+1, state.rows.length-1);
    gapAnchor = block.start;
  }

  render();
  if(!isBlockFullyVisible(block)){
    scrollToRow(focusRow);
  } else {
    // Already fully in view: leave the scroll position alone, but the
    // gutter's "current viewport" indicator still needs to reflect this
    // render pass.
    updateGutterViewport();
  }
  focusCursorAt(focusRow, focusCol);
  state.cursorRow = focusRow;
  state.cursorCol = focusCol;
  state.cursorGapAnchor = gapAnchor;
  updateDiffCounter();
  setStatus(`Jumped to diff ${targetIdx+1} / ${n}`);
}

/* ======================================================================
   Merge / Delete actions
   ====================================================================== */

/* Find the contiguous range of rows around rowIdx that share the same
   diff status for the given column -- this mirrors how renderColumn
   decides where to draw each separate button set. state.diffBlocks groups
   rows by whether ANY column differs, so a single diffBlock can contain
   more than one of these same-status segments back to back (e.g. a
   "modified" segment immediately followed by a "deleted" segment for this
   column). Each button set must act only on its own segment, not the
   whole enclosing diffBlock, or two different-looking buttons would end
   up doing the exact same merge/delete. */
function findSegmentForRow(rowIdx, col){
  const rows = state.rows;
  const statusAt = i => {
    const r = rows[i];
    return (r && r._cls) ? r._cls[col] : 'equal';
  };
  const status = statusAt(rowIdx);
  if(status === 'equal') return {start:rowIdx, end:rowIdx};
  let start = rowIdx, end = rowIdx;
  while(start > 0 && statusAt(start-1) === status) start--;
  while(end < rows.length-1 && statusAt(end+1) === status) end++;
  return {start, end};
}

function pushHistory(col){
  const c = state.cols[col];
  c.history.push(c.text);
  if(c.history.length>200) c.history.shift();
  c.future = [];
}

/* Loading a file into a column (open/drag-drop/refresh) is a fresh start,
   not an editable action -- clear the undo/redo history instead of
   pushing into it, so the undo/redo buttons come back up disabled right
   after a load, same as the very first, empty state. */
function resetHistory(col){
  const c = state.cols[col];
  c.history = [];
  c.future = [];
}

/* Get the text-lines for a block range for a given column, as an array of strings
   (skipping null cells). */
function getBlockLines(block, col){
  const lines = [];
  for(let i=block.start;i<=block.end;i++){
    const cell = state.rows[i][col];
    if(cell) lines.push(state.cols[col].lines[cell.idx]);
  }
  return lines;
}

/* Replace the destination column's text region corresponding to the block
   with the source column's lines for that block. */
function mergeBlock(rowIdx, fromCol, toCol){
  const block = findSegmentForRow(rowIdx, fromCol);
  const srcLines = getBlockLines(block, fromCol);

  // Determine destination splice range in toCol.lines:
  // find the first and last non-null cell index in toCol within the block
  let firstIdx=null, lastIdx=null;
  for(let i=block.start;i<=block.end;i++){
    const cell = state.rows[i][toCol];
    if(cell){
      if(firstIdx===null) firstIdx=cell.idx;
      lastIdx=cell.idx;
    }
  }

  const destLines = state.cols[toCol].lines.slice();
  let writeStart;
  if(firstIdx===null){
    // destination has no lines in this block (pure insertion) -> need to find insertion point
    // find nearest preceding row that has a cell in toCol
    let insertAt = destLines.length;
    for(let i=block.start-1;i>=0;i--){
      const cell = state.rows[i][toCol];
      if(cell){ insertAt = cell.idx+1; break; }
    }
    if(block.start===0) insertAt = 0;
    writeStart = insertAt;
    destLines.splice(insertAt, 0, ...srcLines);
  } else {
    writeStart = firstIdx;
    destLines.splice(firstIdx, lastIdx-firstIdx+1, ...srcLines);
  }

  pushHistory(toCol);
  state.cols[toCol].text = destLines.join('\n');

  // Land the caret on the merged-into side, at the line that was just
  // written there (or, when the merge cleared the block entirely -- e.g.
  // merging a pure deletion across -- the line now sitting in that spot),
  // instead of leaving focus wherever it happened to be before the merge.
  const targetIdx = destLines.length
    ? Math.max(0, Math.min(writeStart, destLines.length-1))
    : null;
  const restoreCaret = targetIdx===null ? null : {col:toCol, lineIdx:targetIdx, offset:0};

  recompute({keepView:true, restoreCaret});
  setStatus(`Merged ${colLabel(fromCol)} → ${colLabel(toCol)}`);
}

/* Delete the diff block only from the clicked column (col argument).
   Lines belonging to that block in that column are removed; other columns untouched. */
function deleteBlock(rowIdx, col){
  const block = findSegmentForRow(rowIdx, col);
  let firstIdx=null, lastIdx=null;
  for(let i=block.start;i<=block.end;i++){
    const cell = state.rows[i][col];
    if(cell){
      if(firstIdx===null) firstIdx=cell.idx;
      lastIdx=cell.idx;
    }
  }
  let restoreCaret = null;
  if(firstIdx!==null){
    const destLines = state.cols[col].lines.slice();
    destLines.splice(firstIdx, lastIdx-firstIdx+1);
    pushHistory(col);
    state.cols[col].text = destLines.join('\n');
    // Put the caret at the line now sitting where the deleted block used
    // to start (i.e. the line that shifted up into that spot), or the
    // nearest remaining line if the deletion emptied the tail/whole file,
    // so focus lands right at the delete location instead of drifting.
    const targetIdx = destLines.length
      ? Math.max(0, Math.min(firstIdx, destLines.length-1))
      : null;
    restoreCaret = targetIdx===null ? null : {col, lineIdx:targetIdx, offset:0};
  }
  recompute({keepView:true, restoreCaret});
  setStatus(`Deleted diff block from ${colLabel(col)}`);
}

/* ======================================================================
   Editing: sync contenteditable back into state.cols[col].text
   ====================================================================== */

function commitColumnEdits(col){
  const container = document.getElementById('lines-'+col);
  // Only collect text from non-empty elements that actually map back to an original file line
  const lineEls = container.querySelectorAll('.line:not(.empty) .content[contenteditable="true"]');
  const newLines = [];
  lineEls.forEach(el=>{ 
    // Read via textContent, and strip any stray \r or layout-affecting special characters
    newLines.push(el.textContent.replace(/\r/g, '')); 
  });
  
  pushHistory(col);
  state.cols[col].text = newLines.join('\n');
}

let editDebounce = null;
function onContentInput(e){
  const col = e.target.dataset.col;
  if(editDebounce) clearTimeout(editDebounce);
  editDebounce = setTimeout(()=>{
    // Capture where the caret actually is once typing pauses (not on every
    // keystroke), so the re-diff/re-render this triggers can put the caret
    // back afterward instead of the view jumping to the first diff and the
    // user losing their place.
    const focusEl = document.activeElement;
    let restoreCaret = null;
    if(focusEl && focusEl.classList && focusEl.classList.contains('content') && focusEl.dataset.col === col){
      const row = parseInt(focusEl.dataset.row, 10);
      const cell = !Number.isNaN(row) && state.rows[row] ? state.rows[row][col] : null;
      if(cell){
        restoreCaret = { col, lineIdx: cell.idx, offset: getCaretCharOffset(focusEl) };
      }
    }
    commitColumnEdits(col);
    recompute({keepView:true, restoreCaret});
  }, 600);
}

/* ======================================================================
   Undo / Redo
   ====================================================================== */

// Before an undo/redo re-diff, capture where the caret currently is (same
// approach as onContentInput) so recompute() can put the view and caret
// back afterward instead of jumping to the first diff / top of file.
function captureCaretForRecompute(col){
  const focusEl = document.activeElement;
  if(focusEl && focusEl.classList && focusEl.classList.contains('content') && focusEl.dataset.col === col){
    const row = parseInt(focusEl.dataset.row, 10);
    const cell = !Number.isNaN(row) && state.rows[row] ? state.rows[row][col] : null;
    if(cell){
      return { col, lineIdx: cell.idx, offset: getCaretCharOffset(focusEl) };
    }
  }
  return null;
}

function undo(col){
  const c = state.cols[col];
  if(c.history.length===0) { setStatus(`${colLabel(col)}: nothing to undo`); return; }
  const restoreCaret = captureCaretForRecompute(col);
  c.future.push(c.text);
  c.text = c.history.pop();
  recompute({keepView:true, restoreCaret});
  setStatus(`Undone — ${colLabel(col)}`);
}
function redo(col){
  const c = state.cols[col];
  if(c.future.length===0) { setStatus(`${colLabel(col)}: nothing to redo`); return; }
  const restoreCaret = captureCaretForRecompute(col);
  c.history.push(c.text);
  c.text = c.future.pop();
  recompute({keepView:true, restoreCaret});
  setStatus(`Redone — ${colLabel(col)}`);
}
function colLabel(col){ return col==='left'?'Left':col==='mid'?'Middle':'Right'; }

/* Swap two columns' entire contents (text, undo/redo history, loaded file
   path/handle, etc.) -- used by the ↔️ buttons in the path row. */
function swapColumns(colA, colB){
  const tmp = state.cols[colA];
  state.cols[colA] = state.cols[colB];
  state.cols[colB] = tmp;
  syncPathInput(colA);
  syncPathInput(colB);
  recompute();
  setStatus(`Swapped ${colLabel(colA)} ↔ ${colLabel(colB)}`);
}

/* ======================================================================
   File Open / Save / Refresh
   ====================================================================== */

let fileInputTargetCol = null;

// Sync the path input display from state
function syncPathInput(col){
  const inputId = col === 'mid' ? 'path-mid' : 'path-' + col;
  const el = document.getElementById(inputId);
  if(el) el.value = state.cols[col].fullPath;
}

async function openFile(col){
  // Prefer the File System Access API: it gives us a reusable file handle so
  // the Refresh button can later re-read the file straight from disk.
  if(window.showOpenFilePicker){
    try{
      const [handle] = await window.showOpenFilePicker({ multiple:false });
      const file = await handle.getFile();
      const text = await file.text();
      resetHistory(col);
      state.cols[col].text = text;
      state.cols[col].fullPath = file.name;
      state.cols[col].userLoaded = true;
      state.cols[col].handle = handle;
      syncPathInput(col);
      recompute();
      setStatus(`Opened ${colLabel(col)}: ${file.name}`);
    }catch(err){
      if(err && err.name === 'AbortError') return; // user cancelled the picker
      // Some environments reject showOpenFilePicker (e.g. permissions policy);
      // fall back to the classic file input.
      fileInputTargetCol = col;
      document.getElementById('file-input').click();
    }
    return;
  }
  fileInputTargetCol = col;
  document.getElementById('file-input').click();
}

document.getElementById('file-input').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const col = fileInputTargetCol;
    resetHistory(col);
    state.cols[col].text = reader.result;
    // Store full path: use webkitRelativePath if available, else just name
    const fullPath = file.webkitRelativePath || file.name;
    state.cols[col].fullPath = fullPath;
    state.cols[col].userLoaded = true;
    state.cols[col].handle = null; // classic <input type=file> cannot yield a re-readable handle
    syncPathInput(col);
    recompute();
    setStatus(`Opened ${colLabel(col)}: ${fullPath}`);
  };
  reader.readAsText(file);
  e.target.value = '';
});

function saveFile(col){
  const text = state.cols[col].text;
  const filename = state.cols[col].fullPath || (col+'.txt');
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename.split(/[\\/]/).pop(); // use only filename part for download
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus(`Saved ${colLabel(col)}: ${filename}`);
}

async function refreshFile(col){
  const c = state.cols[col];
  const handle = c.handle;

  if(!handle){
    // No re-readable handle (e.g. file was loaded via the classic file
    // picker, or never loaded at all) — browsers don't allow re-reading an
    // arbitrary path for security reasons, so ask the user to pick the file
    // again, same as pressing Enter in the path field.
    if(!c.userLoaded){
      setStatus(`${colLabel(col)}: nothing to refresh — open a file first`);
      return;
    }
    setStatus(`${colLabel(col)}: can't auto-refresh this file — please reselect it`);
    openFile(col);
    return;
  }

  try{
    // Re-confirm read permission in case it was revoked since the file was opened.
    if(handle.queryPermission){
      let perm = await handle.queryPermission({ mode:'read' });
      if(perm !== 'granted'){
        perm = await handle.requestPermission({ mode:'read' });
        if(perm !== 'granted'){
          setStatus(`${colLabel(col)}: permission denied — can't refresh`);
          return;
        }
      }
    }
    const file = await handle.getFile();
    const text = await file.text();
    if(text === c.text){
      setStatus(`${colLabel(col)}: no changes on disk`);
      return;
    }
    resetHistory(col);
    c.text = text;
    recompute();
    setStatus(`Refreshed ${colLabel(col)} from disk: ${file.name}`);
  }catch(err){
    setStatus(`${colLabel(col)}: refresh failed — file may have been moved or deleted`);
  }
}

/* ======================================================================
   Drag & Drop file loading (path bar + editor content area)
   ====================================================================== */

// Only treat the drag as a file drag if the browser reports an actual
// file payload — this keeps normal text drag/drop inside the editable
// content untouched.
function isFileDrag(e){
  return !!(e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files'));
}

// Extract every dropped file (not just the first), grabbing FileSystemFileHandles
// synchronously where available so the Refresh button keeps working afterwards.
// Per the File System Access API, getAsFileSystemHandle()/getAsFile() must be
// called synchronously off the drop event before any other await, so all items
// are grabbed up front rather than looping with awaits in between.
async function getAllDroppedFiles(dt){
  const results = [];
  try{
    if(dt.items && dt.items.length){
      const fileItems = Array.from(dt.items).filter(it => it.kind === 'file');
      const handlePromises = fileItems.map(it =>
        typeof it.getAsFileSystemHandle === 'function' ? it.getAsFileSystemHandle() : Promise.resolve(null)
      );
      const fallbackFiles = fileItems.map(it => it.getAsFile());
      const handles = await Promise.all(handlePromises.map(p => Promise.resolve(p).catch(()=>null)));
      for(let i=0;i<fileItems.length;i++){
        let handle = handles[i];
        let file = null;
        if(handle && handle.kind === 'file'){
          try{ file = await handle.getFile(); }catch(err){ handle = null; }
        }
        if(!file) file = fallbackFiles[i];
        if(file) results.push({ file, handle: (handle && handle.kind==='file') ? handle : null });
      }
    }
    if(!results.length && dt.files && dt.files.length){
      Array.from(dt.files).forEach(f => results.push({ file: f, handle: null }));
    }
  }catch(err){
    if(!results.length && dt.files && dt.files.length){
      Array.from(dt.files).forEach(f => results.push({ file: f, handle: null }));
    }
  }
  return results;
}

async function loadFileIntoColumn(col, file, handle){
  const text = await file.text();
  resetHistory(col);
  state.cols[col].text = text;
  state.cols[col].fullPath = file.webkitRelativePath || file.name;
  state.cols[col].userLoaded = true;
  state.cols[col].handle = handle || null; // null if this browser can't give a reusable handle
  syncPathInput(col);
}

function setActiveModeButtons(mode){
  document.getElementById('btn-2way').classList.toggle('active', mode==='2way');
  document.getElementById('btn-3way').classList.toggle('active', mode==='3way');
}

/* Clears any manual pane-width split from dragging a connector handle
   (see setupOneResizeHandle), falling back to the CSS default (flex:1 on
   each pane, i.e. an equal split). A left/mid/right ratio the user set up
   for one mode isn't a meaningful starting point for the other -- 2-way
   only has two panes to begin with, and 3-way reintroduces a pane that
   had no width of its own yet -- so every 2-way/3-way switch starts the
   split fresh instead of carrying it over. */
function resetPaneWidths(){
  const leftEl = document.getElementById('pane-left');
  const midEl = document.getElementById('pane-mid');
  const rightEl = document.getElementById('pane-right');
  if(leftEl) leftEl.style.flex = '';
  if(midEl) midEl.style.flex = '';
  if(rightEl) rightEl.style.flex = '';
}

async function loadDroppedFile(col, dt){
  const entries = await getAllDroppedFiles(dt);
  if(!entries.length){ setStatus(`${colLabel(col)}: no file detected in the drop`); return; }

  if(entries.length >= 2){
    // Multiple files dropped at once: auto-switch mode and fill left-to-right,
    // regardless of which specific pane/path bar the files landed on.
    const wantMode = entries.length >= 3 ? '3way' : '2way';
    const useCols = wantMode==='3way' ? ['left','mid','right'] : ['left','right'];
    state.mode = wantMode;
    setActiveModeButtons(wantMode);
    resetPaneWidths();
    try{
      for(let i=0;i<useCols.length;i++){
        await loadFileIntoColumn(useCols[i], entries[i].file, entries[i].handle);
      }
      recompute();
      const summary = useCols.map((c,i)=>`${colLabel(c)}=${entries[i].file.name}`).join(', ');
      setStatus(`Switched to ${wantMode} and loaded ${useCols.length} files via drag & drop: ${summary}`);
    }catch(err){
      setStatus('Failed to read one or more dropped files');
    }
    return;
  }

  // Single file: load into whichever zone it was dropped on (unchanged behavior)
  try{
    await loadFileIntoColumn(col, entries[0].file, entries[0].handle);
    recompute();
    setStatus(`Loaded ${colLabel(col)} via drag & drop: ${state.cols[col].fullPath}`);
  }catch(err){
    setStatus(`${colLabel(col)}: failed to read dropped file`);
  }
}

function setupDropZone(el, col){
  if(!el) return;
  let dragDepth = 0;
  el.addEventListener('dragenter', (e)=>{
    if(!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth++;
    el.classList.add('drag-over');
  });
  el.addEventListener('dragover', (e)=>{
    if(!isFileDrag(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  el.addEventListener('dragleave', (e)=>{
    if(!isFileDrag(e)) return;
    dragDepth = Math.max(0, dragDepth-1);
    if(dragDepth===0) el.classList.remove('drag-over');
  });
  el.addEventListener('drop', (e)=>{
    if(!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth = 0;
    el.classList.remove('drag-over');
    loadDroppedFile(col, e.dataTransfer);
  });
}

  // Content area: drop a file anywhere on a pane to load it into that column.
  setupDropZone(document.getElementById('pane-left'), 'left');
  setupDropZone(document.getElementById('pane-mid'), 'mid');
  setupDropZone(document.getElementById('pane-right'), 'right');
}

/* ======================================================================
   Scroll sync between panes
   ====================================================================== */
let syncingScroll = false;
// When we programmatically set another pane's scrollTop/scrollLeft below,
// the browser still fires that pane's own 'scroll' event -- just
// asynchronously, after this handler (and its `syncingScroll` guard) has
// already finished and reset. That echo therefore isn't blocked by
// `syncingScroll` and re-enters this same logic for that pane, which then
// pushes new positions back to the others. Away from any add/del gap this
// is harmless (every column's layout agrees, so the echo computes the same
// position and nothing actually changes), but right at a gap the columns'
// layouts disagree (collapsed rows share one offset in the gap's column
// while the other column still has real height there), so each echo
// nudges the panes to slightly different positions and they fight over
// scrollTop instead of settling -- the jitter/stuck feel when scrolling
// past an added or deleted block. Tracking, per pane, that its very next
// 'scroll' event is just our own echo (and skipping it instead of
// re-syncing from it) breaks that loop.
const ignoreNextScroll = { left:false, mid:false, right:false };

function setupScrollSync(){
  const ids = ['scroll-left','scroll-mid','scroll-right'];
  const idToCol = id => id.slice('scroll-'.length);
  ids.forEach(id=>{
    const col = idToCol(id);
    document.getElementById(id).addEventListener('scroll', (e)=>{
      if(ignoreNextScroll[col]){ ignoreNextScroll[col] = false; return; }
      if(syncingScroll) return;
      syncingScroll = true;
      const srcCol = col;
      const top = e.target.scrollTop;
      const left = e.target.scrollLeft;
      // Find which row is at this pane's scroll position, then align every
      // other pane to that same row using its own real layout, so the
      // actual diff position stays lined up even if the panes' total
      // rendered heights differ (due to collapsed add/del gaps).
      const row = rowAtOffset(srcCol, top);
      const remainder = top - offsetForRow(srcCol, row);
      ids.forEach(other=>{
        if(other!==id){
          const el = document.getElementById(other);
          if(!el.closest('.pane').classList.contains('hidden')){
            const otherCol = idToCol(other);
            const newTop = Math.max(0, offsetForRow(otherCol, row) + remainder);
            // Only expect (and thus only ignore) an echo if we're actually
            // changing something -- an unchanged scrollTop/scrollLeft fires
            // no 'scroll' event at all, so flagging it anyway would leave
            // the flag stuck and wrongly swallow the pane's next real
            // user-initiated scroll.
            if(newTop !== el.scrollTop || left !== el.scrollLeft){
              ignoreNextScroll[otherCol] = true;
            }
            el.scrollTop = newTop;
            el.scrollLeft = left; // Sync horizontal scroll too, to make diff comparison easier
          }
        }
      });
      syncingScroll = false;
      updateGutterViewport();
    });
  });
}

/* Track where the user actually places the caret, so First/Prev/Next/Last
   can navigate relative to it instead of an independently-stepped counter.
   Also drives the current-line highlight: since each line is its own
   separate contenteditable div, moving the caret to a different line
   always re-fires focusin on a new element, so this is enough to catch
   every line-to-line move (click, arrow keys, Tab, etc.) without a full
   re-render -- render() applies the same class from state.cursorRow/
   cursorCol whenever a full re-render does happen (undo/redo, editing,
   merge/delete, diff navigation, ...) so the highlight stays correct
   either way. */
document.getElementById('editor-wrap').addEventListener('focusin', (e)=>{
  const el = e.target.closest('.content[contenteditable="true"]');
  if(!el) return;
  const row = parseInt(el.dataset.row, 10);
  const col = el.dataset.col;
  if(!Number.isNaN(row) && col){
    state.cursorRow = row;
    state.cursorCol = col;
    state.cursorGapAnchor = null;
    updateDiffNavButtonStates();
    setCurrentLineHighlight(row, col);
  }
});

/* Move the .current-line class to the given row/col without a full
   render() -- used for instant feedback on caret moves that don't
   otherwise trigger a re-diff/re-render. */
function setCurrentLineHighlight(row, col){
  document.querySelectorAll('.line.current-line').forEach(el=>{
    if(el.dataset.row !== String(row) || el.dataset.col !== col){
      el.classList.remove('current-line');
    }
  });
  const target = document.querySelector(`.line[data-row="${row}"][data-col="${col}"]`);
  if(target) target.classList.add('current-line');
}

/* ======================================================================
   Keyboard Up/Down navigation: move the caret to the same horizontal
   position on the previous/next real (non-gap) line within the same
   column, since each line is its own separate contenteditable div and
   the browser has no notion of "the line above" across that boundary.
   ====================================================================== */

/* Character offset of the caret within el's own text content (counting
   through any nested spans, e.g. the intra-line diff highlight markup). */
function getCaretCharOffset(el){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  return pre.toString().length;
}

/* Place the caret at the given character offset within el (clamped to
   el's text length), walking through any nested text nodes. */
function setCaretCharOffset(el, offset){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let remaining = offset;
  let node = walker.nextNode();
  let target = el, targetOffset = 0;
  while(node){
    const len = node.textContent.length;
    if(remaining <= len){ target = node; targetOffset = remaining; break; }
    remaining -= len;
    const next = walker.nextNode();
    if(!next){ target = node; targetOffset = len; break; } // clamp to end of last text node
    node = next;
  }
  const sel = window.getSelection();
  if(!sel) return;
  const range = document.createRange();
  try{
    range.setStart(target, targetOffset);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(err){ /* ignore */ }
}

document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos to default handling
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const col = el.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return;
  // Only the real (non-gap) lines in this column have a .content element,
  // in top-to-bottom order, so stepping through this list already skips
  // gap markers correctly.
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  const idx = allContents.indexOf(el);
  if(idx === -1) return;
  const targetIdx = e.key==='ArrowDown' ? idx+1 : idx-1;
  if(targetIdx < 0 || targetIdx >= allContents.length) return; // already at first/last line

  e.preventDefault();
  const charOffset = getCaretCharOffset(el);
  const targetEl = allContents[targetIdx];
  targetEl.focus({preventScroll:true});
  setCaretCharOffset(targetEl, charOffset);

  // Scroll the target line into view within its own pane only if needed,
  // without disturbing horizontal scroll position.
  const paneScroll = container.parentElement;
  const lineEl = targetEl.closest('.line');
  if(paneScroll && lineEl){
    const scrollRect = paneScroll.getBoundingClientRect();
    const lineRect = lineEl.getBoundingClientRect();
    if(lineRect.top < scrollRect.top){
      paneScroll.scrollTop -= (scrollRect.top - lineRect.top);
    } else if(lineRect.bottom > scrollRect.bottom){
      paneScroll.scrollTop += (lineRect.bottom - scrollRect.bottom);
    }
  }
});

/* ======================================================================
   Delete-at-end-of-line / Backspace-at-start-of-line: each line is its
   own separate contenteditable div (see renderColumn), so by default
   there's nothing on the other side of the div boundary for these keys to
   reach across -- pressing Delete at the end of a line or Backspace at
   the start of one would otherwise just do nothing. Handle both here so
   they behave like a normal text editor: merge this line with the
   neighboring one in the same column, dropping the newline between them.
   ====================================================================== */

/* Character offset of a given Range boundary (node, offset), counted
   within el's own text content. Same walk as getCaretCharOffset but for
   an arbitrary boundary rather than always the live selection's start,
   so it can be reused for both ends of a cross-line selection. */
function charOffsetInEl(el, node, offset){
  const pre = document.createRange();
  pre.selectNodeContents(el);
  try{ pre.setEnd(node, offset); }
  catch(err){ return el.textContent.length; }
  return pre.toString().length;
}

/* Replace the current selection with insertText, exactly like a normal
   text editor does when you type/paste/press Enter/Backspace over a
   selection -- even though here the selection may span several lines
   that are each their own separate contenteditable div (see
   renderColumn), so the browser has no native way to do this itself.
   insertText may itself contain '\n' (e.g. a multi-line paste), which
   splits into that many resulting lines. Passing '' just deletes the
   selection (used for Backspace/Delete/Cut). Returns true if a
   cross-line selection was found and handled, false otherwise (e.g. the
   selection was collapsed or confined to a single line, in which case
   the browser's own native editing already does the right thing and
   should be left alone). */
function replaceCrossLineSelection(insertText){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col) return false;
  if(startEl === endEl) return false; // single line: native editing already handles this

  const col = startEl.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return false;

  // Pull every line's LIVE (possibly not-yet-committed) text straight from
  // the DOM, same approach as mergeLinesInColumn/commitColumnEdits.
  const lineEls = container.querySelectorAll('.line:not(.empty) .content[contenteditable="true"]');
  const liveLines = [];
  lineEls.forEach(elx=>{ liveLines[+elx.dataset.lineIdx] = elx.textContent.replace(/\r/g, ''); });

  const startLineIdx = parseInt(startEl.dataset.lineIdx, 10);
  const endLineIdx = parseInt(endEl.dataset.lineIdx, 10);
  if(Number.isNaN(startLineIdx) || Number.isNaN(endLineIdx)) return false;
  // range.startContainer/endContainer are always in document order (earlier
  // point first) regardless of which direction the user dragged (see the
  // copy handler below), so startLineIdx is always <= endLineIdx here.
  const startCharOffset = charOffsetInEl(startEl, range.startContainer, range.startOffset);
  const endCharOffset = charOffsetInEl(endEl, range.endContainer, range.endOffset);

  const prefix = (liveLines[startLineIdx] || '').slice(0, startCharOffset);
  const suffix = (liveLines[endLineIdx] || '').slice(endCharOffset);

  const pieces = (insertText || '').split('\n');
  pieces[0] = prefix + pieces[0];
  pieces[pieces.length-1] = pieces[pieces.length-1] + suffix;
  liveLines.splice(startLineIdx, endLineIdx-startLineIdx+1, ...pieces);

  // A pending debounced commit from ordinary typing is now superseded by
  // this (which already reads the live, up-to-the-moment text) -- cancel
  // it so it doesn't redundantly re-fire and re-render afterward.
  if(editDebounce){ clearTimeout(editDebounce); editDebounce = null; }

  pushHistory(col);
  state.cols[col].text = liveLines.join('\n');

  const lastIdx = pieces.length-1;
  const targetLineIdx = startLineIdx + lastIdx;
  const targetOffset = pieces[lastIdx].length - suffix.length;
  recompute({keepView:true, restoreCaret:{col, lineIdx:targetLineIdx, offset:targetOffset}});
  return true;
}

document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'Delete' && e.key !== 'Backspace') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return; // leave modified combos (e.g. word-delete) to default handling
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return;

  if(!sel.isCollapsed){
    // A real selection exists. If it's confined to this one line's own
    // contenteditable div, the browser's native delete-selection handling
    // already works correctly -- leave it alone. If it spans multiple
    // lines, replaceCrossLineSelection does the equivalent by hand.
    if(replaceCrossLineSelection('')) e.preventDefault();
    return;
  }

  const col = el.dataset.col;
  const lineIdx = parseInt(el.dataset.lineIdx, 10);
  if(Number.isNaN(lineIdx)) return;

  const caretOffset = getCaretCharOffset(el);
  const textLen = el.textContent.length;

  if(e.key === 'Delete' && caretOffset === textLen){
    e.preventDefault();
    mergeLinesInColumn(col, lineIdx);
  } else if(e.key === 'Backspace' && caretOffset === 0 && lineIdx > 0){
    e.preventDefault();
    mergeLinesInColumn(col, lineIdx-1);
  }
});

/* Enter over a cross-line selection: split the selection's remainder onto
   a new line, same as a normal editor. (Enter with no selection, or a
   selection confined to a single line, is left to the browser's own
   default contenteditable behavior, unchanged from before.) */
document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;
  if(replaceCrossLineSelection('\n')) e.preventDefault();
});

/* Typing a character, IME composition, or a paste/drag-drop while a
   cross-line selection is active: beforeinput is the only reliable place
   to catch the actual text being inserted (arbitrary characters, IME
   results, or clipboard/drag contents), which keydown alone can't give
   us. deleteContentBackward/Forward are also handled here as a fallback
   for input methods (e.g. some virtual keyboards) that go straight to
   beforeinput without a matching keydown Backspace/Delete. */
document.getElementById('editor-wrap').addEventListener('beforeinput', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col || startEl===endEl) return;

  let insertText = null;
  if(e.inputType==='insertText' || e.inputType==='insertReplacementText'){
    insertText = e.data || '';
  } else if(e.inputType==='insertFromPaste' || e.inputType==='insertFromDrop'){
    insertText = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || '';
  } else if(e.inputType==='insertParagraph' || e.inputType==='insertLineBreak'){
    insertText = '\n';
  } else if(e.inputType==='deleteContentBackward' || e.inputType==='deleteContentForward'){
    insertText = '';
  } else {
    return; // some other input type over a cross-line selection -- leave untouched
  }

  e.preventDefault();
  replaceCrossLineSelection(insertText);
});

/* Multi-line text selection: each line is rendered as its own separate
   contenteditable div (see renderColumn), which browsers treat as an
   editing boundary during a native mouse drag -- dragging from one line
   into the next just gets clipped at that boundary, so only a single
   line's text could ever be selected. Handling the drag manually with the
   Selection API bypasses that per-element clipping, letting a drag span
   any number of lines within the same pane, same as a normal editor. */
(function setupMultiLineSelection(){
  let isSelecting = false;
  // The anchor is the fixed end of the selection (where a plain click
  // started it); it persists after mouseup so a later Shift+click can
  // extend the selection from that same point, like a normal text editor.
  let anchorNode = null, anchorOffset = 0, anchorCol = null;

  // Latest raw pointer position, updated on every mousemove while
  // selecting. Read by the auto-scroll frame loop below rather than
  // driving selection directly from the mousemove event, so that holding
  // the pointer still at the pane's edge keeps scrolling (and extending
  // the selection) frame after frame, the same as a native text editor --
  // not just on the moves that happen to occur.
  let lastClientX = 0, lastClientY = 0;
  let autoScrollHandle = null;

  const editorWrapEl = document.getElementById('editor-wrap');

  function caretFromPoint(x, y){
    if(document.caretPositionFromPoint){
      const pos = document.caretPositionFromPoint(x, y);
      if(pos) return {node: pos.offsetNode, offset: pos.offset};
    }
    if(document.caretRangeFromPoint){
      const range = document.caretRangeFromPoint(x, y);
      if(range) return {node: range.startContainer, offset: range.startOffset};
    }
    return null;
  }

  function extendTo(x, y){
    const caret = caretFromPoint(x, y);
    if(!caret || !anchorNode) return;
    const sel = window.getSelection();
    if(!sel) return;
    try{
      sel.setBaseAndExtent(anchorNode, anchorOffset, caret.node, caret.offset);
    }catch(err){ /* point briefly resolved to an invalid range mid-drag; ignore */ }
  }

  function scrollElForCol(col){
    if(col === 'left') return document.getElementById('scroll-left');
    if(col === 'mid') return document.getElementById('scroll-mid');
    if(col === 'right') return document.getElementById('scroll-right');
    return null;
  }

  // Edge-scroll tuning: within EDGE_MARGIN px of the pane's inner edge,
  // scroll speed ramps up from near-zero to MAX_SPEED; once the pointer
  // is actually outside the pane, speed stays pinned at MAX_SPEED (scaled
  // slightly further by how far outside it is, capped) so dragging far
  // past the edge doesn't feel any different from a native editor.
  const EDGE_MARGIN = 34;
  const MAX_SPEED = 24;

  function edgeSpeed(pos, nearEdge, farEdge, sign){
    // sign: -1 => this is the "start" edge (top/left), scrolling should
    // be negative when triggered; +1 => "end" edge (bottom/right).
    if(sign < 0){
      if(pos >= nearEdge) return 0;
      if(pos <= farEdge) return -MAX_SPEED;
      const t = 1 - (pos - farEdge) / (nearEdge - farEdge);
      return -Math.max(2, Math.round(MAX_SPEED * t));
    } else {
      if(pos <= nearEdge) return 0;
      if(pos >= farEdge) return MAX_SPEED;
      const t = 1 - (farEdge - pos) / (farEdge - nearEdge);
      return Math.max(2, Math.round(MAX_SPEED * t));
    }
  }

  function autoScrollTick(){
    if(!isSelecting){ autoScrollHandle = null; return; }
    const scrollEl = scrollElForCol(anchorCol);
    if(scrollEl){
      const rect = scrollEl.getBoundingClientRect();

      const dy = lastClientY < rect.top + EDGE_MARGIN
        ? edgeSpeed(lastClientY, rect.top + EDGE_MARGIN, rect.top - EDGE_MARGIN, -1)
        : edgeSpeed(lastClientY, rect.bottom - EDGE_MARGIN, rect.bottom + EDGE_MARGIN, 1);
      const dx = lastClientX < rect.left + EDGE_MARGIN
        ? edgeSpeed(lastClientX, rect.left + EDGE_MARGIN, rect.left - EDGE_MARGIN, -1)
        : edgeSpeed(lastClientX, rect.right - EDGE_MARGIN, rect.right + EDGE_MARGIN, 1);

      if(dy) scrollEl.scrollTop += dy;
      if(dx) scrollEl.scrollLeft += dx;

      // Extend the selection every frame (not just on scroll) so a
      // stationary pointer inside the pane still tracks smoothly, and
      // clamp the point used for hit-testing to just inside the pane so
      // a pointer that has wandered outside it (above/below/left/right)
      // still resolves to a real caret at that boundary, expanding the
      // selection right up to the newly-scrolled-in content.
      const px = Math.min(Math.max(lastClientX, rect.left + 1), rect.right - 1);
      const py = Math.min(Math.max(lastClientY, rect.top + 1), rect.bottom - 1);
      extendTo(px, py);
    }
    autoScrollHandle = requestAnimationFrame(autoScrollTick);
  }

  function startSelecting(){
    isSelecting = true;
    editorWrapEl.classList.add('is-selecting');
    if(autoScrollHandle === null) autoScrollHandle = requestAnimationFrame(autoScrollTick);
  }

  function stopSelecting(){
    isSelecting = false;
    editorWrapEl.classList.remove('is-selecting');
    if(autoScrollHandle !== null){ cancelAnimationFrame(autoScrollHandle); autoScrollHandle = null; }
  }

  editorWrapEl.addEventListener('mousedown', (e)=>{
    if(e.button !== 0) return; // left button only
    if(e.detail > 1) return; // let native double/triple-click word/line selection behave normally
    const contentEl = e.target.closest('.content[contenteditable="true"]');
    if(!contentEl || e.target.closest('.actbtn')) return;

    lastClientX = e.clientX; lastClientY = e.clientY;

    if(e.shiftKey && anchorNode && anchorCol === contentEl.dataset.col){
      // Shift+click: keep the existing anchor and just extend the
      // selection's other end to the click point, same as native
      // shift+click text selection.
      e.preventDefault();
      startSelecting();
      extendTo(e.clientX, e.clientY);
      return;
    }

    // Plain click: start a brand new selection anchored here. Suppress the
    // browser's own default mousedown selection handling and place the
    // (initially collapsed) caret ourselves -- if we let it run alongside
    // our mousemove-driven extension below, the two fight over the
    // selection during a drag (the native one keeps clipping back to a
    // single contenteditable line), which is what made a plain drag
    // intermittently only select one line.
    e.preventDefault();
    startSelecting();
    anchorCol = contentEl.dataset.col;
    const caret = caretFromPoint(e.clientX, e.clientY);
    anchorNode = caret ? caret.node : contentEl;
    anchorOffset = caret ? caret.offset : 0;
    contentEl.focus({preventScroll:true});
    const sel = window.getSelection();
    if(sel){
      try{ sel.setBaseAndExtent(anchorNode, anchorOffset, anchorNode, anchorOffset); }
      catch(err){ /* ignore */ }
    }
  });

  document.addEventListener('mousemove', (e)=>{
    if(!isSelecting || !anchorNode) return;
    lastClientX = e.clientX; lastClientY = e.clientY;
    // The auto-scroll frame loop (started on mousedown) reads
    // lastClientX/Y every frame and both scrolls the pane when the
    // pointer is near/past its edge and extends the selection
    // accordingly, so no direct extendTo() call is needed here -- that
    // keeps a single code path for both in-bounds dragging and
    // edge/out-of-bounds dragging instead of two that can disagree.
  });

  document.addEventListener('mouseup', ()=>{
    stopSelecting();
  });
})();

/* When a selection spans multiple lines, the DOM range can pass through
   sibling elements sitting between/after the .content divs -- namely each
   line's line-number cell and its merge/delete action buttons -- so a
   plain browser copy would include their glyphs in the clipboard text.
   Rebuild the copied text from just the .content elements' own text
   (respecting the exact partial-line boundaries of the selection) instead
   of trusting the browser's default serialization of the raw DOM range. */
function closestContentEl(node){
  if(!node) return null;
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el ? el.closest('.content[contenteditable="true"]') : null;
}

/* Build the plain-text clipboard contents for a selection that starts in
   startEl and ends in endEl (both within the same column's line list),
   respecting the exact partial-line boundaries of range. Shared by the
   copy and cut handlers below. Returns null if startEl/endEl can't be
   located in that column's line list. */
function buildMultiLineClipboardText(range, startEl, endEl){
  const col = startEl.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return null;
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  const startIdx = allContents.indexOf(startEl);
  const endIdx = allContents.indexOf(endEl);
  if(startIdx === -1 || endIdx === -1) return null;
  const lo = Math.min(startIdx, endIdx), hi = Math.max(startIdx, endIdx);

  const lines = [];
  for(let i = lo; i <= hi; i++){
    const el = allContents[i];
    const lineRange = document.createRange();
    // range.startContainer/endContainer are always in document order
    // (earlier point first) regardless of which direction the user
    // dragged, so no extra swapping is needed here.
    if(i === startIdx) lineRange.setStart(range.startContainer, range.startOffset);
    else lineRange.setStart(el, 0);
    if(i === endIdx) lineRange.setEnd(range.endContainer, range.endOffset);
    else lineRange.setEnd(el, el.childNodes.length);
    lines.push(lineRange.toString());
  }
  return lines.join('\n');
}

document.getElementById('editor-wrap').addEventListener('copy', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return; // nothing selected; let default copy happen
  const range = sel.getRangeAt(0);

  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  // Only take over for selections that live inside our editable lines and
  // stay within a single column; anything else falls back to the browser's
  // normal copy behavior untouched.
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col) return;

  const text = buildMultiLineClipboardText(range, startEl, endEl);
  if(text === null) return;
  e.clipboardData.setData('text/plain', text);
  e.preventDefault();
});

/* Cut (Ctrl+X) over a selection spanning multiple lines: same reasoning
   as copy above for what goes on the clipboard, then remove the selected
   text via replaceCrossLineSelection since the browser can't natively
   delete across separate per-line contenteditable divs (see the keydown/
   beforeinput handlers above). A selection confined to a single line is
   left to the browser's own native cut, which already works fine. */
document.getElementById('editor-wrap').addEventListener('cut', (e)=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);

  const startEl = closestContentEl(range.startContainer);
  const endEl = closestContentEl(range.endContainer);
  if(!startEl || !endEl || startEl.dataset.col !== endEl.dataset.col || startEl === endEl) return;

  const text = buildMultiLineClipboardText(range, startEl, endEl);
  if(text === null) return;
  e.clipboardData.setData('text/plain', text);
  e.preventDefault();
  replaceCrossLineSelection('');
});

/* Ctrl+A / Cmd+A: each line lives in its own separate contenteditable
   div, so the browser's native "select all" only ever reaches the single
   div that currently has focus. Intercept it here and build a selection
   that spans from the very first line's content to the very last line's
   content in that same column, so it behaves like selecting the whole
   file instead of just one line. */
document.getElementById('editor-wrap').addEventListener('keydown', (e)=>{
  if((e.key !== 'a' && e.key !== 'A') || !(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  const el = e.target.closest && e.target.closest('.content[contenteditable="true"]');
  if(!el) return;

  const col = el.dataset.col;
  const container = document.getElementById('lines-' + col);
  if(!container) return;
  const allContents = Array.from(container.querySelectorAll('.content[contenteditable="true"]'));
  if(!allContents.length) return;

  e.preventDefault();
  const first = allContents[0];
  const last = allContents[allContents.length - 1];
  const sel = window.getSelection();
  if(!sel) return;
  try{
    sel.setBaseAndExtent(first, 0, last, last.childNodes.length);
  }catch(err){ /* ignore */ }
});

/* Click on gutter -> jump to proportional file position
   If click lands on a marker, jump to that diff block;
   otherwise jump to the proportional row in the file. */
function setupGutterClicks(){
  ['gutter-lm','gutter-mr'].forEach(gutterId=>{
    const gutterEl = document.getElementById(gutterId);
    if(!gutterEl) return;
    gutterEl.addEventListener('click', (e)=>{
      const gutterH = gutterEl.offsetHeight;
      const totalRows = state.rows.length;
      if(!gutterH || !totalRows) return;

      // y position relative to gutter top
      const rect = gutterEl.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const ratio = Math.max(0, Math.min(1, y / gutterH));

      // Check if a marker was clicked -> jump to that diff block
      const marker = e.target.closest('.marker');
      if(marker){
        const startRow = parseInt(marker.dataset.blockStart, 10);
        const idx = state.diffBlocks.findIndex(b=> startRow>=b.start && startRow<=b.end);
        if(idx>=0){
          state.currentDiffIndex = idx;
          render();
          scrollToRow(startRow);
          updateDiffCounter();
          setStatus(`Jumped to diff ${idx+1} / ${state.diffBlocks.length}`);
          return;
        }
      }

      // Otherwise jump to proportional row
      const targetRow = Math.floor(ratio * totalRows);
      // Find nearest diff block to highlight
      let nearestIdx = -1;
      let nearestDist = Infinity;
      state.diffBlocks.forEach((b, i)=>{
        const dist = Math.min(Math.abs(b.start - targetRow), Math.abs(b.end - targetRow));
        if(dist < nearestDist){ nearestDist = dist; nearestIdx = i; }
      });
      if(nearestIdx >= 0) state.currentDiffIndex = nearestIdx;

      // Scroll all panes to proportional position
      const totalFileH = totalRows * LINE_H;
      const scrollEl = document.getElementById('scroll-left');
      const newScrollTop = Math.max(0, ratio * totalFileH - scrollEl.clientHeight / 2);
      const ids = state.mode==='3way'
        ? ['scroll-left','scroll-mid','scroll-right']
        : ['scroll-left','scroll-right'];
      ids.forEach(id=>{ document.getElementById(id).scrollTop = newScrollTop; });
      updateGutterViewport();
      render();
      updateDiffCounter();
      setStatus(`Jumped to ${Math.round(ratio*100)}% of file`);
    });
  });
}

/* Keyboard shortcuts: Ctrl+Z / Ctrl+Y while focused inside a pane */
document.addEventListener('keydown', (e)=>{
  if(!(e.ctrlKey || e.metaKey)) return;
  const active = document.activeElement;
  const colEl = active && active.closest('.pane');
  if(!colEl) return;
  let col = null;
  if(colEl.id==='pane-left') col='left';
  else if(colEl.id==='pane-mid') col='mid';
  else if(colEl.id==='pane-right') col='right';
  if(!col) return;
  if(e.key==='z' || e.key==='Z'){
    e.preventDefault();
    if(e.shiftKey) redo(col); else undo(col);
  } else if(e.key==='y' || e.key==='Y'){
    e.preventDefault();
    redo(col);
  }
});

/* ======================================================================
   Init
   ====================================================================== */
// Sync path inputs from initial state
syncPathInput('left');
syncPathInput('mid');
syncPathInput('right');
setupScrollSync();
setupGutterClicks();
setupAllDropZones();
setupConnectorResizeHandles();
recompute();
setStatus('Ready');

// Re-measure column widths and re-render gutters when window is resized
window.addEventListener('resize', ()=>{
  equalizeColumnWidths();
  rebuildColumnLayouts();
  renderGutters();
});

/* ======================================================================
   Light / Dark theme toggle
   ====================================================================== */
(function(){
  const htmlEl = document.documentElement;
  const btn = document.getElementById('btn-theme');
  const iconSun = document.getElementById('icon-theme-sun');
  const iconMoon = document.getElementById('icon-theme-moon');
  const label = document.getElementById('theme-label');

  function applyTheme(theme){
    if(theme === 'dark'){
      htmlEl.setAttribute('data-theme','dark');
      iconSun.style.display = 'none';
      iconMoon.style.display = '';
      label.textContent = 'Dark';
      btn.title = 'Switch to light mode';
    } else {
      htmlEl.removeAttribute('data-theme');
      iconSun.style.display = '';
      iconMoon.style.display = 'none';
      label.textContent = 'Light';
      btn.title = 'Switch to dark mode';
    }
  }

  let saved = null;
  try{ saved = localStorage.getItem('difftool-theme'); }catch(e){ /* ignore */ }
  applyTheme(saved ? saved : 'dark');

  btn.addEventListener('click', ()=>{
    const isDark = htmlEl.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('difftool-theme', next); }catch(e){ /* ignore */ }
  });
})();
</script>
