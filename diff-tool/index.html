// Warn before leaving the page while any column has edits that were neither
// written to a file nor downloaded.
window.addEventListener('beforeunload', (e)=>{
  flushPendingEdits();
  const risky = ['left','mid','right'].some(col=>{
    const c = state.cols[col];
    return isDirty(c) && normEol(c.text) !== c.exportedText;
  });
  if(risky){ e.preventDefault(); e.returnValue = ''; return ''; }
});

// Re-measure column widths and re-render gutters when window is resized
window.addEventListener('resize', ()=>{
  equalizeColumnWidths();
  rebuildColumnLayouts();
  renderGutters();
});

/* ======================================================================
   Directory Compare (Phase 1)
   Kept separate from the text-compare state: everything below lives in its
   own closure and only touches the text-compare side through the existing
   helpers (applyLoadedFile / recompute / confirmDiscardFor ...).
   Everything runs locally in the browser; nothing is uploaded.
   ====================================================================== */
(function(){
  'use strict';

  const ROW_H = 28;                    // px, must match .dv-row height in CSS
  const CHUNK_BYTES = 4 * 1024 * 1024; // content comparison reads 4 MiB at a time
  const COMPARE_CONCURRENCY = 8;       // files compared at the same time
  const SCAN_DIR_CONCURRENCY = 6;      // folders listed at the same time, per scanned directory
  const SCAN_FILE_CONCURRENCY = 32;    // getFile() calls in flight at the same time, per scanned directory
  const SNIFF_BYTES = 8192;            // bytes inspected to detect binary files
  const MAX_DIFF_CELLS = 25e6;         // lineCountLeft * lineCountRight before warning (LCS table size)
  const CANCELLED = { cancelled: true };

  const STATUS = {
    same:      { label: 'Same',       glyph: '=',      cls: 's-same'  },
    different: { label: 'Different',  glyph: '\u2260', cls: 's-diff'  },
    left:      { label: 'Left Only',  glyph: '\u2190', cls: 's-left'  },
    mid:       { label: 'Middle Only', glyph: '\u2193', cls: 's-mid'   },
    right:     { label: 'Right Only', glyph: '\u2192', cls: 's-right' },
    error:     { label: 'Error',      glyph: '!',      cls: 's-err'   },
  };

  /* ---------- Directory Compare state (separate from `state`) ---------- */
  function newSide(){
    return { name: '', handle: null, producer: null, rescannable: false, files: null, dirs: null, errors: [], scanning: false, scanId: 0, progress: 0 };
  }
  const dc = {
    left: newSide(),
    mid: newSide(),
    right: newSide(),
    mode: '2way',         // '2way' | '3way' (Directory Compare's own setting)
    fr: [1, 1, 1],        // relative column widths (pixel-weighted once a handle has been dragged)
    results: null,        // null = not compared yet
    tree: null,           // merged folder tree built from results
    diffNodes: [],        // leaf entries (files / empty folders) that are not 'same', in tree order
    nodeByKey: null,
    visible: [],          // flattened, currently visible tree nodes
    comparing: false,
    runId: 0,
    selectedKey: null,    // 'kind:path' of the selected row (file or folder)
    opening: false,
    view: 'text',         // 'text' | 'dir'
    savedScroll: null,
    fallbackSide: null,
    staleNote: '',        // shown with the next comparison result (fallback sides cannot be re-read)
    keepStale: false,
    keepView: false,      // Refresh of one column: keep the other columns on screen until the new result is ready
  };

  const $ = id => document.getElementById(id);
  const sideLabel = side => side === 'left' ? 'Left' : side === 'mid' ? 'Middle' : 'Right';
  const SK = { left: 'L', mid: 'M', right: 'R' };                    // suffix of the per-side tree fields
  const KS = { L: 'left', M: 'mid', R: 'right' };
  const activeSides = () => dc.mode === '3way' ? ['left', 'mid', 'right'] : ['left', 'right'];
  const yieldUi = () => new Promise(r => setTimeout(r, 0));
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function describeError(err){
    const n = err && err.name;
    if(n === 'NotAllowedError' || n === 'SecurityError') return 'permission was denied or is no longer valid';
    if(n === 'NotFoundError') return 'the file or directory no longer exists';
    if(n === 'NotReadableError') return 'it could not be read (it may have changed or be locked by another program)';
    return (err && err.message) || String(err);
  }

  function formatSize(n){
    if(n === null || n === undefined) return '-';
    if(n < 1024) return n + ' B';
    const units = ['KB', 'MB', 'GB', 'TB'];
    let v = n / 1024, i = 0;
    while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
    return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + ' ' + units[i];
  }

  // All Directory Compare messages (progress, warnings, errors, results) go to the status bar.
  // An empty text leaves the current status alone.
  function setMsg(text, isError){ if(text) setStatus(text, !!isError); }
  function setProgress(text){ if(text) setStatus(text); }

  const pickerSupported = () => typeof window.showDirectoryPicker === 'function';
  const fallbackSupported = () => 'webkitdirectory' in document.createElement('input');

  /* ---------- Mode switch ---------- */
  function setViewMode(mode){
    if(mode === dc.view) return;
    const body = document.body;
    if(mode === 'dir'){
      try{ flushPendingEdits(); }catch(_){ /* nothing pending */ }
      // display:none resets scroll offsets, so remember them for the way back.
      dc.savedScroll = ['left','mid','right'].map(c => {
        const el = $('scroll-' + c);
        return el ? [el.scrollTop, el.scrollLeft] : [0, 0];
      });
      body.classList.add('dir-mode');
      $('dir-view').classList.remove('hidden');
      dc.view = 'dir';
      paintRows(true);
    } else {
      body.classList.remove('dir-mode');
      $('dir-view').classList.add('hidden');
      dc.view = 'text';
      // The panes were hidden: let the existing resize logic re-measure them.
      window.dispatchEvent(new Event('resize'));
      if(dc.savedScroll){
        ['left','mid','right'].forEach((c, i) => {
          const el = $('scroll-' + c);
          if(el && dc.savedScroll[i]){ el.scrollTop = dc.savedScroll[i][0]; el.scrollLeft = dc.savedScroll[i][1]; }
        });
      }
    }
    $('mode-text').classList.toggle('active', dc.view === 'text');
    $('mode-dir').classList.toggle('active', dc.view === 'dir');
    $('mode-text').setAttribute('aria-pressed', String(dc.view === 'text'));
    $('mode-dir').setAttribute('aria-pressed', String(dc.view === 'dir'));
    setStatus(dc.view === 'dir' ? 'Directory Compare' : 'Text Compare');
  }

  /* ---------- Selecting a directory ---------- */
  async function selectDirectory(side){
    const label = sideLabel(side);
    if(pickerSupported()){
      let handle;
      try{
        handle = await window.showDirectoryPicker({ mode: 'read' });
      }catch(err){
        if(err && err.name === 'AbortError'){ setMsg(`${label}: directory selection cancelled.`); return; }
        // Blocked (e.g. embedded frame / permissions policy): use the classic folder input instead.
        if(fallbackSupported()){ dc.fallbackSide = side; $('dv-input').click(); return; }
        setMsg(`${label}: could not open the directory picker - ${describeError(err)}.`, true);
        return;
      }
      await runScan(side, handle.name, handle, ctl => scanDirectory(handle, ctl));
      return;
    }
    if(!fallbackSupported()){
      setMsg('This browser cannot select directories. Use a recent version of Chrome, Edge, Firefox or Safari.', true);
      return;
    }
    dc.fallbackSide = side;
    $('dv-input').click();
  }

  // Fallback: <input webkitdirectory>. Files are only read locally by the browser.
  $('dv-input').addEventListener('change', (e) => {
    const side = dc.fallbackSide;
    const list = Array.from(e.target.files || []);   // copy before resetting the input
    e.target.value = '';
    dc.fallbackSide = null;
    if(!side) return;
    if(!list.length){
      setMsg(`${sideLabel(side)}: no files were selected (the folder is empty, or the selection was cancelled).`);
      return;
    }
    const rootName = (list[0].webkitRelativePath || '').split('/')[0] || 'Selected folder';
    runScan(side, rootName, null, ctl => scanFileList(list, ctl), false);
  });

  // rescannable: false for the <input webkitdirectory> fallback, whose FileList is a one-time snapshot.
  async function runScan(side, name, handle, producer, rescannable = true, keepView = false){
    const s = dc[side];
    const id = ++s.scanId;            // supersedes any scan still running for this side
    // Results no longer match the selection. Normally they are cleared; when only one column is refreshed the
    // other columns stay on screen (that column alone shows up empty) until the new comparison is ready.
    const keep = keepView && !!dc.results;
    const prev = keep ? dc.results : null;
    cancelCompare(true);
    if(!keep) clearResults();
    dc.keepView = keep;
    if(!dc.keepStale) dc.staleNote = '';
    s.name = name; s.handle = handle; s.producer = producer; s.rescannable = rescannable; s.files = null; s.dirs = null; s.errors = []; s.scanning = true; s.progress = 0;
    updateSideUI(side);
    updateCompareButton();
    setMsg('');
    if(keep) previewWithout(side, prev);
    const ctl = {
      check(){ if(s.scanId !== id) throw CANCELLED; },
      progress(n){ s.progress = n; updateSideUI(side); },
    };
    try{
      const out = await producer(ctl);
      ctl.check();
      s.files = buildFileIndex(out.files);
      s.dirs = new Map((out.dirs || []).map(d => [d.path, d]));   // every directory, flagged empty or not
      s.errors = out.errors;
      if(out.errors.length){
        setMsg(`${sideLabel(side)}: ${out.errors.length} item(s) could not be read and are flagged as Error.`, true);
      } else if(s.files.size === 0 && s.dirs.size === 0){
        setMsg(`${sideLabel(side)}: the selected directory is empty.`);
      }
    }catch(err){
      if(err === CANCELLED) return;
      s.files = null;
      setMsg(`${sideLabel(side)}: scanning failed - ${describeError(err)}.`, true);
    }finally{
      if(s.scanId === id){
        s.scanning = false;
        updateSideUI(side);
        updateCompareButton();
        updateHint();
        maybeAutoCompare();
        if(!s.files) dc.keepView = false;          // the scan failed: nothing more is coming
      }
    }
  }

  // Compare automatically as soon as both sides have been scanned. With two scans running at
  // once (two directories dropped together) only the one that finishes last starts it.
  function maybeAutoCompare(){
    const sides = activeSides();
    if(dc.comparing || sides.some(sd => dc[sd].scanning)) return;
    if(sides.some(sd => dc[sd].name && !dc[sd].files)) return;     // a chosen directory whose scan was cancelled
    if(!sides.some(sd => dc[sd].files)) return;                    // nothing chosen yet
    runCompare(true);
  }

  // Re-compare must see changes made on disk since the last scan (added, modified, deleted
  // files), so both directories are scanned again first; the comparison then starts by itself.
  // Directories chosen through the folder-upload fallback cannot be re-read by the page.
  async function rescanAndCompare(){
    const named = activeSides().filter(sd => dc[sd].name && dc[sd].producer);
    if(!named.length){ setMsg('Select a directory first.', true); return; }
    // Scan again whatever can be re-read, plus any side whose scan was cancelled (it has no file list yet).
    const sides = named.filter(sd => dc[sd].rescannable || !dc[sd].files);
    const stale = named.filter(sd => dc[sd].files && !dc[sd].rescannable);
    const note = stale.length
      ? `${stale.map(sideLabel).join(' and ')} was selected through the folder-upload fallback, so later changes in it `
        + 'cannot be detected. Select it again to refresh.'
      : '';
    dc.staleNote = note;
    if(sides.length){
      dc.keepStale = true;     // runScan would otherwise reset the note
      try{ await Promise.all(sides.map(sd => runScan(sd, dc[sd].name, dc[sd].handle, dc[sd].producer, dc[sd].rescannable))); }
      finally{ dc.keepStale = false; }
    } else {
      await runCompare();
    }
  }

  // Stop scanning that is still in progress. The selected directory stays selected (name, handle),
  // so Re-compare can scan and compare it again.
  function cancelScans(){
    for(const side of ['left', 'mid', 'right']){
      const s = dc[side];
      if(!s.scanning) continue;
      s.scanId++;
      Object.assign(s, { scanning: false, files: null, dirs: null, errors: [], progress: 0 });
      updateSideUI(side);
    }
    updateCompareButton();
    updateHint();
    setMsg('');
    setStatus('Scanning cancelled.');     // status bar only
  }

  /* ---------- Recursive scan (File System Access API) ---------- */
  function makeSemaphore(n){
    let free = n;
    const waiting = [];
    return {
      async acquire(){ if(free > 0){ free--; return; } await new Promise(res => waiting.push(res)); },
      release(){ const next = waiting.shift(); if(next) next(); else free++; },
    };
  }

  // Folders are listed and files opened several at a time: every getFile() is a round trip to the browser,
  // so doing them one after another is what makes big trees slow.
  async function scanDirectory(directoryHandle, ctl){
    const files = [];
    const errors = [];
    const dirs = [];     // every sub-directory; `empty` = holds no files and no sub-directories
    const dirSem = makeSemaphore(SCAN_DIR_CONCURRENCY);
    const fileSem = makeSemaphore(SCAN_FILE_CONCURRENCY);
    let lastYield = performance.now();
    let lastProgress = 0;

    const openFile = async (child, rel, name) => {
      await fileSem.acquire();
      try{
        ctl.check();
        const file = await child.getFile();
        files.push({ path: rel, name, size: file.size, file, handle: child });
      }catch(err){
        if(err === CANCELLED) return;               // the scan as a whole reports the cancellation
        const message = describeError(err);
        errors.push({ path: rel, message });
        files.push({ path: rel, name, size: null, file: null, error: message });
      }finally{
        fileSem.release();
      }
      const now = performance.now();
      if(now - lastProgress > 100){ lastProgress = now; ctl.progress(files.length); }
    };

    const walk = async (handle, prefix) => {
      const tasks = [];
      let count = 0;
      await dirSem.acquire();
      try{
        for await (const [name, child] of handle.entries()){
          ctl.check();
          count++;
          const rel = prefix + name;
          if(child.kind === 'directory') tasks.push(walk(child, rel + '/'));
          else tasks.push(openFile(child, rel, name));
          if(performance.now() - lastYield > 40){
            lastYield = performance.now();
            await yieldUi();
          }
        }
        if(prefix) dirs.push({ path: prefix.slice(0, -1), empty: count === 0 });
      }catch(err){
        if(err !== CANCELLED){
          if(prefix) dirs.push({ path: prefix.slice(0, -1), empty: false });   // unreadable: never claim "empty"
          errors.push({ path: prefix || '/', message: describeError(err) });
        }
      }finally{
        dirSem.release();
      }
      await Promise.all(tasks);
    };

    await walk(directoryHandle, '');
    ctl.check();                                    // throws CANCELLED if the scan was cancelled meanwhile
    ctl.progress(files.length);
    return { files, errors, dirs };
  }

  // Fallback scan: the FileList already holds every file with its relative path.
  async function scanFileList(list, ctl){
    const files = [];
    for(let i = 0; i < list.length; i++){
      if((i & 1023) === 0) ctl.check();
      const f = list[i];
      const rp = f.webkitRelativePath || f.name;
      const slash = rp.indexOf('/');
      const rel = slash >= 0 ? rp.slice(slash + 1) : rp;   // drop the selected root folder's own name
      files.push({ path: rel, name: f.name, size: f.size, file: f });
    }
    // Directories can only be inferred from file paths here; the browser does not report empty folders.
    const dirSet = new Set();
    for(const f of files){
      const parts = f.path.split('/');
      for(let i = 1; i < parts.length; i++) dirSet.add(parts.slice(0, i).join('/'));
    }
    ctl.progress(files.length);
    return { files, errors: [], dirs: Array.from(dirSet, path => ({ path, empty: false })) };
  }

  // Map keyed by relative path (case-sensitive, '/' separated).
  function buildFileIndex(files){
    const index = new Map();
    for(const f of files) index.set(f.path, f);
    return index;
  }

  /* ---------- Comparison ---------- */
  function buffersEqual(a, b){
    const n = a.byteLength;
    if(n !== b.byteLength) return false;
    const n4 = n >>> 2;
    const a32 = new Uint32Array(a, 0, n4), b32 = new Uint32Array(b, 0, n4);
    for(let i = 0; i < n4; i++) if(a32[i] !== b32[i]) return false;
    if(n4 * 4 < n){
      const a8 = new Uint8Array(a), b8 = new Uint8Array(b);
      for(let i = n4 * 4; i < n; i++) if(a8[i] !== b8[i]) return false;
    }
    return true;
  }

  // Byte-for-byte comparison in chunks, so large files never sit in memory whole.
  async function compareFileContents(leftFile, rightFile, ctl){
    if(leftFile.size !== rightFile.size) return false;
    const size = leftFile.size;
    for(let off = 0; off < size; off += CHUNK_BYTES){
      if(ctl) ctl.check();
      const end = Math.min(off + CHUNK_BYTES, size);
      const [a, b] = await Promise.all([
        leftFile.slice(off, end).arrayBuffer(),
        rightFile.slice(off, end).arrayBuffer(),
      ]);
      if(!buffersEqual(a, b)) return false;
    }
    return true;
  }

  // Middle file of a 3-way comparison against one or two others: every chunk of the middle file is read once
  // and checked against each outer file that is still equal. Returns one boolean per outer file.
  async function compareMiddleWithOthers(midFile, others, ctl){
    const size = midFile.size;
    const alive = others.map(() => true);
    for(let off = 0; off < size && alive.some(Boolean); off += CHUNK_BYTES){
      if(ctl) ctl.check();
      const end = Math.min(off + CHUNK_BYTES, size);
      const [mb, ...obs] = await Promise.all([
        midFile.slice(off, end).arrayBuffer(),
        ...others.map((f, i) => alive[i] ? f.slice(off, end).arrayBuffer() : null),
      ]);
      obs.forEach((ob, i) => { if(alive[i] && !buffersEqual(mb, ob)) alive[i] = false; });
    }
    return alive;
  }

  function comparePathParts(x, y){
    const a = x.parts, b = y.parts;
    const n = Math.min(a.length, b.length);
    for(let i = 0; i < n; i++){
      if(a[i] < b[i]) return -1;
      if(a[i] > b[i]) return 1;
    }
    return a.length - b.length;
  }

  // leftFiles / rightFiles (and midFiles for 3-way): Map<relativePath, fileEntry>. Merging is O(N + M (+ K)).
  // Status of a path: present on one side only -> that side; present everywhere with identical
  // content -> same; anything else (content differs, or missing from one of the other sides) -> different.
  async function compareDirectories(leftFiles, rightFiles, ctl, leftDirs, rightDirs, midFiles, midDirs, known){
    const three = !!midFiles;
    const need = three ? 3 : 2;
    const keys = new Set(leftFiles.keys());
    if(three) for(const k of midFiles.keys()) keys.add(k);
    for(const k of rightFiles.keys()) keys.add(k);
    const total = keys.size;
    const out = [];
    let done = 0;
    let lastYield = performance.now();
    // Files are compared several at a time: each comparison mostly waits on the browser's file reads,
    // so overlapping them is much faster than going one by one. Results are sorted at the end.
    const keyList = Array.from(keys);
    let nextKey = 0;
    const processPath = async (path) => {
      ctl.check();
      const l = leftFiles.get(path) || null;
      const m = three ? (midFiles.get(path) || null) : null;
      const r = rightFiles.get(path) || null;
      const present = [['left', l], ['mid', m], ['right', r]].filter(x => x[1]);
      let status, error = null, eq = null;
      if(present.length === 1) status = present[0][0];
      else if(present.some(x => x[1].error)){ status = 'error'; error = present.find(x => x[1].error)[1].error; }
      else if(!three){
        if(present.some(x => x[1].size !== present[0][1].size)) status = 'different';
        else{
          try{
            status = (await compareFileContents(present[0][1].file, present[1][1].file, ctl)) ? 'same' : 'different';
          }catch(err){
            if(err === CANCELLED) throw err;
            status = 'error';
            error = describeError(err);
          }
        }
      } else {
        // 3-way: compare each outer side with the middle one, so every column can be judged on its own.
        // The middle file is read once and checked against both outer files at the same time.
        eq = { left: null, right: null };
        try{
          const pending = [];
          for(const sd of ['left', 'right']){
            const o = sd === 'left' ? l : r;
            if(!(o && m)) continue;
            const was = known && known.get(path);                 // earlier result of this very pair, still valid
            if(was && was.eq && typeof was.eq[sd] === 'boolean') eq[sd] = was.eq[sd];
            else if(o.size !== m.size) eq[sd] = false;
            else pending.push({ sd, file: o.file });
          }
          if(pending.length){
            const res = await compareMiddleWithOthers(m.file, pending.map(x => x.file), ctl);
            pending.forEach((x, i) => { eq[x.sd] = res[i]; });
          }
          status = present.length === 3 && eq.left && eq.right ? 'same' : 'different';
        }catch(err){
          if(err === CANCELLED) throw err;
          status = 'error';
          error = describeError(err);
        }
      }
      out.push({ path, parts: path.split('/'), status, left: l, mid: m, right: r, error, eq });
      done++;
      if(performance.now() - lastYield > 50){
        lastYield = performance.now();
        ctl.progress(done, total, path);
        await yieldUi();
      }
    };
    const workers = [];
    for(let w = 0; w < Math.min(COMPARE_CONCURRENCY, keyList.length); w++){
      workers.push((async () => {
        while(nextKey < keyList.length) await processPath(keyList[nextKey++]);
      })());
    }
    await Promise.all(workers);
    // Empty directories are compared too. (A directory that has content on any side is judged through that content.)
    const dirMaps = [['left', leftDirs], ['mid', three ? midDirs : null], ['right', rightDirs]];
    const dirKeys = new Set();
    for(const [, mp] of dirMaps) if(mp) for(const k of mp.keys()) dirKeys.add(k);
    for(const path of dirKeys){
      ctl.check();
      const infos = dirMaps.map(([sd, mp]) => [sd, mp ? mp.get(path) : undefined]).filter(x => x[1]);
      if(!infos.some(x => x[1].empty) || !infos.every(x => x[1].empty)) continue;
      const entry = {
        path, parts: path.split('/'), kind: 'dir', error: null, eq: null, left: null, mid: null, right: null,
        status: infos.length === 1 ? infos[0][0] : infos.length === need ? 'same' : 'different',
      };
      for(const [sd] of infos) entry[sd] = { path, size: null };
      out.push(entry);
    }
    out.sort(comparePathParts);
    return out;
  }

  async function checkReadPermission(side){
    const h = dc[side].handle;
    if(!h || typeof h.queryPermission !== 'function') return true;
    try{
      let p = await h.queryPermission({ mode: 'read' });
      if(p === 'prompt' && typeof h.requestPermission === 'function') p = await h.requestPermission({ mode: 'read' });
      return p === 'granted';
    }catch(_){ return true; }
  }

  function cancelCompare(silent){
    dc.runId++;
    const was = dc.comparing;
    dc.comparing = false;
    setProgress('');
    updateCompareButton();
    if(was && !silent){ setMsg(''); setStatus('Comparison cancelled.'); }   // status bar only
  }

  async function runCompare(keepMsg){
    if(dc.comparing){ cancelCompare(); return; }
    const sides = activeSides();
    if(sides.some(sd => dc[sd].name && !dc[sd].files) || !sides.some(sd => dc[sd].files)){
      setMsg('Select a directory first.', true);
      return;
    }
    if(sides.some(sd => dc[sd].scanning)){ setMsg('Wait until scanning has finished.'); return; }
    for(const side of sides.filter(sd => dc[sd].files)){
      if(!await checkReadPermission(side)){
        setMsg(`${sideLabel(side)}: permission to read "${dc[side].name}" is no longer available. Select the directory again.`, true);
        return;
      }
    }
    const id = ++dc.runId;
    dc.comparing = true;
    if(!dc.keepView) clearResults();
    if(!keepMsg) setMsg('');      // an automatic run keeps the scan warnings already shown
    updateCompareButton();
    setProgress('Comparing...');
    const ctl = {
      check(){ if(dc.runId !== id) throw CANCELLED; },
      progress(done, total, path){ setProgress(`Comparing ${done.toLocaleString()} / ${total.toLocaleString()} files - ${path}`); },
    };
    try{
      const three = dc.mode === '3way';
      // Columns without a directory take part as empty ones, so a single directory is listed at once.
      const E = () => new Map();
      const results = await compareDirectories(dc.left.files || E(), dc.right.files || E(), ctl, dc.left.dirs || E(), dc.right.dirs || E(),
        three ? (dc.mid.files || E()) : null, three ? (dc.mid.dirs || E()) : null);
      ctl.check();
      renderDirectoryCompareResults(results, dc.keepView);     // after a one-column refresh the view stays as it was
      dc.keepView = false;
      const errs = results.filter(r => r.status === 'error').length;
      setProgress('');
      // Completion result goes to the status bar (right side) only, not the in-view message line.
      const emptyDirs = results.filter(r => r.kind === 'dir').length;
      const fileCount = results.length - emptyDirs;
      setStatus(`Compared ${fileCount.toLocaleString()} files`
        + (emptyDirs ? ` and ${emptyDirs.toLocaleString()} empty directories` : '')
        + (errs ? `; ${errs} could not be read.` : '.')
        + (dc.staleNote ? ' ' + dc.staleNote : ''), errs > 0);
      dc.staleNote = '';
    }catch(err){
      if(err === CANCELLED) return;
      setProgress('');
      setMsg(`Comparison failed - ${describeError(err)}.`, true);
    }finally{
      if(dc.runId === id){
        dc.comparing = false;
        dc.keepView = false;
        updateCompareButton();
        updateHint();
      }
    }
  }

  /* ---------- Rendering ---------- */
  function updateSideUI(side){
    const s = dc[side];
    let info = '';
    if(s.scanning) info = `Scanning... ${s.progress.toLocaleString()} files found`;
    else if(s.files) info = s.files.size === 0 ? (s.dirs && s.dirs.size ? 'No files' : 'Empty - no files') : `${s.files.size.toLocaleString()} files`
      + (s.errors.length ? `, ${s.errors.length} unreadable` : '');
    // Read-only path field: directory name, plus scan/file-count info when available.
    const nameEl = $('dv-name-' + side);
    nameEl.value = s.name || '';                      // the field shows the directory name only; the tooltip adds the details
    nameEl.title = s.name ? (info ? `${s.name}\n${info}` : s.name) : '';
    updateColumnState();
  }

  // Shows what each column is doing right now, centred in its own content area.
  function updateColumnState(){
    for(const sd of ['left', 'mid', 'right']){
      const el = $('dv-state-' + sd);
      if(!el) continue;
      const s = dc[sd];
      let t = '';
      if(s.name){
        if(s.scanning) t = `Scanning... ${s.progress.toLocaleString()} files found`;
        else if(dc.comparing) t = 'Comparing...';
        else if(!s.files) t = 'Scanning cancelled';
        else if(!(dc.results && dc.visible && dc.visible.length)) t = s.files.size === 0 && !(s.dirs && s.dirs.size) ? 'Empty - no files' : `${s.files.size.toLocaleString()} files`;
      }
      if(el.textContent !== t) el.textContent = t;
    }
  }

  const ICON_RECOMPARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.5M20 20v-4h-4"/></svg>';
  const ICON_CANCEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';

  // Swap buttons: enabled once one of the two directories they swap is chosen, and not while either is being scanned.
  // Refresh buttons (one per column): enabled once that column has a directory, not while it is being scanned.
  function updateRefreshButtons(){
    for(const sd of ['left', 'mid', 'right']) $('dv-refresh-' + sd).disabled = !dc[sd].name || dc[sd].scanning;
  }

  // Re-read only this column's directory from disk; the other columns keep their scan. When the scan
  // finishes the comparison starts again by itself (every selected directory is ready).
  // Shows the current result without the column that is being re-read (it counts as empty meanwhile).
  // Contents of file pairs that do not involve that column are not read again: their previous result is reused.
  async function previewWithout(side, prev){
    const id = ++dc.runId;
    const ctl = { check(){ if(dc.runId !== id) throw CANCELLED; }, progress(){} };
    try{
      const three = dc.mode === '3way';
      const files = sd => sd === side ? new Map() : (dc[sd].files || new Map());
      const dirs = sd => sd === side ? new Map() : (dc[sd].dirs || new Map());
      const known = new Map(prev.filter(r => r.kind !== 'dir').map(r => [r.path, r]));
      const results = await compareDirectories(files('left'), files('right'), ctl, dirs('left'), dirs('right'),
        three ? files('mid') : null, three ? dirs('mid') : null, known);
      ctl.check();
      renderDirectoryCompareResults(results, true);
    }catch(err){
      if(err !== CANCELLED) console.error(err);
    }
  }

  function refreshSide(side){
    const s = dc[side];
    if(!s.name || !s.producer || s.scanning) return;
    if(!s.rescannable){
      setMsg(`${sideLabel(side)} was selected through the folder-upload fallback, so the page cannot re-read it. Select it again to refresh.`, true);
      return;
    }
    runScan(side, s.name, s.handle, s.producer, true, true);
  }

  function updateSwapButtons(){
    for(const b of document.querySelectorAll('.dv-swap-btn')){
      const a = b.dataset.swapA, c = b.dataset.swapB;
      b.disabled = !(dc[a].name || dc[c].name) || dc[a].scanning || dc[c].scanning;
    }
  }

  // Exchange two selected directories (name, handle, scan data ...) and compare again with the new arrangement.
  function swapDirs(a, c){
    if(dc[a].scanning || dc[c].scanning) return;
    [dc[a], dc[c]] = [dc[c], dc[a]];
    cancelCompare(true);
    clearResults();
    updateSideUI(a); updateSideUI(c);
    updateCompareButton();
    updateHint();
    setStatus(`Swapped ${sideLabel(a)} \u2194 ${sideLabel(c)}`);
    maybeAutoCompare();
  }

  function updateCompareButton(){
    const btn = $('dv-compare');
    // The same button stops scanning or comparing at any time, and re-runs the comparison otherwise.
    updateSwapButtons();
    updateRefreshButtons();
    updateColumnState();
    const busy = dc.comparing || ['left', 'mid', 'right'].some(sd => dc[sd].scanning);
    const label = busy ? 'Cancel' : 'Re-compare';
    btn.innerHTML = busy ? ICON_CANCEL : ICON_RECOMPARE;
    btn.title = label;
    btn.setAttribute('aria-label', label);
    if(busy){ btn.disabled = false; return; }
    btn.disabled = !activeSides().some(sd => dc[sd].name);    // at least one directory chosen (scan finished or cancelled)
  }

  function updateHint(){
    updateColumnState();
    const el = $('dv-empty');
    const sides = activeSides();
    // The separator column(s) are drawn from top to bottom whatever the number of rows. The columns' hints show
    // only while there is nothing to list, and a column's hint goes away once it has a directory.
    const hasRows = !!(dc.results && dc.visible.length);
    for(const sd of ['left', 'mid', 'right']) $('dv-hint-' + sd).classList.toggle('off', hasRows || !!dc[sd].name);      // visibility only: keeps the grid columns in place
    if(dc.results && dc.visible.length){ el.textContent = ''; return; }
    const chosen = sides.filter(sd => dc[sd].name);
    let t = '';
    if(dc.results){ t = chosen.length > 1 ? (chosen.length === 3 ? 'All three directories are empty, so there is nothing to compare.' : 'Both directories are empty, so there is nothing to compare.') : 'The selected directory is empty, so there is nothing to list.'; }
    else if(dc.comparing){ t = 'Comparing...'; }
    else if(sides.some(sd => dc[sd].scanning)){ t = 'Scanning directories...'; }
    else if(!chosen.length){ t = ''; }                                // the columns' own hints say what to do
    else if(chosen.some(sd => !dc[sd].files)){ t = 'Scanning was cancelled. Click Re-compare to scan and compare the selected directories.'; }
    else{
      t = 'Ready: ' + chosen.map(sd => `${dc[sd].files.size.toLocaleString()} files on the ${sd}`).join(', ') + '. Click Re-compare.';
    }
    el.textContent = t;
  }

  function clearResults(){
    dc.results = null;
    dc.keepView = false;
    dc.tree = null;
    dc.visible = [];
    dc.diffNodes = [];
    dc.nodeByKey = null;
    for(const id of ['dv-gutter-l-track', 'dv-gutter-r-track']) $(id).innerHTML = '';
    gutterKey = '';
    dc.selectedKey = null;
    $('dv-rows').style.height = '0px';
    $('dv-rows').innerHTML = '';
    vFirst = vLast = -1;
    syncScrollbarWidth();
    updateNavButtons();
    updateHint();
  }

  /* ---------- Merged folder tree ----------
     Both sides are merged into one tree keyed by path segment, so a row in the
     left pane and the row beside it in the right pane always describe the same
     relative path. Each pane only draws the entries that exist on its own side;
     the other side shows a hatched placeholder. Folders are listed first, then
     files, both in plain code-unit order (same case-sensitive rule as paths). */
  function buildTree(results, leftDirs, rightDirs, midDirs){
    const root = { kind: 'dir', depth: -1, children: new Map() };
    // Directory nodes know whether the directory itself exists on each side (selfL/selfR),
    // which is what makes empty directories show up.
    const dirNode = (cur, parts, i) => {
      const key = 'd:' + parts[i];
      let next = cur.children.get(key);
      if(!next){
        const path = parts.slice(0, i + 1).join('/');
        next = { kind: 'dir', name: parts[i], path, depth: i, children: new Map(), expanded: false,
                 selfL: !!(leftDirs && leftDirs.has(path)), selfM: !!(midDirs && midDirs.has(path)),
                 selfR: !!(rightDirs && rightDirs.has(path)) };
        cur.children.set(key, next);
      }
      return next;
    };
    for(const r of results){
      let cur = root;
      const parts = r.parts;
      const dirDepth = r.kind === 'dir' ? parts.length : parts.length - 1;   // empty directories are nodes themselves
      for(let i = 0; i < dirDepth; i++) cur = dirNode(cur, parts, i);
      if(r.kind === 'dir'){ cur.entry = r; continue; }      // an empty directory keeps its own comparison entry
      const name = parts[parts.length - 1];
      cur.children.set('f:' + name, {
        kind: 'file', name, path: r.path, depth: parts.length - 1, result: r,
        status: r.status, hasL: !!r.left, hasM: !!r.mid, hasR: !!r.right,
      });
    }
    finalizeNode(root);
    return root;
  }

  // How an outer side relates to the middle for one entry: 'same' | 'diff' | 'none' (absent from both).
  function relOf(entry, side){
    if(entry.status === 'error') return 'diff';
    const o = entry[side], m = entry.mid;
    if(!o && !m) return 'none';
    if(!o || !m) return 'diff';
    if(entry.kind === 'dir') return 'same';
    return entry.eq && entry.eq[side] ? 'same' : 'diff';
  }

  function finalizeNode(node){
    node.list = Array.from(node.children.values()).sort((a, b) => {
      if(a.kind !== b.kind) return a.kind === 'dir' ? -1 : 1;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
    const KEYS = ['L', 'M', 'R'];
    node.diff = 0;
    node.dL = node.dR = 0;       // entries below that differ from the middle column (left / right side)
    if(node.entry){ node.dL += relOf(node.entry, 'left') === 'diff' ? 1 : 0; node.dR += relOf(node.entry, 'right') === 'diff' ? 1 : 0; }
    for(const k of KEYS){ node['has' + k] = !!node['self' + k]; node['count' + k] = 0; }
    for(const c of node.list){
      if(c.kind === 'dir'){
        finalizeNode(c);
        for(const k of KEYS) node['count' + k] += c['count' + k];
        node.diff += c.diff;
        node.dL += c.dL; node.dR += c.dR;
        if(c.status !== 'same') node.diff++;       // a one-sided (e.g. empty) folder is a difference too
      } else {
        for(const k of KEYS) if(c['has' + k]) node['count' + k]++;
        if(c.status !== 'same') node.diff++;
        if(relOf(c.result, 'left') === 'diff') node.dL++;
        if(relOf(c.result, 'right') === 'diff') node.dR++;
      }
      for(const k of KEYS) node['has' + k] = node['has' + k] || c['has' + k];
    }
    // Per-side "has an earlier / later sibling on this side" flags drive the dotted guide lines.
    for(const k of KEYS){
      let pre = false;
      for(const c of node.list){ c['earlier' + k] = pre; pre = pre || c['has' + k]; }
      let post = false;
      for(let i = node.list.length - 1; i >= 0; i--){
        const c = node.list[i];
        c['later' + k] = post; post = post || c['has' + k];
      }
    }
    for(const c of node.list) c.parent = node;
    if(node.depth >= 0){
      const present = KEYS.filter(k => node['has' + k]);
      node.status = present.length === 1 ? KS[present[0]] : node.diff > 0 ? 'different' : 'same';
      // Open only folders that exist on several sides and contain differences;
      // one-sided folders stay collapsed until the user opens them.
      node.expanded = node.status === 'different';
    }
  }

  function rebuildVisible(){
    const out = [];
    (function walk(n){
      for(const c of n.list){
        out.push(c);
        if(c.kind === 'dir' && c.expanded) walk(c);
      }
    })(dc.tree);
    dc.visible = out;
    dc.visVersion = (dc.visVersion || 0) + 1;
    $('dv-rows').style.height = (out.length * ROW_H) + 'px';
    vFirst = vLast = -1;
  }

  function toggleDir(node, expand){
    node.expanded = expand;
    rebuildVisible();
    paintRows(true);
    requestAnimationFrame(syncScrollbarWidth);      // scrollbar may have appeared / disappeared
  }

  function renderDirectoryCompareResults(results, keepView){
    // Keep which folders are open and where the list is scrolled when the same view is only being refreshed.
    const open = new Map();
    const scroll = $('dv-list').scrollTop;
    if(keepView && dc.tree) (function walk(n){ for(const c of n.list) if(c.kind === 'dir'){ open.set(c.path, c.expanded); walk(c); } })(dc.tree);
    dc.results = results;
    dc.tree = buildTree(results, dc.left.dirs, dc.right.dirs, dc.mid.dirs);
    if(keepView) (function walk(n){ for(const c of n.list) if(c.kind === 'dir'){ if(open.has(c.path)) c.expanded = open.get(c.path); walk(c); } })(dc.tree);
    indexTree();
    rebuildVisible();
    $('dv-list').scrollTop = keepView ? scroll : 0;
    if(!keepView) dc.keepView = false;
    paintRows(true);
    updateNavButtons();
    requestAnimationFrame(syncScrollbarWidth);
    updateHint();
  }

  const ICON_DIR = '<svg class="dv-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>';
  const ICON_FILE = '<svg class="dv-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>';

  const INDENT = 22;                              // px per tree level
  const chevCentre = d => 8 + d * INDENT + 9;     // x of the chevron centre at depth d (= parent icon centre)

  // Dotted guide lines for one side. Column j (x = chevCentre(j)) is the line that links
  // the children of the depth j-1 ancestor; it continues through this row while that
  // ancestor still has later siblings on the same side.
  function guideHtml(node, side){
    const k = SK[side];
    const has = n => n['has' + k];
    const later = n => n['later' + k];
    const earlier = n => n['earlier' + k];
    const d = node.depth;
    const vl = (x, pos) => `<i class="dv-vl" style="left:${x}px;${pos}"></i>`;
    const chain = [];
    for(let a = node; a && a.depth >= 0; a = a.parent) chain[a.depth] = a;
    const topRoot = { hasL: true, hasM: true, hasR: true };      // stands in for the (invisible) root of the tree
    let out = '';
    for(let j = 0; j <= d; j++){
      const a = chain[j];
      const par = j === 0 ? topRoot : chain[j - 1];
      if(!par || !has(par)) continue;
      const x = chevCentre(j);
      // Outermost level: the line starts at the first entry, not above it.
      const fromTop = j !== 0 || earlier(a);
      if(j < d){
        if(later(a)) out += vl(x, 'top:0;bottom:0');
      } else if(has(node)){
        const isDir = node.kind === 'dir' && node.list.length > 0;   // empty folders have no chevron, so no gap
        // Folders leave a gap around the chevron glyph that sits on the line.
        if(isDir){
          if(fromTop) out += vl(x, 'top:0;height:calc(50% - 8px)');
          if(later(node)) out += vl(x, 'top:calc(50% + 8px);bottom:0');
        } else if(fromTop){
          out += vl(x, later(node) ? 'top:0;bottom:0' : 'top:0;height:50%');
        } else if(later(node)){
          out += vl(x, 'top:50%;bottom:0');
        }
        out += isDir
          ? `<i class="dv-hl" style="left:${x + 9}px;width:6px"></i>`
          : `<i class="dv-hl" style="left:${x}px;width:15px"></i>`;
      } else if(later(node) && fromTop){
        out += vl(x, 'top:0;bottom:0');
      }
    }
    // Expanded folder: line running down from its icon to its first child.
    if(node.kind === 'dir' && node.expanded && has(node) && node.list.some(c => has(c))){
      out += vl(chevCentre(d + 1), 'top:calc(50% + 8px);bottom:0');
    }
    return out;
  }

  // Colour of one cell, judged like Text Compare: a base column against the modified column(s).
  //   2-way: Left = base, Right = modified.   3-way: Middle = base, Left and Right = modified.
  //   'diff' modified (yellow) | 'add' exists only on a modified side (green) | 'del' removed from a modified side (blue)
  //   'hatch-add' / 'hatch-del' / 'hatch': no file here (hatched), tinted like the change it stands for.
  function cellKind(node, side){
    const three = dc.mode === '3way';
    const base = three ? 'mid' : 'left';
    const mods = three ? ['left', 'right'] : ['right'];
    const has = sd => !!node['has' + SK[sd]];
    if(has(side) && node.kind === 'file' && node.status === 'error') return 'err';
    // Does a modified side differ from the base (both present)?
    const differs = sd => node.kind === 'dir'
      ? (three ? (sd === 'left' ? node.dL : node.dR) > 0 : node.diff > 0)
      : (three ? !(node.result.eq && node.result.eq[sd]) : node.result.status !== 'same');
    if(side !== base){
      if(has(side)) return has(base) ? (differs(side) ? 'diff' : null) : 'add';
      return has(base) ? 'hatch-del' : 'hatch';
    }
    if(!has(base)) return 'hatch-add';
    const outers = mods.filter(has);
    if(!outers.length) return 'del';                       // only the base has it: removed everywhere
    if(outers.some(differs)) return 'diff';
    if(mods.some(sd => !has(sd))) return 'del';            // removed from at least one modified side
    return null;
  }
  // 3-way, middle column: it is the base for both outer columns, so its colour is judged against the left
  // column on its left half and against the right column on its right half, blending in between
  // (e.g. blue "deleted vs. left" fading into yellow "modified vs. right").
  function midBackground(node){
    const rel = sd => {
      if(!node['has' + SK[sd]]) return 'del';                   // the outer column lacks it: deleted there
      const differs = node.kind === 'dir'
        ? (sd === 'left' ? node.dL : node.dR) > 0
        : !(node.result.eq && node.result.eq[sd]);
      return differs ? 'diff' : null;
    };
    const col = k => k === 'diff' ? 'var(--diff-mod-line)' : k === 'del' ? 'var(--diff-del-line)' : 'transparent';
    const l = rel('left'), r = rel('right');
    if(l === r) return l ? col(l) : null;                       // same colour on both sides: solid
    return `linear-gradient(to right, ${col(l)}, ${col(r)})`;
  }
  // 3-way, middle column without the file: it is the base for both outer columns, so the hatching is tinted
  // against the left column on its left half and the right column on its right half (green where that
  // column has the file = added, plain where it has none either). Stripes are painted with the panel colour
  // over a left-to-right colour gradient, which is how the gradient survives the hatching.
  function midHatchBackground(node){
    const col = sd => node['has' + SK[sd]] ? 'rgba(76,175,80,0.34)' : 'var(--empty-stripe)';
    return 'repeating-linear-gradient(45deg, transparent 0, transparent 4px, var(--panel) 4px, var(--panel) 8px), '
      + `linear-gradient(to right, ${col('left')}, ${col('right')})`;
  }
  const CELL_CLS = { diff: ' c-diff', add: ' c-add', del: ' c-del', err: ' c-err' };
  const HATCH_CLS = { 'hatch-add': ' none-add', 'hatch-del': ' none-del' };

  function cellHtml(node, side){
    const has = node['has' + SK[side]];
    const guides = guideHtml(node, side);
    if(!has){
      if(dc.mode === '3way' && side === 'mid') return `<div class="dv-cell none" style="background:${midHatchBackground(node)}">${guides}</div>`;
      return `<div class="dv-cell none${HATCH_CLS[cellKind(node, side)] || ''}">${guides}</div>`;
    }
    const pad = 8 + node.depth * INDENT;
    let inner;
    if(node.kind === 'dir'){
      const n = node['count' + SK[side]];
      inner = `<span class="dv-chev" aria-hidden="true">${node.list.length ? (node.expanded ? '\u25BE' : '\u25B8') : ''}</span>${ICON_DIR}`
        + `<span class="dv-path">${esc(node.name)}</span><span class="dv-size">${n.toLocaleString()} file${n === 1 ? '' : 's'}</span>`;
    } else {
      const e = node.result[side];
      inner = `<span class="dv-chev"></span>${ICON_FILE}`
        + `<span class="dv-path">${esc(node.name)}</span><span class="dv-size">${formatSize(e ? e.size : null)}</span>`;
    }
    let tint = CELL_CLS[cellKind(node, side)] || '';
    let bg = '';
    if(dc.mode === '3way' && side === 'mid' && tint !== ' c-err'){
      tint = '';
      const g = midBackground(node);
      if(g) bg = `background:${g};`;
    }
    const tip = `${dc[side].name}/${node.path}`;       // full path: selected directory + relative path
    return `<div class="dv-cell${tint}" style="${bg}padding-left:${pad}px" title="${esc(tip)}">${guides}${inner}</div>`;
  }

  // Virtualised list: only the rows near the viewport are in the DOM, so
  // large trees stay responsive.
  let vFirst = -1, vLast = -1;
  // The list has a vertical scrollbar the path row above does not; pad the path row by
  // the same amount so both are centred identically and their divider lines align.
  /* ---------- Overview gutters (left and right edge), like Text Compare's ----------
     Each gutter squeezes the whole list into its height and marks where things differ, using the same
     colours: yellow = modified, green = added, blue = deleted. A viewport box shows what the list is
     currently scrolling over; clicking a marker selects that row, clicking elsewhere scrolls there.
     2-way: both gutters show Right relative to Left (the base). 3-way: the left gutter shows Left
     relative to Middle, the right gutter shows Right relative to Middle. An expanded folder is skipped
     (its rows carry the markers); a collapsed folder stands for everything inside it. */
  let gutterKey = '';
  function gutterType(node, which){
    if(node.kind === 'dir' && node.list.length && node.expanded) return null;
    const three = dc.mode === '3way';
    const a = three ? (which === 'left' ? 'L' : 'R') : 'R';      // modified side
    const b = three ? 'M' : 'L';                                 // base side
    const hasA = !!node['has' + a], hasB = !!node['has' + b];
    if(hasA && hasB){
      const differs = node.kind === 'dir'
        ? (three ? (a === 'L' ? node.dL : node.dR) : node.diff) > 0
        : (three ? !(node.result.eq && node.result.eq[KS[a]]) : node.result.status !== 'same');
      return differs ? 'mod' : null;
    }
    if(hasA) return 'add';
    if(hasB) return 'del';
    return null;
  }
  function renderDirGutters(force){
    if(dc.view !== 'dir' || !dc.results) return;
    const n = dc.visible.length;
    const H = $('dv-gutter-l').offsetHeight;
    const key = `${dc.visVersion}|${dc.mode}|${H}|${n}`;
    if(!force && key === gutterKey){ updateDirGutterViewport(); return; }
    gutterKey = key;
    for(const [which, trackId] of [['left', 'dv-gutter-l-track'], ['right', 'dv-gutter-r-track']]){
      let html = '', runType = null, runStart = 0;
      const flush = end => {
        if(!runType) return;
        const top = runStart / n * H, h = Math.max(2, (end - runStart) / n * H);
        html += `<div class="marker ${runType}" style="top:${top.toFixed(1)}px;height:${h.toFixed(1)}px" data-row="${runStart}" title="Jump to this diff"></div>`;
      };
      if(n && H){
        for(let i = 0; i < n; i++){
          const t = gutterType(dc.visible[i], which);
          if(t !== runType){ flush(i); runType = t; runStart = i; }
        }
        flush(n);
      }
      $(trackId).innerHTML = html + `<div class="viewport-indicator" id="${trackId}-vp"></div>`;
    }
    updateDirGutterViewport();
  }
  function updateDirGutterViewport(){
    const list = $('dv-list');
    const totalH = Math.max(dc.visible.length * ROW_H, 1);
    for(const [gid, trackId] of [['dv-gutter-l', 'dv-gutter-l-track'], ['dv-gutter-r', 'dv-gutter-r-track']]){
      const vp = $(trackId + '-vp');
      if(!vp) continue;
      const H = $(gid).offsetHeight || 0;
      const top = list.scrollTop / totalH * H;
      const height = Math.min(Math.max(4, list.clientHeight / totalH * H), H);
      vp.style.top = top.toFixed(1) + 'px';
      vp.style.height = height.toFixed(1) + 'px';
    }
  }
  for(const gid of ['dv-gutter-l', 'dv-gutter-r']){
    $(gid).addEventListener('click', (e) => {
      const n = dc.visible.length;
      if(!dc.results || !n) return;
      const marker = e.target.closest ? e.target.closest('.marker') : null;
      if(marker){ selectIndex(Number(marker.dataset.row)); $('dv-list').focus({ preventScroll: true }); return; }
      const g = $(gid), list = $('dv-list');
      const ratio = Math.max(0, Math.min(1, (e.clientY - g.getBoundingClientRect().top) / Math.max(1, g.offsetHeight)));
      list.scrollTop = ratio * n * ROW_H - list.clientHeight / 2;            // centre the clicked position
    });
  }

  /* ---------- Resizable columns (drag the handle on a separator, like Text Compare) ---------- */
  const DV_SEP = 64, DV_MIN_W = 80;                   // separator width, minimum column width (px)
  function dvWidths(){                                // current pixel width of every column
    const n = dc.mode === '3way' ? 3 : 2;
    const total = $('dv-rows').offsetWidth || $('dv-list').clientWidth;
    const free = Math.max(0, total - DV_SEP * (n - 1));
    const f = dc.fr.slice(0, n);
    const sum = f.reduce((a, b) => a + b, 0) || 1;
    return f.map(v => free * v / sum);
  }
  function positionDirHandles(){
    const ws = dvWidths(), sl = $('dv-list').scrollLeft;
    $('dv-handle-1').style.left = (ws[0] + DV_SEP / 2 - 3.5 - sl) + 'px';

  // Publishes the weights as CSS variables: the list rows use them as grid tracks and the path row as
  // flex-grow, so both lay out identically and the separators stay aligned.
  function applyDirWidths(){
    const n = dc.mode === '3way' ? 3 : 2;
    const f = dc.fr.slice(0, n);
    const root = $('dir-view');
    root.style.setProperty('--dv-wl', f[0]);
    root.style.setProperty('--dv-wr', f[n - 1]);
    if(n === 3) root.style.setProperty('--dv-wm', f[1]);
    const t = f.map(v => `minmax(0,${v}fr)`);
    root.style.setProperty('--dv-grid', n === 3 ? `${t[0]} ${DV_SEP}px ${t[1]} ${DV_SEP}px ${t[2]}` : `${t[0]} ${DV_SEP}px ${t[1]}`);

  }
  function resetDirWidths(){ dc.fr = [1, 1, 1]; applyDirWidths(); }
  function setupDirHandle(el, a){                     // a = index of the column to the left of this handle
    el.addEventListener('mousedown', (e) => {
      if(e.button !== 0) return;
      e.preventDefault();
      const ws = dvWidths();
      ws.forEach((w, i) => { dc.fr[i] = w; });        // put every column on the same pixel scale before changing two of them
      const b = a + 1, startX = e.clientX, startA = ws[a], total = ws[a] + ws[b];
      el.classList.add('dragging');
      document.body.classList.add('resizing-panes');

        const newA = Math.min(Math.max(startA + ev.clientX - startX, DV_MIN_W), Math.max(DV_MIN_W, total - DV_MIN_W));
        dc.fr[a] = newA;
        dc.fr[b] = total - newA;
        applyDirWidths();

        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);

  let lastSbw = null;

  }
  // The scrollbar can appear or disappear for reasons other than a repaint (expanding / collapsing, the
  // window or the status bar changing size, ...). Watch the list itself so the path row always follows it.

  /* ---------- Copy / delete arrows between two neighbouring columns (like Text Compare's merge buttons) ----------
     A row gets the arrows when it differs between the two columns next to the separator: added, modified or
     deleted (a folder counts when anything inside it differs). "->" makes the right column match the left one
     for that entry, "<-" the other way round: copy / overwrite when the source has it, delete when it does not. */
  function pairDiffers(node, a, b){
    const ha = !!node['has' + SK[a]], hb = !!node['has' + SK[b]];
    if(ha !== hb) return true;
    if(!ha) return false;
    const three = dc.mode === '3way';
    const outer = a === 'mid' ? b : a;                       // 3-way: the pair is always (outer, mid)
    if(node.kind === 'dir') return three ? (outer === 'left' ? node.dL : node.dR) > 0 : node.diff > 0;
    if(node.status === 'error') return false;
    return three ? !(node.result.eq && node.result.eq[outer]) : node.result.status !== 'same';
  }
  const ICON_ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/></svg>';
  const ICON_ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>';
  function sepHtml(node, a, b){
    if(!pairDiffers(node, a, b)) return '<div class="dv-mid"></div>';
    const has = sd => !!node['has' + SK[sd]];
    const btn = (src, dst, cls, icon) => {
      const what = node.kind === 'dir' ? 'folder' : 'file';
      const title = has(src) ? `Copy ${what} to ${sideLabel(dst)}` : `Delete ${what} from ${sideLabel(dst)} (not in ${sideLabel(src)})`;
      return `<button type="button" class="dv-act ${cls}" data-src="${src}" data-dst="${dst}" title="${esc(title)}" aria-label="${esc(title)}">${icon}</button>`;
    };

  async function dirAt(root, parts, create){
    let h = root;
    for(const p of parts) h = await h.getDirectoryHandle(p, { create });
    return h;
  }
  // Works out what making `dst` match `src` means for one row (and everything inside a folder).
  function planSync(node, src, dst){
    const ops = [];
    const has = (n, sd) => !!n['has' + SK[sd]];
    const walk = n => {
      if(n.kind === 'file'){
        const s = has(n, src), d = has(n, dst);
        if(s && !d) ops.push({ type: 'copy', node: n, add: true });
        else if(!s && d) ops.push({ type: 'delete', node: n });
        else if(s && d && fileDiffers(n, src, dst)) ops.push({ type: 'copy', node: n, add: false });
        return;
      }
      const s = has(n, src), d = has(n, dst);
      if(!s && d){ ops.push({ type: 'rmdir', node: n }); return; }          // the whole folder goes
      if(s && !d && !n.list.length) ops.push({ type: 'mkdir', node: n });
      for(const c of n.list) walk(c);
    };
    walk(node);
    return ops;
  }
  // Content of a file that exists in both columns: do the two differ?
  function fileDiffers(n, a, b){
    if(n.status === 'error') return false;
    if(dc.mode !== '3way') return n.result.status !== 'same';
    const outer = a === 'mid' ? b : a;
    return !(n.result.eq && n.result.eq[outer]);
  }
  async function applyOp(op, src, dst){
    const root = dc[dst].handle, parts = op.node.path.split('/');
    if(op.type === 'copy'){
      const e = op.node.result[src];
      const blob = e.handle ? await e.handle.getFile() : e.file;
      const dir = await dirAt(root, parts.slice(0, -1), true);
      const fh = await dir.getFileHandle(parts[parts.length - 1], { create: true });
      const w = await fh.createWritable();
      try{ await w.write(blob); await w.close(); }
      catch(err){ try{ await w.abort(); }catch(_){} throw err; }
    } else if(op.type === 'mkdir'){
      await dirAt(root, parts, true);
    } else {                                                   // 'delete' | 'rmdir'
      let parent;
      try{ parent = await dirAt(root, parts.slice(0, -1), false); }
      catch(err){ if(err && err.name === 'NotFoundError') return; throw err; }
      try{ await parent.removeEntry(parts[parts.length - 1], { recursive: op.type === 'rmdir' }); }
      catch(err){ if(!(err && err.name === 'NotFoundError')) throw err; }
    }
  }
  async function syncRow(node, src, dst){
    if(dc.comparing || ['left', 'mid', 'right'].some(sd => dc[sd].scanning)){ setMsg('Wait until scanning and comparing have finished.'); return; }
    const h = dc[dst].handle;
    if(!h || typeof h.getFileHandle !== 'function'){
      setMsg(`${sideLabel(dst)} was selected through the folder-upload fallback, so the page cannot write to it. Select it again with the directory picker.`, true);
      return;
    }
    if(await ensurePermission(h, 'readwrite') === 'denied'){
      setMsg(`${sideLabel(dst)}: permission to modify "${dc[dst].name}" was denied.`, true);
      return;
    }
    const ops = planSync(node, src, dst);
    if(!ops.length){ setMsg('Nothing to change.'); return; }
    const nCopy = ops.filter(o => o.type === 'copy').length;
    const nNew = ops.filter(o => o.type === 'mkdir').length;
    const nDel = ops.filter(o => o.type === 'delete' || o.type === 'rmdir').length;
    const overwrites = ops.filter(o => o.type === 'copy' && !o.add).length;
    // Deleting, or acting on a whole folder, is confirmed first; a single file copy / overwrite is not.
    if(nDel || node.kind === 'dir'){
      const parts = [];
      if(nCopy) parts.push(`copy ${nCopy} file${nCopy === 1 ? '' : 's'}` + (overwrites ? ` (${overwrites} overwritten)` : ''));
      if(nNew) parts.push(`create ${nNew} folder${nNew === 1 ? '' : 's'}`);
      if(nDel) parts.push(`delete ${nDel} item${nDel === 1 ? '' : 's'}`);
      const r = await askChoice(
        `Make "${node.path}" in ${sideLabel(dst)} match ${sideLabel(src)}?\nThis will ${parts.join(', ')} in "${dc[dst].name}" on disk.`,
        [{ label: nDel ? 'Apply (deletes files)' : 'Apply', value: 'go', danger: !!nDel }, { label: 'Cancel', value: 'cancel', focus: true }],
        'cancel');
      if(r !== 'go') return;
    }
    let done = 0, failed = null;
    for(const op of ops){
      try{ await applyOp(op, src, dst); done++; }
      catch(err){ failed = `${op.node.path}: ${describeError(err)}`; break; }
    }
    const sum = `${sideLabel(dst)}: ${done} of ${ops.length} change${ops.length === 1 ? '' : 's'} applied`
      + (failed ? `; stopped at ${failed}.` : '.');
    dc.staleNote = sum;
    dc.keepStale = true;                 // runScan would otherwise reset the note
    try{ refreshSide(dst); }finally{ dc.keepStale = false; }    // re-read what changed; the comparison follows by itself

  }

  function paintRows(force){
    if(dc.view !== 'dir') return;
    syncScrollbarWidth();
    if(!dc.results) return;
    renderDirGutters(false);
    const list = $('dv-list');
    const n = dc.visible.length;
    const h = list.clientHeight || 600;
    const first = Math.max(0, Math.floor((list.scrollTop - ROW_H) / ROW_H) - 6);
    const last = Math.min(n - 1, Math.ceil((list.scrollTop + h) / ROW_H) + 6);
    if(!force && first === vFirst && last === vLast) return;
    vFirst = first; vLast = last;
    const parts = [];
    for(let i = first; i <= last; i++){
      const node = dc.visible[i];
      const st = STATUS[node.status];
      const isDir = node.kind === 'dir';
      const clickable = isDir ? node.list.length > 0 : node.status !== 'error';
      const cls = `dv-row s-cell ${isDir ? 'dir' : 'file'}${clickable ? ' clickable' : ''}`
        + (keyOf(node) === dc.selectedKey ? ' selected' : '');

        `<div class="${cls}" data-i="${i}" style="top:${i * ROW_H}px"`
        + (isDir && node.list.length ? ` role="button" aria-expanded="${node.expanded}"` : (clickable ? ' role="button"' : ''))
        + '>'
        + cellHtml(node, 'left')
        + sepHtml(node, 'left', dc.mode === '3way' ? 'mid' : 'right')
        + (dc.mode === '3way' ? cellHtml(node, 'mid') + sepHtml(node, 'mid', 'right') : '')

  let paintQueued = false;
  $('dv-list').addEventListener('scroll', () => {
    if(paintQueued) return;
    paintQueued = true;
    positionDirHandles();
    requestAnimationFrame(() => { paintQueued = false; paintRows(false); updateDirGutterViewport(); });
  });
  window.addEventListener('resize', () => paintRows(true));

  function nodeFromEvent(e){
    const el = e.target.closest ? e.target.closest('.dv-row') : null;

  const keyOf = n => n.kind + ':' + n.path;

      if(n) syncRow(n, act.dataset.src, act.dataset.dst);
      return;
    }
    const node = nodeFromEvent(e);
    if(!node) return;
    dc.selectedKey = keyOf(node);
    if(node.kind === 'dir'){ toggleDir(node, node.list.length ? !node.expanded : node.expanded); updateNavButtons(); return; }
    // Files: a single click only selects; opening the text comparison needs a double-click.
    $('dv-rows').querySelectorAll('.dv-row.selected').forEach(el => el.classList.remove('selected'));

  /* ---------- First / Previous / Next / Last difference (same buttons as Text Compare) ----------
     A "difference" is a file or empty folder that is not 'same'; folders themselves are not stops
     (they only summarise what is below). Navigation is relative to the selected row and, like
     Text Compare, does not wrap around: First/Previous are disabled when nothing differs before the
     selection, Next/Last when nothing differs after it. Folders hiding the target are expanded. */
  function indexTree(){
    let ord = 0;
    const diffs = [], byKey = new Map();
    (function walk(n){
      for(const c of n.list){
        c.ord = ord++;
        byKey.set(keyOf(c), c);
        if(c.kind === 'dir'){
          if(!c.list.length && c.status !== 'same') diffs.push(c);
          walk(c);
        } else if(c.status !== 'same') diffs.push(c);
      }
    })(dc.tree);
    dc.diffNodes = diffs;
    dc.nodeByKey = byKey;
  }
  function currentOrd(){
    const n = dc.selectedKey && dc.nodeByKey ? dc.nodeByKey.get(dc.selectedKey) : null;
    return n ? n.ord : -1;                                  // -1: nothing selected yet
  }
  function diffIndexAfter(ord){                             // index of the first difference with order > ord
    const a = dc.diffNodes;
    let lo = 0, hi = a.length;
    while(lo < hi){ const mid = (lo + hi) >> 1; if(a[mid].ord > ord) hi = mid; else lo = mid + 1; }
    return lo;
  }
  function updateNavButtons(){
    const cur = currentOrd();
    const total = dc.results ? dc.diffNodes.length : 0;
    const hasNext = total > 0 && diffIndexAfter(cur) < total;
    const hasPrev = total > 0 && diffIndexAfter(cur - 1) > 0;
    $('dv-nav-first').disabled = !hasPrev;
    $('dv-nav-prev').disabled = !hasPrev;
    $('dv-nav-next').disabled = !hasNext;
    $('dv-nav-last').disabled = !hasNext;
  }
  function goToDiffNode(target){
    const a = dc.diffNodes;
    if(!dc.results || !a.length) return;
    const cur = currentOrd();
    let node;
    if(target === 'first') node = a[0];
    else if(target === 'last') node = a[a.length - 1];
    else if(target === 'next') node = a[Math.min(diffIndexAfter(cur), a.length - 1)];
    else node = a[Math.max(diffIndexAfter(cur - 1) - 1, 0)];
    let opened = false;
    for(let p = node.parent; p && p.depth >= 0; p = p.parent) if(!p.expanded){ p.expanded = true; opened = true; }
    if(opened) rebuildVisible();

  }

  // Keyboard: Up/Down (also PageUp/PageDown/Home/End) move the selected row; Left/Right collapse/expand
  // folders; Enter/Space toggles a folder or opens the file in Text Compare.
  function selectedIndex(){
    return dc.selectedKey ? dc.visible.findIndex(n => keyOf(n) === dc.selectedKey) : -1;
  }
  function selectIndex(i){
    if(!dc.visible.length) return;
    i = Math.max(0, Math.min(dc.visible.length - 1, i));
    dc.selectedKey = keyOf(dc.visible[i]);
    const list = $('dv-list');
    const top = i * ROW_H, h = list.clientHeight;
    if(top < list.scrollTop) list.scrollTop = top;                                  // keep the row in view

  $('dv-list').addEventListener('keydown', (e) => {
    if(!dc.results || !dc.visible.length || e.altKey || e.ctrlKey || e.metaKey) return;
    const cur = selectedIndex();
    const node = cur >= 0 ? dc.visible[cur] : null;
    const page = Math.max(1, Math.floor(($('dv-list').clientHeight || ROW_H * 10) / ROW_H) - 1);
    switch(e.key){
      case 'ArrowDown': e.preventDefault(); selectIndex(cur < 0 ? 0 : cur + 1); break;
      case 'ArrowUp':   e.preventDefault(); selectIndex(cur < 0 ? 0 : cur - 1); break;
      case 'PageDown':  e.preventDefault(); selectIndex(cur < 0 ? 0 : cur + page); break;
      case 'PageUp':    e.preventDefault(); selectIndex(cur < 0 ? 0 : cur - page); break;
      case 'Home':      e.preventDefault(); selectIndex(0); break;
      case 'End':       e.preventDefault(); selectIndex(dc.visible.length - 1); break;

        }
        break;
      case 'Enter':
      case ' ':

          e.preventDefault();
          if(node.kind === 'dir'){ if(node.list.length) toggleDir(node, !node.expanded); }
