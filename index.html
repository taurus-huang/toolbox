<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolbox</title>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e1e4e8;
            --primary-color: #4a90e2;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 20px rgba(74, 144, 226, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2.5rem auto;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .header-title-container {
            display: block;
        }

        header h1 {
            font-size: 2rem;
            color: #2c3e50;
            display: inline-block;
            vertical-align: middle;
        }

        /* Dynamic Tool Counter Badge */
        .tool-counter {
            display: inline-block;
            vertical-align: middle;
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            margin-left: 1rem;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Tools Grid Layout */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tool Card Base Style */
        .tool-card {
            background-color: var(--card-bg);
            /* Preset a 2px standard border width to prevent layout shifting on hover transitions */
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        /* Hover Effect: Changes border color to the accent hue and applies container lifting */
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
        }

        /* Preview Iframe Container */
        .preview-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #f8f9fa;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* Scale down the iframe content to serve cleanly as a thumbnail preview */
        .preview-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 300%;
            height: 300%;
            border: none;
            transform: scale(0.333);
            transform-origin: top left;
            pointer-events: none; /* Prevents internal iframe content from hijacking clicks on the card block */
        }

        /* Card Typography and Content Layout */
        .tool-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .tool-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .tool-version {
            font-size: 0.75rem;
            background-color: #e8f0fe;
            color: var(--primary-color);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Bulleted Description List Style */
        .tool-desc-list {
            font-size: 0.9rem;
            color: var(--text-secondary);
            list-style-type: disc; /* Ensures a standard bullet point on the left */
            padding-left: 1.2rem; /* Indents the text to align cleanly after the bullet */
            flex-grow: 1;
        }

        .tool-desc-list li {
            margin-bottom: 0.25rem;
        }

        .tool-desc-list li:last-child {
            margin-bottom: 0;
        }

        /* Simple placeholder state while a card's metadata is still loading */
        .tool-card.is-loading .tool-name {
            color: var(--text-secondary);
        }

        .tool-card.is-error .tool-name::after {
            content: " (讀取失敗)";
            font-size: 0.75rem;
            font-weight: 400;
            color: #c0392b;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-container">
            <h1>Toolbox</h1>
            <span class="tool-counter" id="toolCounter">0 Tools</span>
        </div>
        <p>Click any tool card to launch the full utility in a new browser tab.</p>
    </header>

    <!-- Main Container for Cards -->
    <main class="tools-grid" id="toolsGrid"></main>

    <script>
        // ===================================================
        // Sub-tool directory list.
        // Add a new tool by adding its folder name here — nothing else.
        // Name / version / description are auto-parsed from each
        // sub-tool's own index.html <head> <meta> tags.
        // ===================================================
        const toolDirs = [
            "diff-tool",
            "hash-calculator",
            "image-annotator",
            "stopwatch",
        ];

        // Meta tag convention expected inside each sub-tool's <head>:
        //   <meta name="tool-name" content="Stopwatch">
        //   <meta name="tool-version" content="v1.0.0">   (optional — omit to hide the badge)
        //   <meta name="tool-desc" content="First bullet point.">
        //   <meta name="tool-desc" content="Second bullet point.">
        //   ... (repeat tool-desc as many times as needed)

        // Parse a sub-tool's fetched HTML text into { name, version, desc[] }
        function parseToolMeta(htmlText, fallbackDir) {
            const doc = new DOMParser().parseFromString(htmlText, 'text/html');

            const getMeta = (name) => doc.querySelector(`meta[name="${name}"]`);
            const getAllMeta = (name) => Array.from(doc.querySelectorAll(`meta[name="${name}"]`));

            const nameMeta = getMeta('tool-name');
            const versionMeta = getMeta('tool-version');
            const descMetas = getAllMeta('tool-desc');

            return {
                name: nameMeta ? nameMeta.getAttribute('content') : fallbackDir,
                version: versionMeta ? versionMeta.getAttribute('content') : '',
                desc: descMetas.length
                    ? descMetas.map(m => m.getAttribute('content'))
                    : ['(此工具尚未提供說明 meta 標籤)']
            };
        }

        // Build the initial card shell immediately (so the grid + preview
        // iframe render right away), then fill in text once metadata resolves.
        function createCardShell(dir, toolUrl) {
            const card = document.createElement('a');
            card.className = 'tool-card is-loading';
            card.href = toolUrl;
            card.target = '_blank';
            card.dataset.dir = dir;

            card.innerHTML = `
                <div class="preview-container">
                    <iframe src="${toolUrl}" loading="lazy" tabindex="-1"></iframe>
                </div>
                <div class="tool-info">
                    <div class="tool-header">
                        <span class="tool-name">${dir}</span>
                        <span class="tool-version-slot"></span>
                    </div>
                    <ul class="tool-desc-list">
                        <li>載入中...</li>
                    </ul>
                </div>
            `;
            return card;
        }

        function fillCard(card, meta) {
            card.classList.remove('is-loading');

            const versionMarkup = (meta.version && meta.version.trim() !== '')
                ? `<span class="tool-version">${meta.version}</span>`
                : '';

            const descItemsMarkup = meta.desc.map(item => `<li>${item}</li>`).join('');

            card.querySelector('.tool-name').textContent = meta.name;
            card.querySelector('.tool-version-slot').outerHTML = versionMarkup || '<span class="tool-version-slot"></span>';
            card.querySelector('.tool-desc-list').innerHTML = descItemsMarkup;
        }

        async function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const counter = document.getElementById('toolCounter');

            grid.innerHTML = '';
            counter.textContent = `${toolDirs.length} ${toolDirs.length === 1 ? 'Tool' : 'Tools'}`;

            // 1) Render shells immediately for every tool (grid + iframe preview show right away)
            const cards = toolDirs.map(dir => {
                const toolUrl = `./${dir}`;    // ./${dir}/index.html
                const card = createCardShell(dir, toolUrl);
                grid.appendChild(card);
                return { dir, toolUrl, card };
            });

            // 2) Fetch + parse each sub-tool's index.html in parallel, fill in as each resolves
            await Promise.all(cards.map(async ({ dir, toolUrl, card }) => {
                try {
                    const res = await fetch(toolUrl);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const html = await res.text();
                    const meta = parseToolMeta(html, dir);
                    fillCard(card, meta);
                } catch (err) {
                    card.classList.remove('is-loading');
                    card.classList.add('is-error');
                    card.querySelector('.tool-name').textContent = dir;
                    card.querySelector('.tool-desc-list').innerHTML =
                        `<li>無法讀取 ${toolUrl} 的中繼資料</li>`;
                    console.error(`Failed to load metadata for "${dir}":`, err);
                }
            }));
        }

        document.addEventListener('DOMContentLoaded', renderTools);
    </script>
</body>
</html>
